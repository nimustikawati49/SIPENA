<script>
var GuruApp = {};

function GuruApp_init() {
  document.body.classList.add('sp-app-mode');
  document.getElementById('sp-guru-app').classList.remove('hidden');

  document.querySelectorAll('#sp-guru-tabs .sp-tab').forEach(function (btn) {
    btn.addEventListener('click', function () { GuruApp_showTab_(btn.getAttribute('data-tab')); });
  });

  GuruApp_buildContent_();
  GuruApp_wireCorner_();
  GuruApp_load_();
}

function GuruApp_showTab_(tabId) {
  document.querySelectorAll('#sp-guru-tabs .sp-tab').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
  });
  // Selector dibatasi ke ANAK LANGSUNG .sp-panels (bukan ".sp-panel" umum)
  // supaya tidak ikut menimpa sub-tab di dalam panel Nilai yang juga
  // memakai class .sp-panel untuk Input/Rekap.
  document.querySelectorAll('#sp-guru-app > .sp-main > .sp-panels > .sp-panel').forEach(function (p) {
    p.classList.toggle('active', p.id === 'sp-guru-panel-' + tabId);
  });
  if (tabId === 'nilai' && window.NilaiApp_init) window.NilaiApp_init();
  if (tabId === 'jadwal' && window.JadwalGuruApp_init) window.JadwalGuruApp_init();
}

function GuruApp_buildContent_() {
  document.getElementById('sp-guru-panel-dashboard').innerHTML =
    '<div class="sp-section-title">Jadwal Hari Ini</div>' +
    '<div id="sp-guru-jadwal-hari-ini" style="margin-bottom:28px;"></div>' +

    '<div id="sp-guru-profil-card"></div>' +
    '<div id="sp-guru-profil-grid"></div>' +

    '<div class="sp-section-title">Ringkasan</div>' +
    '<div id="sp-guru-stats" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px;"></div>' +

    '<div class="sp-section-title">Ringkasan Nilai</div>' +
    '<div class="msg" style="margin:-6px 0 10px;">Persentase siswa yang sudah lengkap nilainya, dihitung dari jenis nilai yang sudah mulai Anda isi per kelas/mapel. Klik "Detail" untuk lihat siapa saja yang belum, dan nilai jenis apa yang masih kosong.</div>' +
    '<div id="sp-guru-nilai-completion" style="margin-bottom:28px;"></div>';
}

/**
 * GuruApp_toggleCorner_() / GuruApp_wireCorner_()
 * Widget profil pojok kanan atas — menggantikan form "Edit Profil" lama
 * di body dashboard. Nama/NIP/NUPTK tetap read-only (dikelola Superadmin,
 * aturan integritas data dari awal sesi ini) — hanya foto, tanda tangan,
 * dan No. HP yang bisa diubah guru sendiri di sini.
 */
function GuruApp_toggleCorner_() {
  SIPENA_toggleCornerPanel_('sp-corner-guru-trigger', 'sp-corner-guru-panel');
}

function GuruApp_wireCorner_() {
  document.getElementById('sp-corner-guru-foto').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    SIPENA_readFileAsBase64_(file, 1500, function (base64, mimeType, fileName) {
      runServer('uploadMyPhoto', [base64, mimeType, fileName], {
        onSuccess: function (res) {
          SIPENA_toast('Foto diperbarui.');
          var html = SIPENA_avatarHtml_(res.url, '');
          document.getElementById('sp-corner-guru-avatar').innerHTML = html;
          document.getElementById('sp-corner-guru-avatar-big').innerHTML = html;
        }
      });
    });
  });

  document.getElementById('sp-corner-guru-ttd').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    SIPENA_readFileAsBase64_(file, 1500, function (base64, mimeType, fileName) {
      runServer('uploadMySignature', [base64, mimeType, fileName], {
        onSuccess: function () { SIPENA_toast('Tanda tangan diperbarui.'); }
      });
    });
  });

  document.getElementById('sp-form-corner-guru').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var btn = f.querySelector('button[type="submit"]');
    runServer('updateMyProfile', [{ no_hp: f.no_hp.value }], {
      loadingEl: btn,
      onSuccess: function () { SIPENA_toast('No. HP diperbarui.'); }
    });
  });
}

function GuruApp_load_() {
  runServer('getMyDashboard', [], { onSuccess: GuruApp_render_ });
}

function GuruApp_render_(dash) {
  var p = dash.profil || {};

  GuruApp_renderJadwalHariIni_(dash);
  GuruApp_renderNilaiCompletion_(dash);

  document.getElementById('sp-guru-profil-card').innerHTML =
    '<div class="sp-profile-card">' +
    '  <div class="sp-avatar">' + SIPENA_initials_(p.nama_lengkap) + '</div>' +
    '  <div class="sp-profile-info">' +
    '    <div class="sp-profile-name">' + (p.nama_lengkap || '-') + '</div>' +
    '    <div class="sp-profile-meta"><span class="sp-role-badge role-guru">Guru</span>' +
           (p.jabatan ? ' · ' + p.jabatan : '') + (dash.nama_sekolah ? ' · ' + dash.nama_sekolah : '') +
    '    </div>' +
    '  </div>' +
    '</div>';

  document.getElementById('sp-guru-profil-grid').innerHTML =
    '<div class="sp-detail-grid">' +
    GuruApp_detailItem_('NIP', p.nip) +
    GuruApp_detailItem_('NUPTK', p.nuptk) +
    GuruApp_detailItem_('No. HP', p.no_hp) +
    GuruApp_detailItem_('Sekolah', dash.nama_sekolah) +
    '</div>';

  var mapelNames = (dash.mapel || []).map(function (m) { return m.nama_mapel; }).join(', ');
  var kelasNames = (dash.kelas || []).map(function (k) { return k.nama_kelas; }).join(', ');

  document.getElementById('sp-guru-stats').innerHTML =
    GuruApp_statTile_('Mata Pelajaran', dash.ringkasan.jumlah_mapel, mapelNames) +
    GuruApp_statTile_('Kelas', dash.ringkasan.jumlah_kelas, kelasNames) +
    GuruApp_statTile_('Total Siswa', dash.ringkasan.jumlah_siswa) +
    GuruApp_statTile_('Penugasan Aktif', dash.ringkasan.jumlah_penugasan_aktif);

  var avatarHtml = SIPENA_avatarHtml_(p.foto_url, p.nama_lengkap);
  document.getElementById('sp-corner-guru-avatar').innerHTML = avatarHtml;
  document.getElementById('sp-corner-guru-avatar-big').innerHTML = avatarHtml;
  document.getElementById('sp-corner-guru-readonly').innerHTML =
    GuruApp_detailItem_('NIP', p.nip) + GuruApp_detailItem_('NUPTK', p.nuptk);
  document.getElementById('sp-form-corner-guru').no_hp.value = p.no_hp || '';
}

function GuruApp_hariLabel_(hari) {
  return hari ? (hari.charAt(0) + hari.slice(1).toLowerCase()) : '-';
}

function GuruApp_renderJadwalHariIni_(dash) {
  var el = document.getElementById('sp-guru-jadwal-hari-ini');
  var rows = dash.jadwal_hari_ini || [];
  if (!rows.length) {
    el.innerHTML = '<div class="sp-form" style="padding:16px 18px;">Tidak ada jadwal mengajar hari ' + GuruApp_hariLabel_(dash.hari_ini) + '.</div>';
    return;
  }
  el.innerHTML = '<div class="sp-form" style="flex-direction:column;align-items:stretch;padding:16px 18px;">' +
    '<div style="font-weight:700;margin-bottom:8px;">' + GuruApp_hariLabel_(dash.hari_ini) + '</div>' +
    rows.map(function (r) {
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--border);">' +
        '<div><strong>' + r.jam_mulai + '–' + r.jam_selesai + '</strong> · ' + r.nama_mapel + ' · ' + r.nama_kelas + '</div>' +
        '<div style="color:var(--text-muted);">' + (r.ruangan || '-') + '</div></div>';
    }).join('') + '</div>';
}

function GuruApp_renderNilaiCompletion_(dash) {
  window.GuruApp._completion = dash.nilai_completion || [];
  var el = document.getElementById('sp-guru-nilai-completion');
  if (!window.GuruApp._completion.length) {
    el.innerHTML = '<div class="sp-empty">Belum ada nilai yang diinput sama sekali.</div>';
    return;
  }
  el.innerHTML = window.GuruApp._completion.map(function (c, i) {
    var color = c.persentase === 100 ? 'var(--ok)' : (c.persentase < 50 ? 'var(--danger)' : 'var(--brand)');
    return '<div class="sp-form" style="flex-direction:column;align-items:stretch;margin-bottom:8px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
      '  <div><strong>' + c.nama_mapel + '</strong> · ' + c.nama_kelas + ' <span class="msg" style="margin:0;display:inline;">(' + c.jenis_nilai_list.join(', ') + ')</span></div>' +
      '  <div style="display:flex;align-items:center;gap:10px;">' +
      '    <span style="font-weight:700;color:' + color + ';">' + c.persentase + '%</span>' +
      '    <span class="msg" style="margin:0;">' + c.siswa_lengkap + '/' + c.total_siswa + ' siswa lengkap</span>' +
      (c.siswa_belum.length ? '    <button type="button" class="sp-btn secondary" onclick="GuruApp_toggleCompletionDetail_(' + i + ')">Detail</button>' : '') +
      '  </div>' +
      '</div>' +
      '<div class="hidden" id="sp-guru-completion-detail-' + i + '" style="margin-top:10px;"></div>' +
      '</div>';
  }).join('');
}

function GuruApp_toggleCompletionDetail_(i) {
  var box = document.getElementById('sp-guru-completion-detail-' + i);
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
  var c = window.GuruApp._completion[i];
  box.innerHTML = '<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>Nama Siswa</th><th>Nilai Belum Ada</th></tr></thead><tbody>' +
    c.siswa_belum.map(function (s) { return '<tr><td>' + s.nama_lengkap + '</td><td>' + s.jenis_belum.join(', ') + '</td></tr>'; }).join('') +
    '</tbody></table></div>';
  box.classList.remove('hidden');
}

function GuruApp_detailItem_(label, value) {
  return '<div class="item"><div class="sp-detail-label">' + label + '</div><div class="sp-detail-value">' + (value || '-') + '</div></div>';
}

function GuruApp_statTile_(label, value, sublist) {
  return '<div class="sp-form" style="flex-direction:column;align-items:flex-start;min-width:150px;max-width:230px;padding:14px 18px;">' +
    '<div style="font-size:26px;font-weight:700;color:var(--brand);">' + value + '</div>' +
    '<div style="font-size:12px;color:var(--text-muted);">' + label + '</div>' +
    (sublist ? '<div style="font-size:11.5px;color:var(--text-muted);line-height:1.4;margin-top:4px;">' + sublist + '</div>' : '') +
    '</div>';
}
</script>
