<script>
var NilaiApp = { initialized: false, penugasan: [], currentContext: null, students: [], original: {}, dirty: {}, focusCol: '' };

var NILAI_HARIAN_JENIS = ['tgs1', 'tgs2', 'tgs3', 'uh1', 'uh2', 'uh3'];

function NilaiApp_init() {
  if (NilaiApp.initialized) return;
  NilaiApp.initialized = true;
  document.getElementById('sp-guru-panel-nilai').innerHTML = NilaiApp_markup_();
  NilaiApp_wire_();
  NilaiApp_loadPenugasan_();
}

/**
 * NilaiApp_assessmentLabel_(semester)
 * Salinan identik Nilai_getAssessmentLabel_ di Nilai.gs — dipakai untuk
 * preview label kolom di klien sebelum respons server datang.
 */
function NilaiApp_assessmentLabel_(semester) {
  return semester === 'GENAP' ? 'ASAT' : 'ASAS';
}

function NilaiApp_markup_() {
  return '' +
    '<div class="sp-tabs" id="sp-nilai-subtabs" style="border-bottom:none;margin-bottom:16px;">' +
    '  <button class="sp-tab active" data-subtab="input">Input Nilai</button>' +
    '  <button class="sp-tab" data-subtab="rekap">Rekap Nilai</button>' +
    '  <button class="sp-tab" data-subtab="cetak">Cetak Nilai</button>' +
    '</div>' +

    '<div class="sp-panel active" id="sp-nilai-sub-input">' +
    '  <div class="sp-form" id="sp-nilai-filter">' +
    '    <div class="sp-field"><label>Penugasan (Mapel — Kelas — Periode)</label><select id="sp-nilai-penugasan" style="min-width:280px;" required></select></div>' +
    '    <button type="button" class="sp-btn" onclick="NilaiApp_loadGrades_()">Tampilkan</button>' +
    '  </div>' +

    '  <div id="sp-nilai-settings-box" class="hidden" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;">' +
    '    <button type="button" class="sp-btn secondary" onclick="NilaiApp_toggleSettings_()">Atur KKM, Katrol Komponen &amp; Nilai Rapor</button>' +
    '    <button type="button" class="sp-btn secondary" onclick="KatrolApp_open_()">Katrol Nilai Akhir</button>' +
    '    <form class="sp-form hidden" id="sp-nilai-settings-form" style="margin-top:10px;flex-basis:100%;">' +
    '      <div class="sp-field"><label>KKM</label><input name="kkm" type="number" min="0" max="100" required></div>' +
    '      <div class="sp-field"><label>Nilai KKTP</label><input name="nilai_kktp" type="number" min="0" max="100" placeholder="Default sistem"></div>' +
    '      <div class="sp-field"><label>Nilai Min Katrol Komponen</label><input name="nilai_min_target" type="number" min="0" max="100" required></div>' +
    '      <div class="sp-field"><label>Nilai Max Katrol Komponen</label><input name="nilai_max_target" type="number" min="0" max="100" required></div>' +
    '      <div class="sp-field"><label>Sumber Nilai Rapor</label><select name="sumber_nilai_rapor"><option value="MURNI">Nilai Akhir Murni</option><option value="KATROL">Nilai Akhir Katrol</option></select></div>' +
    '      <div class="msg" style="flex-basis:100%;margin:-2px 0 0;">Nilai KKTP menentukan kategori & status ketercapaian siswa (kebijakan Anda sendiri, bukan diatur Superadmin) — kosongkan untuk pakai default sistem sesuai jenjang/tingkat kelas ini.</div>' +
    '      <button class="sp-btn" type="submit">Simpan Pengaturan</button>' +
    '    </form>' +
    '  </div>' +

    '  <div id="sp-nilai-col-toggle" class="hidden" style="margin-bottom:10px;"></div>' +
    '  <div id="sp-nilai-completeness" class="hidden msg" style="margin:-4px 0 10px;"></div>' +
    '  <div id="sp-nilai-table"></div>' +
    '  <button type="button" class="sp-btn hidden" id="sp-nilai-save-btn" style="margin-top:14px;" onclick="NilaiApp_saveGrades_()">Simpan Perubahan</button>' +

    '  <div id="sp-katrol-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;">' +
    '    <div style="background:var(--card);border-radius:14px;padding:24px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);">' +
    '      <div class="sp-section-title">Katrol Nilai Akhir</div>' +
    '      <div id="sp-katrol-context" class="msg" style="margin:-6px 0 14px;"></div>' +
    '      <div id="sp-katrol-empty" class="hidden msg" style="margin-bottom:14px;"></div>' +
    '      <div id="sp-katrol-body">' +
    '        <div id="sp-katrol-source" class="sp-detail-grid" style="margin-bottom:14px;"></div>' +
    '        <form class="sp-form" id="sp-katrol-form" style="margin-bottom:14px;" onsubmit="return false;">' +
    '          <div class="sp-field"><label>Target Min</label><input name="target_min" type="number" min="0" max="100" required></div>' +
    '          <div class="sp-field"><label>Target Max</label><input name="target_max" type="number" min="0" max="100" required></div>' +
    '        </form>' +
    '        <div id="sp-katrol-uniform" class="hidden msg danger" style="margin-bottom:14px;"></div>' +
    '        <div id="sp-katrol-preview"></div>' +
    '      </div>' +
    '      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">' +
    '        <button type="button" class="sp-btn secondary" onclick="KatrolApp_close_()">Batal</button>' +
    '        <button type="button" class="sp-btn hidden" id="sp-katrol-save-btn" onclick="KatrolApp_save_()">Simpan Nilai Katrol</button>' +
    '        <button type="button" class="sp-btn secondary hidden" id="sp-katrol-reset-btn" onclick="KatrolApp_reset_()" style="margin-left:auto;">Reset Katrol</button>' +
    '      </div>' +
    '      <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px;">' +
    '        <button type="button" class="sp-btn secondary" onclick="KatrolApp_toggleHistory_()">Riwayat Katrol</button>' +
    '        <div id="sp-katrol-history-box" class="hidden" style="margin-top:12px;"></div>' +
    '      </div>' +
    '    </div>' +
    '  </div>' +
    '</div>' +

    '<div class="sp-panel" id="sp-nilai-sub-rekap">' +
    '  <div class="sp-form" id="sp-rekap-filter">' +
    '    <div class="sp-field"><label>Penugasan (Mapel — Kelas — Periode)</label><select id="sp-rekap-penugasan" style="min-width:280px;" required></select></div>' +
    '    <button type="button" class="sp-btn" onclick="NilaiApp_loadRecap_()">Tampilkan Rekap</button>' +
    '  </div>' +
    '  <div id="sp-rekap-actions" class="hidden" style="margin-bottom:10px;display:flex;gap:10px;">' +
    '    <button type="button" class="sp-btn secondary" onclick="NilaiApp_exportRecapExcel_()">Export Excel</button>' +
    '    <button type="button" class="sp-btn secondary" onclick="NilaiApp_printRecap_()">Cetak</button>' +
    '  </div>' +
    '  <div id="sp-rekap-print-head" class="sp-print-only hidden"></div>' +
    '  <div id="sp-rekap-table"></div>' +
    '</div>' +

    '<div class="sp-panel" id="sp-nilai-sub-cetak">' + PrintApp_markup_() + '</div>';
}

function NilaiApp_wire_() {
  document.querySelectorAll('#sp-nilai-subtabs .sp-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#sp-nilai-subtabs .sp-tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
      var sub = btn.getAttribute('data-subtab');
      document.getElementById('sp-nilai-sub-input').classList.toggle('active', sub === 'input');
      document.getElementById('sp-nilai-sub-rekap').classList.toggle('active', sub === 'rekap');
      document.getElementById('sp-nilai-sub-cetak').classList.toggle('active', sub === 'cetak');
      if (sub === 'cetak' && window.PrintApp_onShow_) window.PrintApp_onShow_();
    });
  });

  document.getElementById('sp-nilai-settings-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var ctx = NilaiApp.currentContext;
    if (!ctx) return;
    var btn = f.querySelector('button[type="submit"]');
    runServer('saveMyGradeSettings', [ctx.kelasId, ctx.mapelId, ctx.tahunAjaranId, ctx.semester, f.kkm.value, f.nilai_min_target.value, f.nilai_max_target.value, f.sumber_nilai_rapor.value, f.nilai_kktp.value], {
      loadingEl: btn,
      onSuccess: function () { SIPENA_toast('Pengaturan disimpan.'); NilaiApp_loadGrades_(); }
    });
  });

  var katrolForm = document.getElementById('sp-katrol-form');
  ['target_min', 'target_max'].forEach(function (name) {
    katrolForm[name].addEventListener('input', KatrolApp_scheduleAutoPreview_);
  });

  PrintApp_wire_();
}

function NilaiApp_toggleSettings_() {
  document.getElementById('sp-nilai-settings-form').classList.toggle('hidden');
}

function NilaiApp_loadPenugasan_() {
  runServer('getMyDashboard', [], {
    onSuccess: function (dash) {
      NilaiApp.penugasan = (dash.penugasan || []).filter(function (p) { return String(p.status).toUpperCase() === 'AKTIF'; });
      var options = '<option value="">Pilih...</option>' + NilaiApp.penugasan.map(function (p, i) {
        return '<option value="' + i + '">' + p.nama_mapel + ' — ' + p.nama_kelas + ' — ' + p.semester + '</option>';
      }).join('');
      document.getElementById('sp-nilai-penugasan').innerHTML = options;
      document.getElementById('sp-rekap-penugasan').innerHTML = options;
    }
  });
}

function NilaiApp_selectedPenugasan_(selectId) {
  var idx = document.getElementById(selectId).value;
  if (idx === '') return null;
  return NilaiApp.penugasan[Number(idx)];
}

function NilaiApp_loadGrades_() {
  var p = NilaiApp_selectedPenugasan_('sp-nilai-penugasan');
  if (!p) { SIPENA_toast('Pilih penugasan dulu.', 'error'); return; }

  NilaiApp.currentContext = { kelasId: p.kelas_id, mapelId: p.mapel_id, tahunAjaranId: p.tahun_ajaran_id, semester: p.semester };
  NilaiApp.dirty = {};

  runServer('getMyGradeSheetWide', [p.kelas_id, p.mapel_id, p.tahun_ajaran_id, p.semester], {
    onSuccess: function (res) {
      document.getElementById('sp-nilai-settings-box').classList.remove('hidden');
      var f = document.getElementById('sp-nilai-settings-form');
      f.kkm.value = res.settings.kkm;
      f.nilai_min_target.value = res.settings.nilai_min_target;
      f.nilai_max_target.value = res.settings.nilai_max_target;
      f.sumber_nilai_rapor.value = res.settings.sumber_nilai_rapor;
      f.nilai_kktp.value = res.settings.nilai_kktp !== '' ? res.settings.nilai_kktp : '';
      f.nilai_kktp.placeholder = 'Default sistem (' + res.kktpDefaultValue + ')';

      NilaiApp.currentContext.bobotConfig = res.bobotConfig;
      NilaiApp.currentContext.assessmentLabel = res.assessmentLabel;
      NilaiApp.currentContext.assessmentDisplayLabel = res.assessmentDisplayLabel;
      NilaiApp.students = res.students;
      NilaiApp.original = {};
      res.students.forEach(function (s) { NilaiApp.original[s.siswa_id] = Object.assign({}, s); });

      NilaiApp_renderGradeTable_();
      document.getElementById('sp-nilai-save-btn').classList.toggle('hidden', res.students.length === 0);
    }
  });
}

function NilaiApp_gradeColumns_() {
  // key TETAP dari assessmentLabel (ASAS/ASAT — nama field wide.asat/
  // wide.asas dari server, lihat Nilai_getAssessmentLabel_) — cuma label
  // yang ditampilkan boleh beda ("US" untuk kelas besar semester genap).
  var key = NilaiApp.currentContext.assessmentLabel;
  var displayLabel = NilaiApp.currentContext.assessmentDisplayLabel || key;
  return [
    { key: 'tgs1', label: 'TGS 1' }, { key: 'tgs2', label: 'TGS 2' }, { key: 'tgs3', label: 'TGS 3' },
    { key: 'uh1', label: 'UH 1' }, { key: 'uh2', label: 'UH 2' }, { key: 'uh3', label: 'UH 3' },
    { key: 'pts', label: 'PTS' }, { key: key.toLowerCase(), label: displayLabel }
  ];
}

/**
 * NilaiApp_renderColToggle_()
 * Pil "Semua" + satu pil per jenis nilai — pilih satu untuk fokus entri
 * cepat (sembunyikan kolom lain supaya tidak perlu geser ke samping),
 * atau "Semua" untuk lihat/edit semua kolom seperti biasa.
 */
function NilaiApp_renderColToggle_() {
  var box = document.getElementById('sp-nilai-col-toggle');
  var cols = NilaiApp_gradeColumns_();
  var pills = [{ key: '', label: 'Semua' }].concat(cols);
  box.classList.remove('hidden');
  box.innerHTML = pills.map(function (c) {
    var active = NilaiApp.focusCol === c.key;
    return '<button type="button" class="sp-btn' + (active ? '' : ' secondary') + '" style="margin:0 6px 6px 0;padding:6px 14px;font-size:12.5px;" ' +
      'onclick="NilaiApp_setFocusCol_(\'' + c.key + '\')">' + c.label + '</button>';
  }).join('');
}

function NilaiApp_setFocusCol_(key) {
  NilaiApp.focusCol = key;
  NilaiApp_renderColToggle_();
  NilaiApp_renderGradeTable_();
}

function NilaiApp_renderGradeTable_() {
  var el = document.getElementById('sp-nilai-table');
  var students = NilaiApp.students;
  if (!students.length) { el.innerHTML = '<div class="sp-empty">Belum ada siswa aktif di kelas ini. Hubungi Superadmin untuk mengelola roster.</div>'; return; }

  NilaiApp_renderColToggle_();

  var allCols = NilaiApp_gradeColumns_();
  var focused = !!NilaiApp.focusCol;
  var cols = focused ? allCols.filter(function (c) { return c.key === NilaiApp.focusCol; }) : allCols;

  var thead = '<tr><th class="sp-sticky-col sp-sticky-col-1">No</th><th class="sp-sticky-col sp-sticky-col-2">NIS</th><th class="sp-sticky-col sp-sticky-col-3">Nama</th>' +
    cols.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') +
    (focused
      ? '<th>Nilai Akhir</th>'
      : '<th>Rata-rata Harian</th><th>Nilai Akhir (Murni)</th><th>Nilai Akhir (Katrol)</th><th>Status</th><th>KKTP</th><th>Kategori</th><th>Ketercapaian</th>') +
    '</tr>';

  var rows = students.map(function (s, i) {
    var pindahanNote = s.dari_sekolah_asal ? ' <span class="msg" style="margin:0;">(dari sekolah asal)</span>' : '';
    var cells = cols.map(function (c) {
      var cv = NilaiApp_valueFor_(s.siswa_id, c.key);
      return '<td><input type="number" min="0" max="100" step="0.01" class="sp-nilai-input" ' +
        'data-siswa="' + s.siswa_id + '" data-col="' + c.key + '" data-row-index="' + i + '" value="' + (cv !== '' && cv !== null && cv !== undefined ? cv : '') + '" ' +
        'style="width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);"></td>';
    }).join('');
    var belumTercapai = s.status_ketercapaian === 'BELUM_TERCAPAI';
    var isDirty = !!NilaiApp.dirty[s.siswa_id];
    var extraCols = focused
      ? '<td id="sp-nilai-akhir-' + s.siswa_id + '">' + NilaiApp_fmt_(s.nilai_akhir_murni) + '</td>'
      : '<td id="sp-nilai-rata-' + s.siswa_id + '">' + NilaiApp_fmt_(s.rata_rata_harian) + '</td>' +
        '<td id="sp-nilai-akhir-' + s.siswa_id + '">' + NilaiApp_fmt_(s.nilai_akhir_murni) + '</td>' +
        '<td>' + (s.nilai_akhir_katrol !== '' ? NilaiApp_fmt_(s.nilai_akhir_katrol) : '-') + '</td>' +
        '<td id="sp-nilai-status-' + s.siswa_id + '">' + NilaiApp_statusBadge_(s.status_nilai) + '</td>' +
        '<td>' + (s.nilai_kktp !== '' ? s.nilai_kktp : '-') + '</td>' +
        '<td>' + (s.kategori || '-') + '</td>' +
        '<td>' + NilaiApp_ketercapaianBadge_(s.status_ketercapaian) + '</td>';
    var rowClasses = [belumTercapai ? 'sp-row-belum-tercapai' : '', isDirty ? 'sp-row-dirty' : ''].filter(Boolean).join(' ');
    return '<tr id="sp-nilai-row-' + s.siswa_id + '"' + (rowClasses ? ' class="' + rowClasses + '"' : '') + '>' +
      '<td class="sp-sticky-col sp-sticky-col-1">' + (i + 1) + '</td>' +
      '<td class="sp-sticky-col sp-sticky-col-2">' + (s.nis || '-') + '</td>' +
      '<td class="sp-sticky-col sp-sticky-col-3">' + s.nama_lengkap + pindahanNote + '</td>' +
      cells + extraCols +
      '</tr>';
  }).join('');

  el.innerHTML = '<div class="sp-table-wrap"><table class="sp-table"><thead>' + thead + '</thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="msg">Kosongkan sel untuk siswa yang belum memiliki nilai jenis itu — jangan diisi 0. Rata-rata Harian &amp; Nilai Akhir dihitung otomatis saat mengetik. Tempel (paste) sekumpulan nilai dari Excel ke satu sel untuk mengisi ke bawah otomatis. Baris kuning = status ketercapaian di bawah KKTP. Klik "Simpan Perubahan" untuk menyimpan ke database.</div>';

  NilaiApp_updateCompleteness_();

  el.querySelectorAll('.sp-nilai-input').forEach(function (input) {
    input.addEventListener('input', NilaiApp_onCellInput_);
    input.addEventListener('keydown', NilaiApp_onCellKeydown_);
    input.addEventListener('paste', NilaiApp_onCellPaste_);
  });

  Object.keys(NilaiApp.dirty).forEach(NilaiApp_recomputeRow_);
}

function NilaiApp_fmt_(v) {
  if (v === '' || v === null || v === undefined || isNaN(v)) return '-';
  var places = (NilaiApp.currentContext.bobotConfig && NilaiApp.currentContext.bobotConfig.decimal_places) || 2;
  return Number(v).toFixed(places);
}

/**
 * NilaiApp_updateCompleteness_()
 * Hitung dari kolom yang SEDANG TAMPIL saja (satu jenis kalau fokus,
 * semua jenis kalau "Semua") — supaya angkanya relevan dengan apa yang
 * sedang dikerjakan guru, bukan gabungan semua kolom ekstra kembar.
 */
function NilaiApp_updateCompleteness_() {
  var box = document.getElementById('sp-nilai-completeness');
  var allCols = NilaiApp_gradeColumns_();
  var cols = NilaiApp.focusCol ? allCols.filter(function (c) { return c.key === NilaiApp.focusCol; }) : allCols;
  var total = 0, filled = 0;
  NilaiApp.students.forEach(function (s) {
    cols.forEach(function (c) {
      total++;
      var v = NilaiApp_valueFor_(s.siswa_id, c.key);
      if (v !== '' && v !== null && v !== undefined) filled++;
    });
  });
  var pct = total ? Math.round((filled / total) * 100) : 0;
  box.classList.remove('hidden');
  box.textContent = 'Kelengkapan: ' + filled + '/' + total + ' (' + pct + '%) · Kosong: ' + (total - filled);
}

/**
 * NilaiApp_onCellPaste_(e)
 * Tempel sekumpulan nilai (mis. dari kolom Excel, dipisah baris baru)
 * ke satu sel — otomatis mengisi sel yang sama di baris-baris berikutnya
 * pada kolom yang sama, bukan cuma sel yang ditempel.
 */
function NilaiApp_onCellPaste_(e) {
  var text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text || text.indexOf('\n') === -1 && text.indexOf('\t') === -1) return; // paste satu nilai biasa, biarkan default
  e.preventDefault();

  var values = text.split(/\r?\n/).map(function (line) { return line.split('\t')[0].trim(); }).filter(function (v, idx, arr) { return !(v === '' && idx === arr.length - 1); });
  var startIndex = Number(e.target.getAttribute('data-row-index'));
  var col = e.target.getAttribute('data-col');

  values.forEach(function (v, offset) {
    var target = document.querySelector('.sp-nilai-input[data-col="' + col + '"][data-row-index="' + (startIndex + offset) + '"]');
    if (!target) return;
    target.value = v;
    target.dispatchEvent(new Event('input', { bubbles: true }));
  });
}

function NilaiApp_statusBadge_(status) {
  if (status === 'LENGKAP') return '<span class="badge ok">Lengkap</span>';
  return '<span class="badge danger">Belum Lengkap</span>';
}

function NilaiApp_ketercapaianBadge_(status) {
  if (status === 'TERCAPAI') return '<span class="badge ok">Tercapai</span>';
  if (status === 'BELUM_TERCAPAI') return '<span class="badge danger">Belum Tercapai</span>';
  return '-';
}

/**
 * NilaiApp_calcRow_(values)
 * Salinan identik Nilai_calculateDailyAverage_/Nilai_calculateFinalScore_
 * di Nilai.gs — preview instan di klien saat mengetik, tanpa panggilan
 * server. Hasil akhir yang tersimpan tetap ditentukan backend saat
 * "Simpan Perubahan" (backend adalah sumber kebenaran).
 */
function NilaiApp_calcDailyAverage_(values) {
  var nums = values.filter(function (v) { return v !== '' && v !== null && v !== undefined && !isNaN(v); }).map(Number);
  if (!nums.length) return '';
  return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
}

function NilaiApp_calcFinalScore_(rataHarian, pts, akhirSemester, bobotConfig) {
  var comps = [
    { value: rataHarian, weight: bobotConfig.bobot_harian },
    { value: pts, weight: bobotConfig.bobot_pts },
    { value: akhirSemester, weight: bobotConfig.bobot_akhir_semester }
  ];
  var available = comps.filter(function (c) { return c.value !== '' && c.value !== null && c.value !== undefined && !isNaN(c.value); });

  if (bobotConfig.mode_perhitungan === 'KOMPONEN_TERSEDIA') {
    if (!available.length) return { nilai: '', status: 'BELUM_LENGKAP' };
    var totalWeight = available.reduce(function (s, c) { return s + c.weight; }, 0);
    var weighted = available.reduce(function (s, c) { return s + c.value * c.weight; }, 0);
    return { nilai: totalWeight ? weighted / totalWeight : '', status: available.length === comps.length ? 'LENGKAP' : 'BELUM_LENGKAP' };
  }

  if (available.length !== comps.length) return { nilai: '', status: 'BELUM_LENGKAP' };
  var nilai = comps.reduce(function (s, c) { return s + c.value * c.weight; }, 0) / 100;
  return { nilai: nilai, status: 'LENGKAP' };
}

function NilaiApp_onCellInput_(e) {
  var input = e.target;
  var siswaId = input.getAttribute('data-siswa');
  var col = input.getAttribute('data-col');
  var raw = input.value.trim();

  if (raw !== '' && (isNaN(raw) || Number(raw) < 0 || Number(raw) > 100)) {
    input.classList.add('sp-input-error');
    input.title = 'Nilai harus antara 0–100.';
  } else {
    input.classList.remove('sp-input-error');
    input.title = '';
  }

  if (!NilaiApp.dirty[siswaId]) NilaiApp.dirty[siswaId] = {};
  NilaiApp.dirty[siswaId][col] = raw;

  var row = document.getElementById('sp-nilai-row-' + siswaId);
  if (row) row.classList.add('sp-row-dirty');

  NilaiApp_recomputeRow_(siswaId);
  NilaiApp_updateCompleteness_();
}

function NilaiApp_valueFor_(siswaId, col) {
  var dirtyRow = NilaiApp.dirty[siswaId];
  if (dirtyRow && dirtyRow.hasOwnProperty(col)) return dirtyRow[col];
  var orig = NilaiApp.original[siswaId];
  return orig ? orig[col] : '';
}

function NilaiApp_recomputeRow_(siswaId) {
  var harian = NILAI_HARIAN_JENIS.map(function (c) { return NilaiApp_valueFor_(siswaId, c); });
  var rataHarian = NilaiApp_calcDailyAverage_(harian);
  var pts = NilaiApp_valueFor_(siswaId, 'pts');
  var label = NilaiApp.currentContext.assessmentLabel.toLowerCase();
  var akhirSem = NilaiApp_valueFor_(siswaId, label);
  var result = NilaiApp_calcFinalScore_(rataHarian, pts, akhirSem, NilaiApp.currentContext.bobotConfig);

  var rataEl = document.getElementById('sp-nilai-rata-' + siswaId);
  var akhirEl = document.getElementById('sp-nilai-akhir-' + siswaId);
  var statusEl = document.getElementById('sp-nilai-status-' + siswaId);
  if (rataEl) rataEl.textContent = NilaiApp_fmt_(rataHarian);
  if (akhirEl) akhirEl.textContent = NilaiApp_fmt_(result.nilai);
  if (statusEl) statusEl.innerHTML = NilaiApp_statusBadge_(result.status);
}

/**
 * NilaiApp_onCellKeydown_(e)
 * Enter/ArrowDown pindah ke sel yang sama baris berikutnya, ArrowUp ke
 * baris sebelumnya — Tab dan panah kiri/kanan pakai perilaku browser
 * bawaan.
 */
function NilaiApp_onCellKeydown_(e) {
  if (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  var input = e.target;
  var row = input.closest('tr');
  var targetRow = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling;
  if (!targetRow) return;
  var col = input.getAttribute('data-col');
  var targetInput = targetRow.querySelector('.sp-nilai-input[data-col="' + col + '"]');
  if (targetInput) targetInput.focus();
}

function NilaiApp_saveGrades_() {
  var ctx = NilaiApp.currentContext;
  if (!ctx) return;

  var invalid = document.querySelector('.sp-input-error');
  if (invalid) { SIPENA_toast('Perbaiki nilai yang tidak valid (harus 0–100) sebelum menyimpan.', 'error'); invalid.focus(); return; }

  var siswaIds = Object.keys(NilaiApp.dirty);
  if (!siswaIds.length) { SIPENA_toast('Tidak ada perubahan untuk disimpan.', 'error'); return; }

  var rows = siswaIds.map(function (siswaId) {
    var row = { siswa_id: siswaId };
    NilaiApp_gradeColumns_().forEach(function (c) { row[c.key] = NilaiApp_valueFor_(siswaId, c.key); });
    return row;
  });

  var btn = document.getElementById('sp-nilai-save-btn');
  runServer('saveMyGradeSheetBatch', [ctx.kelasId, ctx.mapelId, ctx.tahunAjaranId, ctx.semester, rows], {
    loadingEl: btn,
    onSuccess: function (res) {
      SIPENA_toast(res.saved + ' siswa tersimpan & nilai akhir dihitung ulang.');
      NilaiApp_loadGrades_();
    }
  });
}

function NilaiApp_loadRecap_() {
  var p = NilaiApp_selectedPenugasan_('sp-rekap-penugasan');
  if (!p) { SIPENA_toast('Pilih penugasan dulu.', 'error'); return; }
  window.NilaiApp._rekapPenugasan = p;
  runServer('getMyGradeRecap', [p.kelas_id, p.mapel_id, p.tahun_ajaran_id, p.semester], {
    onSuccess: function (rows) { NilaiApp_renderRecap_(rows); }
  });
}

function NilaiApp_renderRecap_(rows) {
  var el = document.getElementById('sp-rekap-table');
  document.getElementById('sp-rekap-actions').classList.add('hidden');
  if (!rows.length) { el.innerHTML = '<div class="sp-empty">Belum ada siswa di kelas ini.</div>'; return; }

  var jenisSet = {};
  rows.forEach(function (r) { r.nilai.forEach(function (n) { jenisSet[n.jenis_nilai] = true; }); });
  var jenisList = Object.keys(jenisSet);
  if (!jenisList.length) { el.innerHTML = '<div class="sp-empty">Belum ada nilai yang diinput untuk kelas/mapel/periode ini.</div>'; return; }

  window.NilaiApp._rekapRows = rows;
  window.NilaiApp._rekapJenisList = jenisList;
  document.getElementById('sp-rekap-actions').classList.remove('hidden');
  var p = window.NilaiApp._rekapPenugasan;
  document.getElementById('sp-rekap-print-head').innerHTML =
    '<h2 style="margin:0 0 2px;">Rekap Nilai — ' + p.nama_mapel + '</h2>' +
    '<div style="margin:0 0 16px;color:#555;">Kelas ' + p.nama_kelas + ' &middot; ' + p.semester + '</div>';

  var thead = '<tr><th>NIS</th><th>Nama</th>' + jenisList.map(function (j) { return '<th>' + j + '</th>'; }).join('') +
    '<th>Rata-rata Harian</th><th>Nilai Akhir</th><th>Status</th><th>KKTP</th><th>Kategori</th><th>Ketercapaian</th></tr>';
  var tbody = rows.map(function (r) {
    var byJenis = {};
    r.nilai.forEach(function (n) { byJenis[n.jenis_nilai] = n; });
    var cells = jenisList.map(function (j) {
      var n = byJenis[j];
      if (!n) return '<td>-</td>';
      return '<td>' + n.nilai_murni + (n.nilai_katrol !== '' ? ' / ' + n.nilai_katrol : '') + '</td>';
    }).join('');
    var akhirCell = r.nilai_akhir_murni !== '' ? (r.nilai_akhir_murni + (r.nilai_akhir_katrol !== '' ? ' / ' + r.nilai_akhir_katrol : '')) : '-';
    return '<tr><td>' + (r.nis || '-') + '</td><td>' + r.nama_lengkap + '</td>' + cells +
      '<td>' + (r.rata_rata_harian !== '' ? r.rata_rata_harian : '-') + '</td>' +
      '<td>' + akhirCell + '</td>' +
      '<td>' + NilaiApp_statusBadge_(r.status_nilai) + '</td>' +
      '<td>' + (r.nilai_kktp !== '' ? r.nilai_kktp : '-') + '</td>' +
      '<td>' + (r.kategori || '-') + '</td>' +
      '<td>' + NilaiApp_ketercapaianBadge_(r.status_ketercapaian) + '</td></tr>';
  }).join('');

  el.innerHTML = '<div class="sp-table-wrap"><table class="sp-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>' +
    '<div class="msg">Format sel komponen: nilai murni / nilai katrol.</div>';
}

/**
 * NilaiApp_exportRecapExcel_()
 * Rekap ditulis ulang di SERVER ke sheet helper di spreadsheet guru
 * sendiri, lalu dibuka lewat URL export-xlsx native Google Sheets —
 * BUKAN client-side XLSX.writeFile, yang gagal diam-diam di dalam
 * iframe sandbox HtmlService (lihat Utils_writeExportSheetAndGetUrl_).
 */
function NilaiApp_exportRecapExcel_() {
  var p = window.NilaiApp._rekapPenugasan;
  if (!window.NilaiApp._rekapRows || !p) { SIPENA_toast('Tampilkan rekap dulu.', 'error'); return; }
  runServer('exportMyGradeRecapUrl', [p.kelas_id, p.mapel_id, p.tahun_ajaran_id, p.semester], {
    onSuccess: function (res) { window.open(res.export_url, '_blank'); }
  });
}

/**
 * NilaiApp_printRecap_()
 * Cetak lewat window.print() bawaan browser + CSS @media print (lihat
 * styles.html: .sp-print-only / .sp-hide-print) yang menyembunyikan
 * topbar/tab/form dan cuma menampilkan judul + tabel rekap.
 */
function NilaiApp_printRecap_() {
  if (!window.NilaiApp._rekapRows) { SIPENA_toast('Tampilkan rekap dulu.', 'error'); return; }
  document.body.classList.add('sp-printing');
  window.print();
  document.body.classList.remove('sp-printing');
}

/* ================= Katrol Nilai Akhir ================= */
// Preview hidup (auto, di-debounce) tiap Target Min/Max diubah — tidak
// ada lagi tombol "Preview Katrol" terpisah, supaya guru tinggal ganti
// angka dan langsung lihat hasilnya. Simpan tetap aksi eksplisit
// terpisah (tombolnya baru muncul setelah ada preview valid) supaya
// katrol tidak pernah tersimpan tanpa guru melihat hasilnya dulu.
var KatrolApp = { lastPreview: null, debounceTimer: null };

function KatrolApp_open_() {
  var ctx = NilaiApp.currentContext;
  if (!ctx) { SIPENA_toast('Tampilkan tabel nilai dulu.', 'error'); return; }

  var p = NilaiApp_selectedPenugasan_('sp-nilai-penugasan');
  document.getElementById('sp-katrol-context').textContent = (p ? p.nama_mapel + ' — ' + p.nama_kelas + ' — ' + p.semester : '');
  document.getElementById('sp-katrol-source').innerHTML = '';
  document.getElementById('sp-katrol-preview').innerHTML = '';
  document.getElementById('sp-katrol-uniform').classList.add('hidden');
  document.getElementById('sp-katrol-save-btn').classList.add('hidden');
  document.getElementById('sp-katrol-empty').classList.add('hidden');
  document.getElementById('sp-katrol-body').classList.remove('hidden');
  document.getElementById('sp-katrol-reset-btn').classList.remove('hidden');
  document.getElementById('sp-katrol-history-box').classList.add('hidden');
  document.getElementById('sp-katrol-history-box').innerHTML = '';
  KatrolApp.lastPreview = null;

  runServer('getMyKatrolTargetDefault', [ctx.kelasId, ctx.mapelId, ctx.tahunAjaranId, ctx.semester], {
    onSuccess: function (def) {
      var f = document.getElementById('sp-katrol-form');
      f.target_min.value = def.target_min;
      f.target_max.value = def.target_max;
      document.getElementById('sp-katrol-overlay').classList.remove('hidden');
      KatrolApp_preview_();
    }
  });
}

function KatrolApp_close_() {
  document.getElementById('sp-katrol-overlay').classList.add('hidden');
  clearTimeout(KatrolApp.debounceTimer);
}

function KatrolApp_scheduleAutoPreview_() {
  clearTimeout(KatrolApp.debounceTimer);
  KatrolApp.debounceTimer = setTimeout(function () { KatrolApp_preview_(); }, 400);
}

function KatrolApp_showEmpty_(message) {
  document.getElementById('sp-katrol-body').classList.add('hidden');
  document.getElementById('sp-katrol-reset-btn').classList.add('hidden');
  document.getElementById('sp-katrol-save-btn').classList.add('hidden');
  var el = document.getElementById('sp-katrol-empty');
  el.textContent = message;
  el.classList.remove('hidden');
}

function KatrolApp_preview_(uniformValue) {
  var ctx = NilaiApp.currentContext;
  var f = document.getElementById('sp-katrol-form');
  var targetMin = f.target_min.value, targetMax = f.target_max.value;
  if (!targetMin || !targetMax) return;

  runServer('getMyKatrolPreview', [ctx.kelasId, ctx.mapelId, ctx.tahunAjaranId, ctx.semester, targetMin, targetMax, uniformValue], {
    onSuccess: function (res) {
      KatrolApp.lastPreview = res;
      document.getElementById('sp-katrol-source').innerHTML =
        '<div class="item"><div class="sp-detail-label">Jumlah Siswa</div><div class="sp-detail-value">' + res.jumlah_siswa + '</div></div>' +
        '<div class="item"><div class="sp-detail-label">Nilai Murni Terendah</div><div class="sp-detail-value">' + res.source_min + '</div></div>' +
        '<div class="item"><div class="sp-detail-label">Nilai Murni Tertinggi</div><div class="sp-detail-value">' + res.source_max + '</div></div>';

      if (res.uniform && !res.students) {
        document.getElementById('sp-katrol-uniform').classList.remove('hidden');
        document.getElementById('sp-katrol-uniform').innerHTML = res.message +
          '<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
          '<button type="button" class="sp-btn secondary" onclick="KatrolApp_close_()">Tidak melakukan katrol</button>' +
          '<input type="number" min="0" max="100" id="sp-katrol-uniform-value" placeholder="Nilai target" style="width:110px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);">' +
          '<button type="button" class="sp-btn secondary" onclick="KatrolApp_preview_(document.getElementById(\'sp-katrol-uniform-value\').value)">Gunakan nilai target tertentu</button>' +
          '</div>';
        document.getElementById('sp-katrol-preview').innerHTML = '';
        document.getElementById('sp-katrol-save-btn').classList.add('hidden');
        return;
      }

      document.getElementById('sp-katrol-uniform').classList.add('hidden');
      document.getElementById('sp-katrol-preview').innerHTML = '<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>No</th><th>Nama</th><th>Nilai Murni</th><th>Nilai Katrol</th></tr></thead><tbody>' +
        res.students.map(function (s, i) {
          return '<tr><td>' + (i + 1) + '</td><td>' + s.nama_lengkap + '</td><td>' + s.nilai_akhir_murni + '</td><td>' + s.nilai_akhir_katrol_preview + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      document.getElementById('sp-katrol-save-btn').classList.remove('hidden');
    },
    onError: function (msg) {
      if (msg.indexOf('Belum ada Nilai Akhir') !== -1) { KatrolApp_showEmpty_(msg); return; }
      SIPENA_toast(msg, 'error');
    }
  });
}

function KatrolApp_save_() {
  var ctx = NilaiApp.currentContext;
  var f = document.getElementById('sp-katrol-form');
  var preview = KatrolApp.lastPreview;
  if (!preview) { SIPENA_toast('Preview dulu sebelum menyimpan.', 'error'); return; }
  var uniformValue = preview.uniform && preview.students ? preview.students[0].nilai_akhir_katrol_preview : undefined;

  var btn = document.getElementById('sp-katrol-save-btn');
  runServer('saveMyKatrol', [ctx.kelasId, ctx.mapelId, ctx.tahunAjaranId, ctx.semester, f.target_min.value, f.target_max.value, uniformValue], {
    loadingEl: btn,
    onSuccess: function (res) {
      SIPENA_toast('Katrol tersimpan untuk ' + res.jumlah_siswa + ' siswa.');
      KatrolApp_close_();
      NilaiApp_loadGrades_();
    }
  });
}

function KatrolApp_reset_() {
  var ctx = NilaiApp.currentContext;
  if (!ctx) return;
  if (!confirm('Reset nilai katrol untuk kelas/mapel/periode ini? Nilai Akhir Murni tidak akan berubah.')) return;
  runServer('resetMyKatrol', [ctx.kelasId, ctx.mapelId, ctx.tahunAjaranId, ctx.semester], {
    onSuccess: function (res) {
      SIPENA_toast(res.reset + ' nilai katrol direset.');
      KatrolApp_close_();
      NilaiApp_loadGrades_();
    }
  });
}

/**
 * KatrolApp_toggleHistory_() / KatrolApp_renderHistory_(rows)
 * Riwayat SEMUA run katrol guru ini (lintas kelas/mapel/tahun ajaran,
 * bukan cuma konteks yang sedang dibuka) — dikelompokkan per tahun
 * ajaran, terbaru dulu, tahun ajaran paling baru langsung terbuka
 * supaya guru bisa cek riwayat pemberian nilai tahun ajaran terakhir
 * tanpa klik tambahan.
 */
function KatrolApp_toggleHistory_() {
  var box = document.getElementById('sp-katrol-history-box');
  var willOpen = box.classList.contains('hidden');
  box.classList.toggle('hidden');
  if (!willOpen) return;
  box.innerHTML = '<div class="msg">Memuat riwayat…</div>';
  runServer('getMyKatrolHistory', [], { onSuccess: KatrolApp_renderHistory_ });
}

function KatrolApp_renderHistory_(rows) {
  var box = document.getElementById('sp-katrol-history-box');
  if (!rows.length) { box.innerHTML = '<div class="sp-empty">Belum ada riwayat katrol.</div>'; return; }

  var byTahun = {};
  var order = [];
  rows.forEach(function (r) {
    if (!byTahun[r.tahun_ajaran_label]) { byTahun[r.tahun_ajaran_label] = []; order.push(r.tahun_ajaran_label); }
    byTahun[r.tahun_ajaran_label].push(r);
  });

  box.innerHTML = order.map(function (label, i) {
    var body = byTahun[label].map(function (r) {
      return '<tr><td>' + r.semester + '</td><td>' + r.nama_mapel + '</td><td>' + r.nama_kelas + '</td>' +
        '<td>' + r.source_min + '–' + r.source_max + '</td><td>' + r.target_min + '–' + r.target_max + '</td>' +
        '<td>' + r.jumlah_siswa + '</td><td>' + new Date(r.created_at).toLocaleDateString('id-ID') + '</td></tr>';
    }).join('');
    var tableHtml = '<div class="sp-table-wrap"><table class="sp-table"><thead><tr>' +
      '<th>Semester</th><th>Mapel</th><th>Kelas</th><th>Rentang Murni</th><th>Target</th><th>Jml Siswa</th><th>Tanggal</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';
    return SIPENA_collapsibleHtml_(label + ' <span class="msg" style="margin:0;">(' + byTahun[label].length + ' run)</span>', tableHtml, i === 0);
  }).join('');
}
</script>
