<style>
  :root{
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #1e293b;
    --text-muted: #64748b; --brand: #4f46e5; --brand-fg: #ffffff;
    --danger: #dc2626; --danger-bg: #fee2e2; --ok: #16a34a; --ok-bg: #dcfce7;
  }
  body.dark{
    --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0;
    --text-muted: #94a3b8; --brand: #818cf8; --brand-fg: #0f172a;
    --danger: #f87171; --danger-bg: #451a1a; --ok: #4ade80; --ok-bg: #14291d;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card{
    max-width: 440px; width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 4px 24px rgba(0,0,0,.06);
  }
  .brand{ display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .brand .logo{
    width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .brand .title{ font-weight: 700; font-size: 18px; }
  .brand .subtitle{ font-size: 12px; color: var(--text-muted); }
  .spinner{
    width: 22px; height: 22px; margin: 12px auto; border: 3px solid rgba(79,70,229,.2);
    border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .badge{ display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.ok{ background: var(--ok-bg); color: var(--ok); }
  .badge.danger{ background: var(--danger-bg); color: var(--danger); }
  .msg{ font-size: 13px; line-height: 1.6; color: var(--text-muted); margin-top: 16px; }
  .msg.danger{ color: var(--danger); }
  .hidden{ display: none !important; }

  /* ===== Admin/Guru app shell — sidebar kiri + konten utama ===== */
  body.sp-app-mode{ display: block; padding: 0; align-items: unset; justify-content: unset; }
  #sp-admin-app, #sp-guru-app{ display: flex; align-items: flex-start; min-height: 100vh; }

  .sp-sidebar{
    width: 250px; flex-shrink: 0; min-height: 100vh; position: sticky; top: 0; align-self: flex-start;
    background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; transition: width .18s ease;
  }
  .sp-sidebar-brand{ display: flex; align-items: center; gap: 10px; padding: 20px; border-bottom: 1px solid var(--border); }
  .sp-sidebar-brand-text{ min-width: 0; overflow: hidden; }

  .sp-sidebar-collapse-btn{
    margin-left: auto; flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--border); background: none; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sp-sidebar-collapse-btn:hover{ background: var(--bg); }
  .sp-sidebar-collapse-btn svg{ width: 14px; height: 14px; transition: transform .18s ease; }

  .sp-main{ flex: 1; min-width: 0; padding: 28px 32px 60px; max-width: 1100px; }

  /* Navigasi utama (vertikal, di sidebar) — beda dari .sp-tabs (sub-tab
     horizontal di dalam konten, mis. Input/Rekap Nilai) meski elemen
     tombolnya sama-sama pakai class .sp-tab. */
  .sp-nav{ display: flex; flex-direction: column; gap: 2px; padding: 14px 12px; flex: 1; overflow-y: auto; overflow-x: hidden; }
  .sp-nav .sp-tab{
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
    border: none; background: none; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer;
  }
  .sp-nav .sp-tab.active{ background: var(--brand); color: var(--brand-fg); }
  .sp-nav .sp-tab:hover:not(.active){ background: var(--bg); }
  .sp-nav-icon{ width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sp-nav-icon svg{ width: 100%; height: 100%; }
  .sp-nav-label{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- Sidebar diciutkan (ikon saja) ---- */
  .sp-sidebar.collapsed{ width: 72px; }
  .sp-sidebar.collapsed .sp-sidebar-brand{ flex-direction: column; gap: 10px; padding: 16px 8px; }
  .sp-sidebar.collapsed .sp-sidebar-brand-text{ display: none; }
  .sp-sidebar.collapsed .sp-sidebar-collapse-btn{ margin-left: 0; }
  .sp-sidebar.collapsed .sp-sidebar-collapse-btn svg{ transform: rotate(180deg); }
  .sp-sidebar.collapsed .sp-nav{ padding: 14px 8px; }
  .sp-sidebar.collapsed .sp-nav .sp-tab{ justify-content: center; padding: 10px; }
  .sp-sidebar.collapsed .sp-nav-label{ display: none; }

  /* ---- Kartu profil ringkas (chip) ---- */
  .sp-profile-chip{ display: flex; align-items: center; gap: 10px; }
  .sp-avatar{
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, var(--brand), #7c74ff); color: var(--brand-fg);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  }
  .sp-avatar img{ width: 100%; height: 100%; object-fit: cover; }

  /* ---- Widget profil collapsible di pojok kanan atas ---- */
  .sp-corner-profile{ position: fixed; top: 16px; right: 20px; z-index: 55; }
  .sp-corner-trigger{
    display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    /* <button> tidak mewarisi color/font dari body secara default (UA
       stylesheet browser memaksa "buttontext") — tanpa baris ini nama
       guru/superadmin tampil pudar/gelap walau mode dark aktif. */
    color: inherit; font: inherit; position: relative; z-index: 2;
  }
  .sp-corner-caret{ font-size: 10px; color: var(--text-muted); transition: transform .15s ease; }
  .sp-corner-trigger.open .sp-corner-caret{ transform: rotate(180deg); }
  .sp-corner-panel{
    /* Selalu di BAWAH trigger dengan jarak aman — tidak pernah menutupi
       nama, karena posisinya dihitung dari tepi bawah trigger (top:100%),
       bukan menimpa area trigger itu sendiri. */
    position: absolute; top: calc(100% + 10px); right: 0; width: 320px; max-width: calc(100vw - 40px);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    box-shadow: 0 10px 34px rgba(0,0,0,.18); z-index: 1;
  }
  .sp-avatar-upload{ display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .sp-avatar-upload .sp-avatar{ width: 54px; height: 54px; font-size: 18px; }
  .sp-upload-label{
    display: inline-block; cursor: pointer; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 12.5px; font-weight: 600;
  }
  .sp-upload-label:hover{ background: var(--bg); }
  .sp-profile-info{ text-align: right; line-height: 1.4; }
  .sp-profile-name{ font-weight: 700; font-size: 13px; color: var(--text); }
  .sp-profile-meta{ font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

  .sp-role-badge{
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700;
    letter-spacing: .03em; text-transform: uppercase;
  }
  .sp-role-badge.role-superadmin{ background: var(--brand); color: var(--brand-fg); }
  .sp-role-badge.role-guru{ background: var(--ok-bg); color: var(--ok); }

  /* ---- Kartu profil lengkap (dashboard guru) ---- */
  .sp-profile-card{
    display: flex; align-items: center; gap: 18px; padding: 22px 24px; margin-bottom: 24px;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 2px 14px rgba(0,0,0,.05);
  }
  .sp-profile-card .sp-avatar{ width: 60px; height: 60px; font-size: 21px; }
  .sp-profile-card .sp-profile-name{ font-size: 18px; }
  .sp-profile-card .sp-profile-info{ text-align: left; }
  .sp-profile-card .sp-profile-meta{ justify-content: flex-start; font-size: 12.5px; }

  .sp-detail-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 24px;
    padding: 18px 24px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; margin-bottom: 24px;
  }
  .sp-detail-grid .sp-detail-label{ font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
  .sp-detail-grid .sp-detail-value{ font-size: 14.5px; font-weight: 600; }

  .sp-tabs{ display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .sp-tab{
    background: none; border: none; padding: 10px 16px; font-size: 14px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .sp-tab.active{ color: var(--brand); border-bottom-color: var(--brand); }

  .sp-panel{ display: none; }
  .sp-panel.active{ display: block; }

  .sp-section-title{ font-size: 15px; font-weight: 700; margin: 0 0 12px; }

  .sp-form{ display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 20px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .sp-field{ display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .sp-field label{ color: var(--text-muted); font-weight: 600; }
  .sp-field input, .sp-field select{
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 13px; min-width: 140px;
  }
  .sp-btn{
    padding: 9px 16px; border: none; border-radius: 8px; background: var(--brand); color: var(--brand-fg);
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .sp-btn:disabled{ opacity: .6; cursor: default; }
  .sp-btn.secondary{ background: transparent; border: 1px solid var(--border); color: var(--text); }

  .sp-table-wrap{ overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
  table.sp-table{ width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); }
  table.sp-table th, table.sp-table td{ text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.sp-table th{ color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  table.sp-table tr:last-child td{ border-bottom: none; }
  .sp-empty{ padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ---- Tabel Input Nilai (wide) — kolom No/NIS/Nama sticky saat scroll
     horizontal, khusus di dalam #sp-nilai-table (offset left dihitung
     untuk urutan kolom tetap tabel ini). ---- */
  #sp-nilai-table .sp-sticky-col{ position: sticky; background: var(--card); z-index: 1; }
  #sp-nilai-table thead .sp-sticky-col{ z-index: 2; }
  #sp-nilai-table .sp-sticky-col-1{ left: 0; min-width: 36px; }
  #sp-nilai-table .sp-sticky-col-2{ left: 36px; min-width: 70px; }
  #sp-nilai-table .sp-sticky-col-3{ left: 106px; min-width: 140px; box-shadow: 2px 0 4px rgba(0,0,0,.06); }

  .sp-row-dirty{ background: rgba(129, 140, 248, .12); }
  .sp-row-dirty .sp-sticky-col{ background: rgba(129, 140, 248, .12); }
  .sp-nilai-input.sp-input-error{ border-color: var(--danger) !important; background: var(--danger-bg) !important; }

  .sp-toast{
    position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 600; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 999;
  }
  .sp-toast-ok{ background: var(--ok); }
  .sp-toast-error{ background: var(--danger); }

  /* ===== Cetak (Phase 7) — rekap sederhana ===== */
  .sp-print-only{ display: none; }
  @media print {
    body.sp-printing .sp-sidebar,
    body.sp-printing #sp-rekap-filter,
    body.sp-printing #sp-rekap-actions,
    body.sp-printing .sp-pending{ display: none !important; }
    body.sp-printing .sp-print-only{ display: block; }
    body.sp-printing .sp-main{ max-width: none; padding: 0; }
    body.sp-printing table.sp-table{ font-size: 11px; }
    body.sp-printing{ background: #fff; color: #000; }
  }

  /* ===== Modul Cetak Daftar Nilai — halaman penuh kop/judul/tabel/ttd ===== */
  .sp-print-page{
    background: #fff; color: #000; margin: 0 auto; padding: 14mm 12mm; box-sizing: border-box;
    font-family: "Times New Roman", Times, serif; font-size: 12px; line-height: 1.35; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .sp-print-kop{ display: flex; align-items: center; gap: 12px; }
  .sp-print-logo{ width: 70px; height: 70px; flex-shrink: 0; object-fit: contain; }
  .sp-print-kop-text{ flex: 1; text-align: center; }
  .sp-print-kop-text > div{ font-size: 12.5px; font-weight: 700; text-transform: uppercase; }
  .sp-print-kop-sekolah{ font-size: 16px !important; }
  .sp-print-kop-small{ font-size: 10.5px !important; font-weight: 400 !important; text-transform: none !important; }
  .sp-print-kop-rule{ border-bottom: 3px solid #000; margin: 4px 0 10px; }
  .sp-print-title{ text-align: center; font-weight: 700; font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
  .sp-print-identity{ margin-bottom: 10px; }
  .sp-print-identity div{ display: flex; gap: 6px; }
  .sp-print-identity span{ display: inline-block; min-width: 110px; font-weight: 700; }
  table.sp-print-table{ width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  table.sp-print-table th, table.sp-print-table td{ border: 1px solid #000; padding: 4px 6px; text-align: center; }
  table.sp-print-table td.sp-print-col-nama{ text-align: left; }
  table.sp-print-table th{ font-weight: 700; background: #eee; }
  table.sp-print-table.sp-print-dense th, table.sp-print-table.sp-print-dense td{ font-size: 10px; padding: 3px 4px; }
  .sp-print-signature{ margin-left: auto; width: 260px; text-align: center; }
  .sp-print-signature-name{ font-weight: 700; text-decoration: underline; margin-top: 4px; }
  .sp-print-ttd-space{ height: 60px; }
  .sp-print-ttd-img{ max-height: 60px; max-width: 160px; margin: 4px auto; display: block; }

  @media print {
    body.sp-printing-page *{ visibility: hidden; }
    body.sp-printing-page #sp-print-page-container, body.sp-printing-page #sp-print-page-container *{ visibility: visible; }
    body.sp-printing-page #sp-print-page-container{ position: absolute; left: 0; top: 0; width: 100%; }
    body.sp-printing-page .sp-print-page{ box-shadow: none; margin: 0; width: auto !important; min-height: 0 !important; }
    body.sp-printing-page thead{ display: table-header-group; }
    body.sp-printing-page tr{ page-break-inside: avoid; }
    body.sp-printing-page{ background: #fff; }
  }

  /* ===== Responsive: sidebar jadi bar horizontal di layar sempit ===== */
  @media (max-width: 900px){
    #sp-admin-app, #sp-guru-app{ flex-direction: column; min-height: 0; }
    .sp-sidebar, .sp-sidebar.collapsed{
      width: 100%; min-height: 0; position: static; flex-direction: row; flex-wrap: wrap;
      border-right: none; border-bottom: 1px solid var(--border);
    }
    .sp-sidebar-brand, .sp-sidebar.collapsed .sp-sidebar-brand{ flex-direction: row; border-bottom: none; padding: 14px 16px; }
    .sp-sidebar-collapse-btn{ display: none; }
    .sp-sidebar-brand-text, .sp-sidebar.collapsed .sp-sidebar-brand-text{ display: block; }
    .sp-nav{ flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; flex: 1 1 100%; order: 3; }
    .sp-nav .sp-tab, .sp-sidebar.collapsed .sp-nav .sp-tab{ width: auto; white-space: nowrap; justify-content: flex-start; }
    .sp-nav-label, .sp-sidebar.collapsed .sp-nav-label{ display: inline; }
    .sp-main{ padding: 20px 16px 40px; max-width: none; }
  }
  @media (max-width: 640px){
    .sp-corner-profile{ top: 10px; right: 10px; }
    .sp-corner-trigger .sp-profile-info{ display: none; }
    .sp-form{ padding: 12px; gap: 8px; }
    .sp-field{ flex: 1 1 100%; }
    .sp-field input, .sp-field select{ width: 100%; min-width: 0; }
    .sp-profile-card{ flex-direction: column; align-items: flex-start; text-align: left; padding: 18px; }
    .sp-detail-grid{ padding: 16px; grid-template-columns: 1fr 1fr; }
  }

  /* ===== Indikator "sedang memproses" global ===== */
  .sp-pending{
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
    z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .15s ease, transform .15s ease;
  }
  .sp-pending.visible{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .sp-pending-spinner{
    width: 13px; height: 13px; flex-shrink: 0;
    border: 2px solid rgba(79,70,229,.25); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  .sp-btn-spinner{
    display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px;
    border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  .sp-btn.secondary .sp-btn-spinner{ border-color: rgba(79,70,229,.3); border-top-color: var(--brand); }
</style>
