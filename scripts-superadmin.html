<script>
var SuperAdmin = {
  schools: [], teachers: [], subjects: [], classes: [], academicYears: [], assignments: [], students: [], schedules: []
};

var SP_TINGKAT_OPTIONS_ = {
  SD: ['1', '2', '3', '4', '5', '6'],
  SMP: ['7', '8', '9'],
  SMA: ['10', '11', '12'],
  SMK: ['10', '11', '12']
};

function SuperAdmin_init() {
  document.body.classList.add('sp-app-mode');
  document.getElementById('sp-admin-app').classList.remove('hidden');
  // sp-admin-name/sp-admin-avatar (profile chip) sudah diisi oleh
  // scripts-init.html sebelum fungsi ini dipanggil.

  document.querySelectorAll('#sp-admin-tabs .sp-tab').forEach(function (btn) {
    btn.addEventListener('click', function () { SuperAdmin_showTab(btn.getAttribute('data-tab')); });
  });

  SuperAdmin_buildPanels();
  SuperAdmin_loadAll();
  SuperAdmin_showTab('sekolah');

  document.getElementById('sp-btn-open-db').addEventListener('click', function () {
    runServer('adminGetCentralSpreadsheetInfo', [], {
      onSuccess: function (info) {
        console.log('SIPENA_MASTER info:', info);
        SIPENA_toast('Sheet: ' + info.sheets.map(function (s) { return s.name + '(' + s.rows + ')'; }).join(', '));
        window.open(info.url, '_blank');
      }
    });
  });

  SuperAdmin_wireCorner_();
}

/* ---------- Widget profil pojok kanan atas ---------- */
function SuperAdmin_toggleCorner_() {
  SIPENA_toggleCornerPanel_('sp-corner-admin-trigger', 'sp-corner-admin-panel');
}

function SuperAdmin_wireCorner_() {
  document.getElementById('sp-corner-admin-foto').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    SIPENA_readFileAsBase64_(file, 1500, function (base64, mimeType, fileName) {
      runServer('uploadSuperadminPhoto', [base64, mimeType, fileName], {
        onSuccess: function (res) {
          SIPENA_toast('Foto diperbarui.');
          var html = '<img src="' + res.url + '" alt="">';
          document.getElementById('sp-corner-admin-avatar').innerHTML = html;
          document.getElementById('sp-corner-admin-avatar-big').innerHTML = html;
          if (window.SIPENA.auth) window.SIPENA.auth.fotoUrl = res.url;
        }
      });
    });
  });

  document.getElementById('sp-form-corner-admin').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var btn = f.querySelector('button[type="submit"]');
    runServer('updateMySuperadminProfile', [f.nama.value], {
      loadingEl: btn,
      onSuccess: function () {
        SIPENA_toast('Nama diperbarui.');
        document.getElementById('sp-admin-name').textContent = f.nama.value;
      }
    });
  });
}

function SuperAdmin_showTab(tabId) {
  document.querySelectorAll('#sp-admin-tabs .sp-tab').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
  });
  document.querySelectorAll('#sp-admin-panels .sp-panel').forEach(function (p) {
    p.classList.toggle('active', p.id === 'sp-panel-' + tabId);
  });
  // Audit log dimuat malas (baru saat tab dibuka), bukan di loadAll —
  // datanya tidak dibutuhkan tab lain dan bisa sampai 300 baris.
  if (tabId === 'auditlog' && !window.SuperAdmin._auditLogLoaded) {
    window.SuperAdmin._auditLogLoaded = true;
    SuperAdmin_loadAuditLog_();
  }
}

function SuperAdmin_loadAll() {
  runServer('adminGetSchools', [], { onSuccess: function (rows) { console.log('adminGetSchools ->', rows); SuperAdmin.schools = rows; SuperAdmin_renderSekolah(); SuperAdmin_refreshSelects(); }, onError: function (msg) { console.error('adminGetSchools FAILED:', msg); SIPENA_toast('Gagal muat sekolah: ' + msg, 'error'); } });
  runServer('adminGetSubjects', [], { onSuccess: function (rows) { SuperAdmin.subjects = rows; SuperAdmin_renderMapel(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetClasses', [], { onSuccess: function (rows) { SuperAdmin.classes = rows; SuperAdmin_renderKelas(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetAcademicYears', [], { onSuccess: function (rows) { SuperAdmin.academicYears = rows; SuperAdmin_renderTahunAjaran(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetTeachers', [], { onSuccess: function (rows) { SuperAdmin.teachers = rows; SuperAdmin_renderGuru(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetAssignments', [], { onSuccess: function (rows) { SuperAdmin.assignments = rows; SuperAdmin_renderPenugasan(); } });
  runServer('adminGetStudents', [], { onSuccess: function (rows) { SuperAdmin.students = rows; } });
  runServer('adminGetSchedules', [], { onSuccess: function (rows) { SuperAdmin.schedules = rows; SuperAdmin_renderJadwal(); } });
  SuperAdmin_loadSyncQueue_();
}

/* ---- Sinkronisasi Gagal (Phase 8) ---- */
function SuperAdmin_loadSyncQueue_() {
  runServer('adminGetSyncQueue', [], { onSuccess: SuperAdmin_renderSyncQueue_ });
}

function SuperAdmin_renderSyncQueue_(rows) {
  SIPENA_table_('sp-sync-queue-table', [
    { key: 'nama_guru', label: 'Guru' }, { key: 'attempt', label: 'Percobaan' }, { key: 'last_error', label: 'Error Terakhir' },
    { label: 'Waktu', render: function (r) { return new Date(r.updated_at).toLocaleString('id-ID'); } },
    { label: 'Aksi', render: function (r) { return '<button class="sp-btn secondary" onclick="SuperAdmin_retrySync_(\'' + r.guru_id + '\')">Coba Lagi</button>'; } }
  ], rows, 'Tidak ada sinkronisasi yang gagal.');
}

function SuperAdmin_retrySync_(guruId) {
  runServer('adminRetrySyncQueue', [guruId], {
    onSuccess: function (res) {
      SIPENA_toast(res.ok ? 'Sinkronisasi berhasil.' : 'Masih gagal — lihat error terbaru di tabel.');
      SuperAdmin_loadSyncQueue_();
    }
  });
}

/* ================= helper umum ================= */

function SIPENA_table_(containerId, columns, rows, emptyText) {
  var el = document.getElementById(containerId);
  if (!rows || !rows.length) {
    el.innerHTML = '<div class="sp-empty">' + (emptyText || 'Belum ada data.') + '</div>';
    return;
  }
  var thead = '<tr>' + columns.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') + '</tr>';
  var tbody = rows.map(function (r) {
    return '<tr>' + columns.map(function (c) {
      return '<td>' + (c.render ? c.render(r) : (r[c.key] === undefined || r[c.key] === '' ? '-' : r[c.key])) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  el.innerHTML = '<div class="sp-table-wrap"><table class="sp-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
}

function SuperAdmin_options_(list, valueKey, labelFn, placeholder) {
  var opts = '<option value="">' + (placeholder || 'Pilih...') + '</option>';
  list.forEach(function (item) {
    opts += '<option value="' + item[valueKey] + '">' + labelFn(item) + '</option>';
  });
  return opts;
}

function SuperAdmin_refreshSelects() {
  document.querySelectorAll('select[data-source="sekolah"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.schools, 'sekolah_id', function (s) { return s.nama_sekolah + ' (' + s.jenjang + ')'; }, 'Pilih sekolah');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="mapel"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.subjects, 'mapel_id', function (m) { return m.nama_mapel; }, 'Pilih mapel');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="kelas"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.classes, 'kelas_id', function (k) { return k.nama_kelas; }, 'Pilih kelas');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="guru"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.teachers, 'guru_id', function (g) { return g.nama_lengkap + ' (' + g.email + ')'; }, 'Pilih guru');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="tahunajaran"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.academicYears, 'tahun_ajaran_id', function (t) { return t.label + ' - ' + t.semester; }, 'Pilih tahun ajaran');
    sel.value = cur;
  });
}

function SuperAdmin_labelFromId_(list, idKey, id, labelKey) {
  var found = list.filter(function (r) { return r[idKey] === id; })[0];
  return found ? found[labelKey] : id;
}

/**
 * Mode edit dipakai bersama semua form "Tambah X": form yang sama dipakai
 * ulang untuk edit — tombol submit berubah teks jadi "Update", dan
 * form.dataset.editId menandai record mana yang sedang diedit (dibaca di
 * submit handler masing-masing form untuk memilih adminCreateX vs
 * adminUpdateX).
 */
function SuperAdmin_setFormEditMode_(form, id) {
  form.dataset.editId = id;
  form.querySelector('button[type="submit"]').textContent = 'Update';
  var cancelBtn = form.querySelector('.sp-btn-cancel-edit');
  if (cancelBtn) cancelBtn.classList.remove('hidden');
}
function SuperAdmin_clearFormEditMode_(form) {
  delete form.dataset.editId;
  form.querySelector('button[type="submit"]').textContent = 'Simpan';
  var cancelBtn = form.querySelector('.sp-btn-cancel-edit');
  if (cancelBtn) cancelBtn.classList.add('hidden');
  form.reset();
}
function SuperAdmin_cancelEditButton_() {
  return '<button type="button" class="sp-btn secondary sp-btn-cancel-edit hidden" onclick="SuperAdmin_clearFormEditMode_(this.form)">Batal Edit</button>';
}

/* ================= bangun markup semua panel ================= */

function SuperAdmin_buildPanels() {
  var root = document.getElementById('sp-admin-panels');
  root.innerHTML =
    SuperAdmin_panelSekolah_() +
    SuperAdmin_panelGuru_() +
    SuperAdmin_panelMapel_() +
    SuperAdmin_panelKelas_() +
    SuperAdmin_panelTahunAjaran_() +
    SuperAdmin_panelPenugasan_() +
    SuperAdmin_panelKenaikanKelas_() +
    SuperAdmin_panelJadwal_() +
    SuperAdmin_panelSiswa_() +
    SuperAdmin_panelAuditLog_();

  SuperAdmin_wireSekolah_();
  SuperAdmin_wireGuru_();
  SuperAdmin_wireMapel_();
  SuperAdmin_wireKelas_();
  SuperAdmin_wireTahunAjaran_();
  SuperAdmin_wirePenugasan_();
  SuperAdmin_wireRombel_();
  SuperAdmin_wireKenaikanKelas_();
  SuperAdmin_wireJadwal_();
  SuperAdmin_wireSiswa_();
}

/* ---------- Sekolah ---------- */
function SuperAdmin_panelSekolah_() {
  return '' +
    '<div class="sp-panel active" id="sp-panel-sekolah">' +
    '  <div class="sp-section-title">Tambah Sekolah</div>' +
    '  <form class="sp-form" id="sp-form-sekolah">' +
    '    <div class="sp-field"><label>NPSN</label><input name="npsn"></div>' +
    '    <div class="sp-field"><label>Nama Sekolah</label><input name="nama_sekolah" required></div>' +
    '    <div class="sp-field"><label>Jenjang</label><select name="jenjang" required>' +
    '      <option value="">Pilih</option><option>SD</option><option>SMP</option><option>SMA</option><option>SMK</option>' +
    '    </select></div>' +
    '    <div class="sp-field"><label>Kabupaten</label><input name="kabupaten"></div>' +
    '    <div class="sp-field"><label>Provinsi</label><input name="provinsi"></div>' +
    '    <div class="sp-field"><label>Alamat</label><input name="alamat" style="min-width:260px;"></div>' +
    '    <div class="sp-field"><label>Desa</label><input name="desa"></div>' +
    '    <div class="sp-field"><label>Kecamatan</label><input name="kecamatan"></div>' +
    '    <div class="sp-field"><label>Kode Pos</label><input name="kode_pos"></div>' +
    '    <div class="sp-field"><label>Email</label><input name="email" type="email"></div>' +
    '    <div class="sp-field"><label>Telepon</label><input name="telepon"></div>' +
    '    <div class="sp-field"><label>Website</label><input name="website"></div>' +
    '    <button class="sp-btn" type="submit">Simpan</button>' +
    SuperAdmin_cancelEditButton_() +
    '  </form>' +
    '  <div class="sp-section-title">Daftar Sekolah</div>' +
    '  <div id="sp-table-sekolah"></div>' +

    '  <div class="sp-section-title">Kop Cetak</div>' +
    '  <div class="msg" style="margin:-6px 0 10px;">Kop diunggah sebagai satu gambar utuh (desain kop sekolah yang sudah ada) — bukan disusun dari teks. Satu sekolah boleh punya beberapa kop (mis. "Kop Resmi" &amp; "Kop Sederhana"); guru memilih salah satu saat cetak. Gambar bisa diganti kapan saja tanpa mengubah pilihan guru yang sudah ada.</div>' +
    '  <div class="sp-form">' +
    '    <div class="sp-field"><label>Sekolah</label><select id="sp-kop-target" data-source="sekolah" style="min-width:260px;"></select></div>' +
    '    <div class="sp-field"><label>Nama Kop</label><input id="sp-kop-nama" placeholder="mis. Kop Resmi"></div>' +
    '    <div class="sp-field"><label>Dirancang untuk</label><select id="sp-kop-paper-hint">' +
    '      <option value="">Umum (A4/F4)</option><option value="A4">A4</option><option value="F4">F4</option>' +
    '    </select></div>' +
    '    <label class="sp-upload-label" id="sp-kop-upload-label">Unggah Kop Baru<input type="file" accept="image/*" id="sp-kop-upload-new" class="hidden"></label>' +
    '    <button type="button" class="sp-btn hidden" id="sp-kop-save-edit-btn" onclick="SuperAdmin_saveKopEdit_()">Simpan Nama/Kategori</button>' +
    '    <button type="button" class="sp-btn secondary hidden" id="sp-kop-cancel-edit-btn" onclick="SuperAdmin_cancelKopEdit_()">Batal Edit</button>' +
    '  </div>' +
    '  <div id="sp-table-kop"></div>' +

    '  <div class="sp-section-title">Bobot Nilai Akhir per Sekolah</div>' +
    '  <div class="msg" style="margin:-6px 0 10px;">Bobot Rata-rata Harian, PTS, dan ASAS/ASAT dipakai guru saat menghitung Nilai Akhir siswa — kebijakan akademik tiap sekolah, total bobot harus 100.</div>' +
    '  <form class="sp-form" id="sp-form-bobot-nilai">' +
    '    <div class="sp-field"><label>Sekolah</label><select name="sekolah_id" data-source="sekolah" required></select></div>' +
    '    <div class="sp-field"><label>Bobot Harian (%)</label><input name="bobot_harian" type="number" min="0" max="100" required></div>' +
    '    <div class="sp-field"><label>Bobot PTS (%)</label><input name="bobot_pts" type="number" min="0" max="100" required></div>' +
    '    <div class="sp-field"><label>Bobot ASAS/ASAT (%)</label><input name="bobot_akhir_semester" type="number" min="0" max="100" required></div>' +
    '    <div class="sp-field"><label>Mode Perhitungan</label><select name="mode_perhitungan" required>' +
    '      <option value="WAJIB_LENGKAP">Wajib Lengkap</option><option value="KOMPONEN_TERSEDIA">Komponen Tersedia</option>' +
    '    </select></div>' +
    '    <div class="sp-field"><label>Angka Desimal</label><input name="decimal_places" type="number" min="0" max="4" value="2" required></div>' +
    '    <button class="sp-btn" type="submit">Simpan Bobot</button>' +
    '  </form>' +
    '</div>';
}
function SuperAdmin_wireSekolah_() {
  document.getElementById('sp-form-bobot-nilai').sekolah_id.addEventListener('change', function (e) {
    var sekolahId = e.target.value;
    var f = document.getElementById('sp-form-bobot-nilai');
    if (!sekolahId) return;
    runServer('adminGetBobotNilai', [sekolahId], {
      onSuccess: function (cfg) {
        f.bobot_harian.value = cfg.bobot_harian;
        f.bobot_pts.value = cfg.bobot_pts;
        f.bobot_akhir_semester.value = cfg.bobot_akhir_semester;
        f.mode_perhitungan.value = cfg.mode_perhitungan;
        f.decimal_places.value = cfg.decimal_places;
      }
    });
  });
  document.getElementById('sp-form-bobot-nilai').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (!f.sekolah_id.value) { SIPENA_toast('Pilih sekolah dulu.', 'error'); return; }
    var total = Number(f.bobot_harian.value) + Number(f.bobot_pts.value) + Number(f.bobot_akhir_semester.value);
    if (total !== 100) { SIPENA_toast('Total bobot harus 100 (saat ini ' + total + ').', 'error'); return; }
    var btn = f.querySelector('button[type="submit"]');
    runServer('adminSaveBobotNilai', [f.sekolah_id.value, f.bobot_harian.value, f.bobot_pts.value, f.bobot_akhir_semester.value, f.mode_perhitungan.value, f.decimal_places.value], {
      loadingEl: btn,
      onSuccess: function () { SIPENA_toast('Bobot nilai disimpan.'); }
    });
  });
  document.getElementById('sp-form-sekolah').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var data = {
      npsn: f.npsn.value, nama_sekolah: f.nama_sekolah.value, jenjang: f.jenjang.value, kabupaten: f.kabupaten.value, provinsi: f.provinsi.value,
      alamat: f.alamat.value, desa: f.desa.value, kecamatan: f.kecamatan.value, kode_pos: f.kode_pos.value, email: f.email.value,
      telepon: f.telepon.value, website: f.website.value
    };
    var btn = f.querySelector('button[type="submit"]');
    var editId = f.dataset.editId;
    runServer(editId ? 'adminUpdateSchool' : 'adminCreateSchool', editId ? [editId, data] : [data], {
      loadingEl: btn,
      onSuccess: function () {
        SIPENA_toast(editId ? 'Sekolah diperbarui.' : 'Sekolah tersimpan.');
        SuperAdmin_clearFormEditMode_(f);
        runServer('adminGetSchools', [], {
          onSuccess: function (rows) { SuperAdmin.schools = rows; SuperAdmin_renderSekolah(); SuperAdmin_refreshSelects(); },
          onError: function (msg) { SIPENA_toast('Tersimpan, tapi gagal muat ulang daftar: ' + msg, 'error'); }
        });
      }
    });
  });

  document.getElementById('sp-kop-upload-new').addEventListener('change', function (e) {
    var sekolahId = document.getElementById('sp-kop-target').value;
    var nama = document.getElementById('sp-kop-nama').value.trim();
    if (!sekolahId) { SIPENA_toast('Pilih sekolah dulu.', 'error'); return; }
    if (!nama) { SIPENA_toast('Isi nama kop dulu (mis. "Kop Resmi").', 'error'); return; }
    var file = e.target.files[0];
    if (!file) return;
    var paperHint = document.getElementById('sp-kop-paper-hint').value;
    SIPENA_readFileAsBase64_(file, 3000, function (base64, mimeType, fileName) {
      runServer('adminUploadSekolahKop', [sekolahId, nama, paperHint, base64, mimeType, fileName], {
        onSuccess: function () {
          SIPENA_toast('Kop diunggah.');
          document.getElementById('sp-kop-nama').value = '';
          e.target.value = '';
          SuperAdmin_loadKopList_(sekolahId);
        }
      });
    });
  });

  document.getElementById('sp-kop-target').addEventListener('change', function (e) { SuperAdmin_loadKopList_(e.target.value); });
}

function SuperAdmin_loadKopList_(sekolahId) {
  if (!sekolahId) { SIPENA_table_('sp-table-kop', [], [], 'Pilih sekolah untuk melihat daftar kop.'); return; }
  runServer('adminGetSekolahKopList', [sekolahId], {
    onSuccess: function (rows) { window.SuperAdmin._kopRows = rows; SuperAdmin_renderKopList_(rows); }
  });
}

function SuperAdmin_renderKopList_(rows) {
  SIPENA_table_('sp-table-kop', [
    { label: 'Pratinjau', render: function (r) { return '<img src="' + r.image_url + '" style="max-width:120px;max-height:60px;border:1px solid var(--border);border-radius:4px;">'; } },
    { key: 'nama_kop', label: 'Nama' },
    { label: 'Untuk', render: function (r) { return r.paper_hint || 'Umum'; } },
    { label: 'Status', render: function (r) { return '<span class="badge ' + (String(r.status).toUpperCase() === 'AKTIF' ? 'ok' : 'danger') + '">' + r.status + '</span>'; } },
    { label: 'Aksi', render: function (r) {
        return '<button class="sp-btn secondary" onclick="SuperAdmin_editKop_(\'' + r.kop_id + '\')">Edit</button> ' +
          '<label class="sp-btn secondary" style="display:inline-block;cursor:pointer;">Ganti Gambar<input type="file" accept="image/*" class="hidden" onchange="SuperAdmin_replaceKopImage_(\'' + r.kop_id + '\', this)"></label> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_toggleKopStatus_(\'' + r.kop_id + '\')">' + (String(r.status).toUpperCase() === 'AKTIF' ? 'Nonaktifkan' : 'Aktifkan') + '</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_deleteKop_(\'' + r.kop_id + '\', \'' + String(r.nama_kop).replace(/'/g, "\\'") + '\')">Hapus</button>';
      } }
  ], rows, 'Belum ada kop untuk sekolah ini.');
}

function SuperAdmin_editKop_(kopId) {
  var row = (window.SuperAdmin._kopRows || []).filter(function (r) { return r.kop_id === kopId; })[0];
  if (!row) return;
  document.getElementById('sp-kop-nama').value = row.nama_kop || '';
  document.getElementById('sp-kop-paper-hint').value = row.paper_hint || '';
  document.getElementById('sp-kop-upload-label').classList.add('hidden');
  document.getElementById('sp-kop-save-edit-btn').classList.remove('hidden');
  document.getElementById('sp-kop-cancel-edit-btn').classList.remove('hidden');
  document.getElementById('sp-kop-save-edit-btn').dataset.kopId = kopId;
}

function SuperAdmin_cancelKopEdit_() {
  document.getElementById('sp-kop-nama').value = '';
  document.getElementById('sp-kop-paper-hint').value = '';
  document.getElementById('sp-kop-upload-label').classList.remove('hidden');
  document.getElementById('sp-kop-save-edit-btn').classList.add('hidden');
  document.getElementById('sp-kop-cancel-edit-btn').classList.add('hidden');
  delete document.getElementById('sp-kop-save-edit-btn').dataset.kopId;
}

function SuperAdmin_saveKopEdit_() {
  var kopId = document.getElementById('sp-kop-save-edit-btn').dataset.kopId;
  var nama = document.getElementById('sp-kop-nama').value.trim();
  if (!nama) { SIPENA_toast('Nama kop tidak boleh kosong.', 'error'); return; }
  var paperHint = document.getElementById('sp-kop-paper-hint').value;
  runServer('adminUpdateSekolahKop', [kopId, { nama_kop: nama, paper_hint: paperHint }], {
    onSuccess: function () {
      SIPENA_toast('Kop diperbarui.');
      SuperAdmin_cancelKopEdit_();
      SuperAdmin_loadKopList_(document.getElementById('sp-kop-target').value);
    }
  });
}

function SuperAdmin_replaceKopImage_(kopId, input) {
  var file = input.files[0];
  if (!file) return;
  SIPENA_readFileAsBase64_(file, 3000, function (base64, mimeType, fileName) {
    runServer('adminReplaceSekolahKopImage', [kopId, base64, mimeType, fileName], {
      onSuccess: function () { SIPENA_toast('Gambar kop diganti.'); SuperAdmin_loadKopList_(document.getElementById('sp-kop-target').value); }
    });
  });
}

function SuperAdmin_toggleKopStatus_(kopId) {

function SuperAdmin_wireGuru_() {
  document.getElementById('sp-btn-migrate-nilai-akhir').addEventListener('click', function () {
    var btn = this;
    runServer('adminMigrateGuruOperationalSheets', [], {
      loadingEl: btn,
      onSuccess: function (res) {
        var msg = res.migrated + ' dari ' + res.total + ' spreadsheet guru disiapkan.';
        if (res.failed.length) msg += ' ' + res.failed.length + ' gagal (cek console).';
        SIPENA_toast(msg, res.failed.length ? 'error' : 'ok');
        if (res.failed.length) console.error('adminMigrateGuruOperationalSheets failed:', res.failed);
      }
    });
  });

  document.getElementById('sp-form-guru').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var editId = f.dataset.editId;
    var btn = f.querySelector('button[type="submit"]');

    if (editId) {
      var patch = { nama_lengkap: f.nama_lengkap.value, nip: f.nip.value, nuptk: f.nuptk.value, jabatan: f.jabatan.value, no_hp: f.no_hp.value };
      runServer('adminUpdateTeacher', [editId, patch], {
        loadingEl: btn,

          runServer('adminGetTeachers', [], { onSuccess: function (rows) { SuperAdmin.teachers = rows; SuperAdmin_renderGuru(); SuperAdmin_refreshSelects(); } });
        }
      });
      return;
    }

    var data = { sekolah_id: f.sekolah_id.value, email: f.email.value, nama_lengkap: f.nama_lengkap.value, nip: f.nip.value, nuptk: f.nuptk.value, jabatan: f.jabatan.value, no_hp: f.no_hp.value };

 */
function SuperAdmin_renderGuru() {
  var el = document.getElementById('sp-table-guru');

  var bySekolah = {};
  SuperAdmin.teachers.forEach(function (r) {
    if (!bySekolah[r.sekolah_id]) bySekolah[r.sekolah_id] = [];
    bySekolah[r.sekolah_id].push(r);
  });
  var sekolahIds = Object.keys(bySekolah).sort(function (a, b) {
    return SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', a, 'nama_sekolah')
      .localeCompare(SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', b, 'nama_sekolah'));

    var namaSekolah = SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', sid, 'nama_sekolah') || '(Sekolah tidak diketahui)';

function SuperAdmin_renderPenugasanKelasCheckboxes_(sekolahId) {
  var container = document.getElementById('sp-penugasan-kelas-list');
  if (!sekolahId) { container.innerHTML = '<span class="msg">Pilih guru dulu untuk menampilkan daftar kelas.</span>'; return; }
  var classes = SuperAdmin.classes.filter(function (k) { return k.sekolah_id === sekolahId && String(k.status).toUpperCase() !== 'NONAKTIF'; });
  if (!classes.length) { container.innerHTML = '<span class="msg">Sekolah guru ini belum punya kelas aktif.</span>'; return; }
  classes = classes.slice().sort(function (a, b) { return String(a.nama_kelas).localeCompare(String(b.nama_kelas)); });
  container.innerHTML = classes.map(function (k) {
    return '<label style="display:flex;align-items:center;gap:5px;font-weight:400;font-size:13px;">' +
      '<input type="checkbox" class="sp-penugasan-kelas-cb" value="' + k.kelas_id + '"> ' + k.nama_kelas + '</label>';
  }).join('');
}
function SuperAdmin_toggleAllKelasCheckbox_(checked) {
  document.querySelectorAll('.sp-penugasan-kelas-cb').forEach(function (cb) { cb.checked = checked; });
}
function SuperAdmin_wirePenugasan_() {
  var form = document.getElementById('sp-form-penugasan');

  form.guru_id.addEventListener('change', function () {
    var guru = SuperAdmin.teachers.filter(function (g) { return g.guru_id === form.guru_id.value; })[0];
    SuperAdmin_renderPenugasanKelasCheckboxes_(guru ? guru.sekolah_id : null);
  });

  // Saat mode edit (satu record), pilih kelas lain otomatis membatalkan
  // pilihan sebelumnya — edit hanya untuk SATU penugasan, bukan batch.
  document.getElementById('sp-penugasan-kelas-list').addEventListener('change', function (e) {
    if (!e.target.classList || !e.target.classList.contains('sp-penugasan-kelas-cb')) return;
    if (form.dataset.editId && e.target.checked) {
      document.querySelectorAll('.sp-penugasan-kelas-cb').forEach(function (cb) { if (cb !== e.target) cb.checked = false; });
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var guru = SuperAdmin.teachers.filter(function (g) { return g.guru_id === f.guru_id.value; })[0];
    if (!guru) { SIPENA_toast('Pilih guru terlebih dahulu.', 'error'); return; }
    var kelasIds = Array.prototype.slice.call(document.querySelectorAll('.sp-penugasan-kelas-cb:checked')).map(function (cb) { return cb.value; });
    if (!kelasIds.length) { SIPENA_toast('Pilih minimal satu kelas.', 'error'); return; }
    var btn = f.querySelector('button[type="submit"]');
    var editId = f.dataset.editId;

    if (editId) {
      var data = { guru_id: f.guru_id.value, mapel_id: f.mapel_id.value, kelas_id: kelasIds[0], tahun_ajaran_id: f.tahun_ajaran_id.value };
      runServer('adminUpdateAssignment', [editId, data], {
        loadingEl: btn,
        onSuccess: function () {
          SIPENA_toast('Penugasan diperbarui & disinkron.');
          SuperAdmin_clearFormEditMode_(f);
          SuperAdmin_renderPenugasanKelasCheckboxes_(null);
          runServer('adminGetAssignments', [], { onSuccess: function (rows) { SuperAdmin.assignments = rows; SuperAdmin_renderPenugasan(); } });
        }
      });
      return;
    }

    runServer('adminCreateAssignmentBatch', [f.guru_id.value, f.mapel_id.value, kelasIds, f.tahun_ajaran_id.value], {
      loadingEl: btn,
      onSuccess: function (res) {
        var msg = 'Penugasan tersimpan untuk ' + res.created.length + ' kelas' +
          (res.skipped.length ? ' (dilewati ' + res.skipped.length + ' yang sudah ada sebelumnya)' : '') + '.';
        SIPENA_toast(msg);
        SuperAdmin_toggleAllKelasCheckbox_(false);
        runServer('adminGetAssignments', [], { onSuccess: function (rows) { SuperAdmin.assignments = rows; SuperAdmin_renderPenugasan(); } });
      }
    });
  });
}
function SuperAdmin_cancelEditPenugasan_(form) {
  SuperAdmin_renderPenugasanKelasCheckboxes_(null);
  SuperAdmin_clearFormEditMode_(form);
}
function SuperAdmin_editAssignment_(assignmentId) {
  var a = SuperAdmin.assignments.filter(function (r) { return r.assignment_id === assignmentId; })[0];
  if (!a) return;
  var f = document.getElementById('sp-form-penugasan');
  f.guru_id.value = a.guru_id || '';
  f.mapel_id.value = a.mapel_id || '';
  f.tahun_ajaran_id.value = a.tahun_ajaran_id || '';
  var guru = SuperAdmin.teachers.filter(function (g) { return g.guru_id === a.guru_id; })[0];
  SuperAdmin_renderPenugasanKelasCheckboxes_(guru ? guru.sekolah_id : null);
  var cb = document.querySelector('.sp-penugasan-kelas-cb[value="' + a.kelas_id + '"]');
  if (cb) cb.checked = true;
  SuperAdmin_setFormEditMode_(f, assignmentId);
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
/* ---------- Generator Rombel ---------- */
function SuperAdmin_tingkatOptions_(jenjang) {

  return opts.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('');

function SuperAdmin_wireRombel_() {
  document.getElementById('sp-rombel-batch-jenjang').addEventListener('change', function () {
    var jenjang = this.value;
    document.querySelectorAll('#sp-rombel-batch-rows .sp-rombel-batch-row').forEach(function (row) {
      row.querySelector('.sp-rb-tingkat').innerHTML = SuperAdmin_tingkatOptions_(jenjang);
      row.querySelector('.sp-rb-smk-field').classList.toggle('hidden', jenjang !== 'SMK');
    });

function SuperAdmin_addRombelBatchRow_() {
  var container = document.getElementById('sp-rombel-batch-rows');
  var jenjang = document.getElementById('sp-rombel-batch-jenjang').value;
  var row = document.createElement('div');

    '<button type="button" class="sp-btn secondary" onclick="this.closest(\'.sp-rombel-batch-row\').remove()">Hapus Baris</button>';

function SuperAdmin_previewRombelBatch_() {
  var sekolahId = document.getElementById('sp-rombel-batch-sekolah').value;
  var jenjang = document.getElementById('sp-rombel-batch-jenjang').value;
  if (!sekolahId || !jenjang) { SIPENA_toast('Pilih sekolah dan jenjang dulu.', 'error'); return; }

  var entries = [];
  document.querySelectorAll('#sp-rombel-batch-rows .sp-rombel-batch-row').forEach(function (row) {
    var programEl = row.querySelector('.sp-rb-program');
    entries.push({
      tingkat: row.querySelector('.sp-rb-tingkat').value,
      jumlah_rombel: parseInt(row.querySelector('.sp-rb-jumlah').value, 10),
      program_keahlian: programEl ? programEl.value : ''
    });
  });
  if (!entries.length) { SIPENA_toast('Tambah minimal satu baris tingkat.', 'error'); return; }

  runServer('adminPreviewRombelBatch', [sekolahId, jenjang, entries], {
    onSuccess: function (plans) {
      window.SuperAdmin._batchRombel = { sekolah_id: sekolahId, jenjang: jenjang, entries: entries };
      SuperAdmin_renderRombelBatchPreview_(plans);
    }
  });
}

function SuperAdmin_renderRombelBatchPreview_(plans) {
  var el = document.getElementById('sp-rombel-batch-preview');
  var totalCreate = 0, totalDeactivate = 0;
  var html = '<div class="sp-form" style="flex-direction:column;align-items:stretch;">';
  plans.forEach(function (plan) {
    totalCreate += plan.to_create.length;
    totalDeactivate += plan.to_deactivate.length;
    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border);">';
    html += '<div style="font-weight:700;">' + plan.prefix.trim() + ' — ' + plan.jumlah_rombel + ' rombel</div>';
    if (plan.existing.length) html += '<div class="msg">Sudah ada: ' + plan.existing.join(', ') + '</div>';
    html += plan.to_create.length
      ? '<div class="msg" style="color:var(--ok);">Akan dibuat: ' + plan.to_create.join(' | ') + '</div>'
      : '<div class="msg">Tidak ada rombel baru.</div>';
    if (plan.to_deactivate.length) html += '<div class="msg danger">Dinonaktifkan (data aman): ' + plan.to_deactivate.map(function (d) { return d.nama_kelas; }).join(', ') + '</div>';
    if (plan.conflicts.length) html += '<div class="msg danger">Bentrok, dilewati: ' + plan.conflicts.join(', ') + '</div>';
    html += '</div>';
  });
  html += '<div style="display:flex;gap:10px;margin-top:12px;">';
  html += '<button type="button" class="sp-btn secondary" onclick="document.getElementById(\'sp-rombel-batch-preview\').classList.add(\'hidden\')">Batal</button>';
  if (totalCreate || totalDeactivate) {
    html += '<button type="button" class="sp-btn" onclick="SuperAdmin_confirmRombelBatch_()">Generate Semua Rombel (' + totalCreate + ' kelas baru)</button>';
  }
  html += '</div></div>';
  el.innerHTML = html;
  el.classList.remove('hidden');
}

function SuperAdmin_confirmRombelBatch_() {
  var ctx = window.SuperAdmin._batchRombel;
  if (!ctx) return;
  runServer('adminGenerateRombelBatch', [ctx.sekolah_id, ctx.jenjang, ctx.entries], {
    onSuccess: function () {
      SIPENA_toast('Semua rombel berhasil diproses.');
      document.getElementById('sp-rombel-batch-preview').classList.add('hidden');
      runServer('adminGetClasses', [], { onSuccess: function (rows) { SuperAdmin.classes = rows; SuperAdmin_renderKelas(); SuperAdmin_refreshSelects(); } });
    }
  });
}

/**
 * SuperAdmin_tahunAjaranLabel_(id)
 * "2026/2027 - GANJIL" — gabungan label+semester, dipakai di mana pun
 * tahun_ajaran_id ditampilkan supaya semester tidak perlu kolom/field
 * terpisah (satu tahun_ajaran_id sudah pasti satu semester tertentu).
 */
function SuperAdmin_tahunAjaranLabel_(id) {
  var t = SuperAdmin.academicYears.filter(function (r) { return r.tahun_ajaran_id === id; })[0];
  return t ? (t.label + ' - ' + t.semester) : id;
}

/**
 * SuperAdmin_renderPenugasan()
 * Dikelompokkan per sekolah LALU per guru (bukan tabel datar berisi
 * satu baris per kelas) — satu sekolah dengan banyak guru & banyak kelas
 * tidak lagi jadi daftar panjang, cukup satu baris per guru + tombol
 * Detail untuk lihat kelas/mapel spesifiknya (SuperAdmin_openPenugasanDetail_).
 */
function SuperAdmin_renderPenugasan() {
  var el = document.getElementById('sp-table-penugasan');
  if (!SuperAdmin.assignments.length) { el.innerHTML = '<div class="sp-empty">Belum ada penugasan.</div>'; return; }

  var bySekolah = {};
  SuperAdmin.assignments.forEach(function (r) {
    if (!bySekolah[r.sekolah_id]) bySekolah[r.sekolah_id] = [];
    bySekolah[r.sekolah_id].push(r);
  });

  var sekolahIds = Object.keys(bySekolah).sort(function (a, b) {
    return SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', a, 'nama_sekolah')
      .localeCompare(SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', b, 'nama_sekolah'));
  });

  el.innerHTML = sekolahIds.map(function (sid) {
    var namaSekolah = SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', sid, 'nama_sekolah') || '(Sekolah tidak diketahui)';

    var byGuru = {};
    bySekolah[sid].forEach(function (r) {
      if (!byGuru[r.guru_id]) byGuru[r.guru_id] = [];
      byGuru[r.guru_id].push(r);
    });
    var guruIds = Object.keys(byGuru).sort(function (a, b) { return (byGuru[a][0].nama_guru || '').localeCompare(byGuru[b][0].nama_guru || ''); });

    var body = guruIds.map(function (gid) {
      var rows = byGuru[gid];
      var mapelSet = {};
      rows.forEach(function (r) { mapelSet[r.nama_mapel] = true; });
      return '<tr><td>' + rows[0].nama_guru + '</td><td>' + Object.keys(mapelSet).join(', ') + '</td><td>' + rows.length + ' kelas</td>' +
        '<td><button class="sp-btn secondary" onclick="SuperAdmin_openPenugasanDetail_(\'' + sid + '\', \'' + gid + '\')">Detail</button></td></tr>';
    }).join('');

    return '<div class="sp-section-title" style="font-size:14px;margin-top:18px;">' + namaSekolah + '</div>' +
      '<div class="sp-table-wrap"><table class="sp-table"><thead><tr>' +
      '<th>Guru</th><th>Mata Pelajaran</th><th>Jumlah Kelas</th><th>Aksi</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }).join('');
}

function SuperAdmin_openPenugasanDetail_(sekolahId, guruId) {
  var rows = SuperAdmin.assignments.filter(function (r) { return r.sekolah_id === sekolahId && r.guru_id === guruId; });
  if (!rows.length) return;
  window.SuperAdmin._penugasanDetailScope = { sekolahId: sekolahId, guruId: guruId };
  document.getElementById('sp-penugasan-detail-title').textContent =
    rows[0].nama_guru + ' — ' + (SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', sekolahId, 'nama_sekolah') || '');
  var body = rows.map(function (r) {
    return '<tr><td>' + r.nama_mapel + '</td><td>' + r.nama_kelas + '</td>' +
      '<td>' + SuperAdmin_tahunAjaranLabel_(r.tahun_ajaran_id) + '</td><td>' + r.status + '</td>' +
      '<td><button class="sp-btn secondary" onclick="SuperAdmin_editAssignmentFromDetail_(\'' + r.assignment_id + '\')">Edit</button> ' +
      '<button class="sp-btn secondary" onclick="SuperAdmin_deleteAssignment_(\'' + r.assignment_id + '\')">Hapus</button></td></tr>';
  }).join('');
  document.getElementById('sp-penugasan-detail-table').innerHTML =
    '<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>Mapel</th><th>Kelas</th><th>Tahun Ajaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>' + body + '</tbody></table></div>';
  document.getElementById('sp-penugasan-detail-overlay').classList.remove('hidden');
}

function SuperAdmin_closePenugasanDetail_() {
  document.getElementById('sp-penugasan-detail-overlay').classList.add('hidden');
  window.SuperAdmin._penugasanDetailScope = null;
}

function SuperAdmin_editAssignmentFromDetail_(assignmentId) {
  SuperAdmin_closePenugasanDetail_();
  SuperAdmin_editAssignment_(assignmentId);
}

function SuperAdmin_deleteAssignment_(assignmentId) {
  if (!confirm('Hapus penugasan ini? Aksi ini tidak bisa dibatalkan.')) return;
  runServer('adminDeleteAssignment', [assignmentId], {

function SuperAdmin_addKKMappingRow_() {
  var sekolahId = document.getElementById('sp-kk-sekolah').value;
  if (!sekolahId) { SIPENA_toast('Pilih sekolah dulu.', 'error'); return; }

function SuperAdmin_previewKenaikanKelas_() {
  var sekolahId = document.getElementById('sp-kk-sekolah').value;
  var taLama = document.getElementById('sp-kk-ta-lama').value;
  var taBaru = document.getElementById('sp-kk-ta-baru').value;
  if (!sekolahId || !taLama || !taBaru) { SIPENA_toast('Lengkapi sekolah, tahun ajaran lama, dan tahun ajaran baru.', 'error'); return; }
  if (taLama === taBaru) { SIPENA_toast('Tahun ajaran lama dan baru harus berbeda.', 'error'); return; }

  var mapping = [];
  document.querySelectorAll('#sp-kk-mapping-rows .sp-kk-row').forEach(function (row) {
    mapping.push({ kelas_lama_id: row.querySelector('.sp-kk-lama').value, kelas_tujuan_id: row.querySelector('.sp-kk-tujuan').value });
  });
  if (!mapping.length) { SIPENA_toast('Tambah minimal satu baris pemetaan kelas.', 'error'); return; }

  runServer('adminPreviewKenaikanKelas', [sekolahId, taLama, taBaru, mapping], {
    onSuccess: function (plan) {
      window.SuperAdmin._kkCtx = { sekolahId: sekolahId, taLama: taLama, taBaru: taBaru, mapping: mapping };
      SuperAdmin_renderKKPreview_(plan);
    }
  });
}

function SuperAdmin_renderKKPreview_(plan) {
  var el = document.getElementById('sp-kk-preview');
  var totalSiswa = 0;
  var html = '<div class="sp-form" style="flex-direction:column;align-items:stretch;">';
  plan.mapping.forEach(function (m) {
    totalSiswa += m.siswa.length;
    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border);">';
    html += '<div style="font-weight:700;">' + m.nama_kelas_lama + ' &rarr; ' + m.nama_kelas_tujuan + ' (' + m.siswa.length + ' siswa)</div>';
    if (!m.siswa.length) {
      html += '<div class="msg">Tidak ada siswa aktif di kelas ini untuk tahun ajaran lama.</div>';
    } else {
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;max-height:160px;overflow-y:auto;">' +
        m.siswa.map(function (s) {
          return '<label style="display:flex;align-items:center;gap:5px;font-weight:400;font-size:13px;">' +
            '<input type="checkbox" class="sp-kk-siswa-cb" checked value="' + s.siswa_id + '"> ' + s.nama_lengkap + (s.nis ? ' (' + s.nis + ')' : '') + '</label>';
        }).join('') + '</div>';
    }
    html += '</div>';
  });
  html += '<div class="msg">Kosongkan centang untuk siswa yang TIDAK ikut naik kelas kali ini.</div>';
  html += '<div style="display:flex;gap:10px;margin-top:12px;">';
  html += '<button type="button" class="sp-btn secondary" onclick="document.getElementById(\'sp-kk-preview\').classList.add(\'hidden\')">Batal</button>';
  if (totalSiswa) html += '<button type="button" class="sp-btn" onclick="SuperAdmin_confirmKenaikanKelas_()">Proses Kenaikan Kelas</button>';
  html += '</div></div>';
  el.innerHTML = html;
  el.classList.remove('hidden');
}

function SuperAdmin_confirmKenaikanKelas_() {
  var ctx = window.SuperAdmin._kkCtx;
  if (!ctx) return;
  var excluded = Array.prototype.slice.call(document.querySelectorAll('.sp-kk-siswa-cb'))
    .filter(function (cb) { return !cb.checked; }).map(function (cb) { return cb.value; });
  if (!confirm('Proses kenaikan kelas sekarang? Riwayat kelas lama tidak akan diubah, hanya ditambah riwayat baru untuk tahun ajaran baru.')) return;

  runServer('adminExecuteKenaikanKelas', [ctx.sekolahId, ctx.taLama, ctx.taBaru, ctx.mapping, excluded], {
    onSuccess: function (res) {
      SIPENA_toast(res.promoted + ' siswa naik kelas, ' + res.lulus + ' lulus/alumni' + (res.excluded ? ', ' + res.excluded + ' dikecualikan' : '') + '.');
      document.getElementById('sp-kk-preview').classList.add('hidden');
      document.getElementById('sp-kk-mapping-rows').innerHTML = '';
    }
  });
}

function SuperAdmin_wireJadwal_() {
  document.getElementById('sp-jadwal-guru').addEventListener('change', function () {
    SuperAdmin_refreshJadwalPenugasanOptions_(this.value);
  });

  var jadwalForm = document.getElementById('sp-form-jadwal');
  SIPENA_wireTimeInput_(jadwalForm.jam_mulai);
  SIPENA_wireTimeInput_(jadwalForm.jam_selesai);

  document.getElementById('sp-form-jadwal').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var guruId = document.getElementById('sp-jadwal-guru').value;
    var penugasanIdx = document.getElementById('sp-jadwal-penugasan').value;
    var btn = f.querySelector('button[type="submit"]');
    var editId = f.dataset.editId;

    if (editId) {
      var patch = { hari: f.hari.value, jam_mulai: f.jam_mulai.value, jam_selesai: f.jam_selesai.value, ruangan: f.ruangan.value, keterangan: f.keterangan.value };
      runServer('adminUpdateSchedule', [editId, patch], {
        loadingEl: btn,
        onSuccess: function () {
          SIPENA_toast('Jadwal diperbarui & disinkron.');
          SuperAdmin_cancelEditJadwal_(f);
          runServer('adminGetSchedules', [], { onSuccess: function (rows) { SuperAdmin.schedules = rows; SuperAdmin_renderJadwal(); } });
        }
      });
      return;
    }

    if (!guruId || penugasanIdx === '') { SIPENA_toast('Pilih guru dan penugasan dulu.', 'error'); return; }
    var p = window.SuperAdmin._jadwalPenugasanOptions[Number(penugasanIdx)];
    var data = {
      guru_id: guruId, mapel_id: p.mapel_id, kelas_id: p.kelas_id, tahun_ajaran_id: p.tahun_ajaran_id,
      hari: f.hari.value, jam_mulai: f.jam_mulai.value, jam_selesai: f.jam_selesai.value,
      ruangan: f.ruangan.value, keterangan: f.keterangan.value
    };
    runServer('adminCreateSchedule', [data], {
      loadingEl: btn,
      onSuccess: function () {
        SIPENA_toast('Jadwal tersimpan & disinkron ke spreadsheet guru.');
        f.reset();
        runServer('adminGetSchedules', [], { onSuccess: function (rows) { SuperAdmin.schedules = rows; SuperAdmin_renderJadwal(); } });
      }
    });
  });
}

function SuperAdmin_refreshJadwalPenugasanOptions_(guruId) {
  var assignments = SuperAdmin.assignments.filter(function (a) { return a.guru_id === guruId && String(a.status).toUpperCase() === 'AKTIF'; });
  window.SuperAdmin._jadwalPenugasanOptions = assignments;
  var sel = document.getElementById('sp-jadwal-penugasan');
  if (!assignments.length) { sel.innerHTML = '<option value="">Guru ini belum punya kelas</option>'; return; }
  sel.innerHTML = '<option value="">Pilih...</option>' + assignments.map(function (a, i) {
    return '<option value="' + i + '">' + a.nama_kelas + ' — ' + a.nama_mapel + '</option>';
  }).join('');
}

function SuperAdmin_cancelEditJadwal_(form) {
  document.getElementById('sp-jadwal-guru').disabled = false;
  document.getElementById('sp-jadwal-penugasan').disabled = false;
  SuperAdmin_clearFormEditMode_(form);
}

function SuperAdmin_editJadwal_(jadwalId) {
  var j = SuperAdmin.schedules.filter(function (r) { return r.jadwal_id === jadwalId; })[0];
  if (!j) return;
  var f = document.getElementById('sp-form-jadwal');
  document.getElementById('sp-jadwal-guru').value = j.guru_id;
  document.getElementById('sp-jadwal-guru').disabled = true;
  SuperAdmin_refreshJadwalPenugasanOptions_(j.guru_id);
  var opts = window.SuperAdmin._jadwalPenugasanOptions || [];
  var idx = -1;
  opts.forEach(function (a, i) { if (a.mapel_id === j.mapel_id && a.kelas_id === j.kelas_id && a.tahun_ajaran_id === j.tahun_ajaran_id) idx = i; });
  document.getElementById('sp-jadwal-penugasan').value = idx >= 0 ? String(idx) : '';
  document.getElementById('sp-jadwal-penugasan').disabled = true;
  f.hari.value = j.hari;
  f.jam_mulai.value = j.jam_mulai;
  f.jam_selesai.value = j.jam_selesai;
  f.ruangan.value = j.ruangan || '';
  f.keterangan.value = j.keterangan || '';
  SuperAdmin_setFormEditMode_(f, jadwalId);
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

var SP_JADWAL_HARI_URUTAN_ = ['SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];

/**
 * SuperAdmin_renderJadwal()
 * Dikelompokkan per sekolah lalu per hari (Senin—Sabtu, hanya hari yang
 * benar-benar ada jadwalnya yang dirender) — jadi satu sekolah langsung
 * terlihat sebagai jadwal satu minggu, bukan daftar datar tercampur.
 */
function SuperAdmin_renderJadwal() {
  var el = document.getElementById('sp-table-jadwal');
  if (!SuperAdmin.schedules.length) { el.innerHTML = '<div class="sp-empty">Belum ada jadwal.</div>'; return; }

  var bySekolah = {};
  SuperAdmin.schedules.forEach(function (r) {
    if (!bySekolah[r.sekolah_id]) bySekolah[r.sekolah_id] = [];
    bySekolah[r.sekolah_id].push(r);
  });
  var sekolahIds = Object.keys(bySekolah).sort(function (a, b) {
    return SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', a, 'nama_sekolah')
      .localeCompare(SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', b, 'nama_sekolah'));
  });

  el.innerHTML = sekolahIds.map(function (sid) {
    var namaSekolah = SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', sid, 'nama_sekolah') || '(Sekolah tidak diketahui)';
    var byHari = {};
    bySekolah[sid].forEach(function (r) { (byHari[r.hari] = byHari[r.hari] || []).push(r); });

    var mingguHtml = SP_JADWAL_HARI_URUTAN_.filter(function (hari) { return byHari[hari] && byHari[hari].length; }).map(function (hari) {
      var entries = byHari[hari].slice().sort(function (a, b) { return String(a.jam_mulai).localeCompare(String(b.jam_mulai)); });
      var body = entries.map(function (r) {
        return '<tr><td>' + r.jam_mulai + '–' + r.jam_selesai + '</td><td>' + r.nama_guru + '</td><td>' + r.nama_mapel + '</td>' +
          '<td>' + r.nama_kelas + '</td><td>' + (r.ruangan || '-') + '</td>' +
          '<td><button class="sp-btn secondary" onclick="SuperAdmin_editJadwal_(\'' + r.jadwal_id + '\')">Edit</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_deleteJadwal_(\'' + r.jadwal_id + '\')">Hapus</button></td></tr>';
      }).join('');
      return '<div style="font-weight:700;font-size:12.5px;color:var(--text-muted);margin:12px 0 4px;">' + SuperAdmin_hariLabel_(hari) + '</div>' +
        '<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>Jam</th><th>Guru</th><th>Mapel</th><th>Kelas</th><th>Ruangan</th><th>Aksi</th></tr></thead><tbody>' + body + '</tbody></table></div>';
    }).join('');

    return '<div class="sp-section-title" style="font-size:14px;margin-top:18px;">' + namaSekolah + '</div>' + mingguHtml;
  }).join('');
}

function SuperAdmin_hariLabel_(hari) {
  return hari.charAt(0) + hari.slice(1).toLowerCase();
}

function SuperAdmin_deleteJadwal_(jadwalId) {
  if (!confirm('Hapus jadwal ini? Aksi ini tidak bisa dibatalkan.')) return;
  runServer('adminDeleteSchedule', [jadwalId], {
    onSuccess: function () {
      SIPENA_toast('Jadwal dihapus.');
      runServer('adminGetSchedules', [], { onSuccess: function (rows) { SuperAdmin.schedules = rows; SuperAdmin_renderJadwal(); } });
    }
  });
}

function SuperAdmin_wireSiswa_() {
  document.getElementById('sp-form-siswa').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var editId = f.dataset.editId;
    var btn = f.querySelector('button[type="submit"]');

    if (editId) {
      var patch = { nis: f.nis.value, nisn: f.nisn.value, nama_lengkap: f.nama_lengkap.value, jenis_kelamin: f.jenis_kelamin.value, tahun_masuk: f.tahun_masuk.value, status: f.status.value };
      runServer('adminUpdateStudent', [editId, patch], {
        loadingEl: btn,
        onSuccess: function () {
          SIPENA_toast('Siswa diperbarui.');
          f.sekolah_id.disabled = false;
          SuperAdmin_clearFormEditMode_(f);
          SuperAdmin_refreshSiswaList_();
        }
      });
      return;
    }

    var data = { sekolah_id: f.sekolah_id.value, nis: f.nis.value, nisn: f.nisn.value, nama_lengkap: f.nama_lengkap.value, jenis_kelamin: f.jenis_kelamin.value, tahun_masuk: f.tahun_masuk.value };
    runServer('adminCreateStudent', [data], {
      loadingEl: btn,
      onSuccess: function () { SIPENA_toast('Siswa tersimpan.'); f.reset(); SuperAdmin_refreshSiswaList_(); }
    });
  });

  document.getElementById('sp-enroll-sekolah').addEventListener('change', function () {
    SuperAdmin_refreshEnrollKelasOptions_(this.value);
  });

  document.getElementById('sp-siswa-view-sekolah').addEventListener('change', function () {
    var sekolahId = this.value;
    var sel = document.getElementById('sp-siswa-view-kelas');
    var classes = SuperAdmin.classes.filter(function (k) { return k.sekolah_id === sekolahId && String(k.status).toUpperCase() !== 'NONAKTIF'; });
    sel.innerHTML = SuperAdmin_options_(classes, 'kelas_id', function (k) { return k.nama_kelas; }, 'Pilih kelas');
  });

  document.getElementById('sp-import-textarea').addEventListener('keydown', function (e) {
    if (e.key === 'Tab') { e.preventDefault(); var s = this.selectionStart; this.value = this.value.slice(0, s) + '\t' + this.value.slice(this.selectionEnd); this.selectionStart = this.selectionEnd = s + 1; }
  });
}

function SuperAdmin_refreshEnrollKelasOptions_(sekolahId) {
  var sel = document.getElementById('sp-enroll-kelas');
  var classes = SuperAdmin.classes.filter(function (k) { return k.sekolah_id === sekolahId && String(k.status).toUpperCase() !== 'NONAKTIF'; });
  sel.innerHTML = SuperAdmin_options_(classes, 'kelas_id', function (k) { return k.nama_kelas; }, 'Pilih kelas');
}

function SuperAdmin_cancelEditSiswa_(form) {
  form.sekolah_id.disabled = false;
  SuperAdmin_clearFormEditMode_(form);
}

/**
 * SuperAdmin_loadSiswaPerKelas_() / SuperAdmin_renderSiswa(students)
 * Daftar siswa TIDAK LAGI satu tabel datar berisi semua siswa semua
 * sekolah (bisa ribuan baris tanpa filter) — sekarang di-scope per
 * sekolah+kelas+tahun ajaran (pakai adminGetEnrollment yang sudah ada
 * untuk "Kelola Siswa per Kelas"), diminta eksplisit lewat tombol
 * Tampilkan. Scope terakhir diingat (SuperAdmin._siswaViewScope) supaya
 * tabel otomatis nyegar setelah tambah/ubah/hapus siswa.
 */
function SuperAdmin_loadSiswaPerKelas_() {
  var kelasId = document.getElementById('sp-siswa-view-kelas').value;
  var tahunAjaranId = document.getElementById('sp-siswa-view-ta').value;
  if (!kelasId || !tahunAjaranId) { SIPENA_toast('Pilih sekolah, kelas, dan tahun ajaran dulu.', 'error'); return; }
  SuperAdmin._siswaViewScope = { kelasId: kelasId, tahunAjaranId: tahunAjaranId };
  runServer('adminGetEnrollment', [kelasId, tahunAjaranId], {
    onSuccess: function (res) { SuperAdmin_renderSiswa(res.enrolled); }
  });
}

function SuperAdmin_renderSiswa(students) {
  SIPENA_table_('sp-table-siswa', [
    { key: 'nis', label: 'NIS' }, { key: 'nisn', label: 'NISN' }, { key: 'nama_lengkap', label: 'Nama' },
    { key: 'jenis_kelamin', label: 'JK' }, { key: 'status', label: 'Status' },
    { label: 'Aksi', render: function (r) {
        return '<button class="sp-btn secondary" onclick="SuperAdmin_editSiswa_(\'' + r.siswa_id + '\')">Edit</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_deleteSiswa_(\'' + r.siswa_id + '\', \'' + String(r.nama_lengkap).replace(/'/g, "\\'") + '\')">Hapus</button>';
      } }
  ], students || [], 'Pilih sekolah, kelas, dan tahun ajaran di atas lalu klik Tampilkan.');
}

/**
 * SuperAdmin_refreshSiswaList_()
 * SuperAdmin.students tetap dimuat penuh di latar belakang (dipakai
 * SuperAdmin_editSiswa_ mencari data siswa by id, dan Export Excel) —
 * yang berubah cuma TAMPILANNYA, bukan datanya. Kalau ada kelas yang
 * sedang ditampilkan, ikut disegarkan.
 */
function SuperAdmin_refreshSiswaList_() {
  runServer('adminGetStudents', [], {
    onSuccess: function (rows) {
      SuperAdmin.students = rows;
      if (SuperAdmin._siswaViewScope) SuperAdmin_loadSiswaPerKelas_();
    }
  });
}

function SuperAdmin_exportSiswaExcel_() {
  if (!SuperAdmin.students.length) { SIPENA_toast('Belum ada siswa untuk diexport.', 'error'); return; }
  runServer('adminExportStudentsUrl', [null], {
    onSuccess: function (res) { window.open(res.export_url, '_blank'); }
  });
}

function SuperAdmin_editSiswa_(siswaId) {
  var s = SuperAdmin.students.filter(function (r) { return r.siswa_id === siswaId; })[0];
  if (!s) return;
  var f = document.getElementById('sp-form-siswa');
  f.sekolah_id.value = s.sekolah_id || ''; f.sekolah_id.disabled = true;
  f.nis.value = s.nis || '';
  f.nisn.value = s.nisn || '';
  f.nama_lengkap.value = s.nama_lengkap || '';
  f.jenis_kelamin.value = s.jenis_kelamin || '';
  f.tahun_masuk.value = s.tahun_masuk || '';
  f.status.value = s.status || 'AKTIF';
  SuperAdmin_setFormEditMode_(f, siswaId);
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function SuperAdmin_deleteSiswa_(siswaId, nama) {
  if (!confirm('Hapus siswa "' + nama + '"? Aksi ini tidak bisa dibatalkan.')) return;
  runServer('adminDeleteStudent', [siswaId], {
    onSuccess: function () {
      SIPENA_toast('Siswa dihapus.');
      SuperAdmin_refreshSiswaList_();
    }
  });
}

function SuperAdmin_loadStudentStats_() {
  var sekolahId = document.getElementById('sp-stats-sekolah').value;
  if (!sekolahId) { SIPENA_toast('Pilih sekolah dulu.', 'error'); return; }
  runServer('adminGetStudentStats', [sekolahId], { onSuccess: SuperAdmin_renderStudentStats_ });
}

function SuperAdmin_renderStudentStats_(stats) {
  var el = document.getElementById('sp-stats-box');
  var html = '<div class="sp-form" style="flex-direction:column;align-items:stretch;">';
  html += '<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px;">';
  html += '<div><div style="font-size:24px;font-weight:700;color:var(--brand);">' + stats.total_siswa_aktif + '</div><div class="sp-detail-label">Total Siswa Aktif</div></div>';
  html += '<div><div style="font-size:24px;font-weight:700;color:var(--brand);">' + stats.total_terdaftar_kelas + '</div><div class="sp-detail-label">Terdaftar di Kelas (Periode Aktif)</div></div>';
  html += '</div>';

  if (!stats.ada_periode_aktif) {
    html += '<div class="msg danger">Sekolah ini belum punya tahun ajaran aktif — aktifkan dulu di tab Tahun Ajaran supaya breakdown per kelas/tingkat bisa dihitung.</div>';
  } else if (stats.total_siswa_aktif !== stats.total_terdaftar_kelas) {
    html += '<div class="msg danger">Selisih ' + Math.abs(stats.total_siswa_aktif - stats.total_terdaftar_kelas) + ' siswa — ada siswa aktif yang belum di-enroll ke kelas mana pun untuk periode ini. Cek "Kelola Siswa per Kelas".</div>';
  }

  if (stats.per_tingkat.length) {
    html += '<div style="margin-top:8px;font-weight:600;font-size:13px;">Per Tingkat</div>';
    html += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px;">' + stats.per_tingkat.map(function (t) {
      return '<div><div style="font-size:18px;font-weight:700;">' + t.jumlah + '</div><div class="sp-detail-label">Tingkat ' + t.tingkat + '</div></div>';
    }).join('') + '</div>';

    html += '<div style="font-weight:600;font-size:13px;">Per Kelas</div>';
    html += '<div class="sp-table-wrap" style="margin-top:6px;"><table class="sp-table"><thead><tr><th>Kelas</th><th>Tingkat</th><th>Jumlah Siswa</th></tr></thead><tbody>' +
      stats.per_kelas.map(function (k) { return '<tr><td>' + k.nama_kelas + '</td><td>' + k.tingkat + '</td><td>' + k.jumlah + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ---- Import Siswa (Massal) ---- */

/**
 * SuperAdmin_downloadImportTemplate_()
 * Template dibuat & disimpan di server (Config_getImportTemplateUrl_)
 * lalu dibuka lewat window.open ke URL export-xlsx native Google Sheets
 * — BUKAN client-side XLSX.writeFile, yang gagal diam-diam kalau halaman
 * sedang berjalan di dalam iframe sandbox HtmlService (Apps Script tidak
 * mengizinkan iframe-nya memicu download berkas langsung).
 */
function SuperAdmin_downloadImportTemplate_() {
  runServer('adminGetImportTemplateUrl', [], {
    onSuccess: function (res) { window.open(res.export_url, '_blank'); }
  });
}

function SuperAdmin_previewImport_() {
  var sekolahId = document.getElementById('sp-import-sekolah').value;
  if (!sekolahId) { SIPENA_toast('Pilih sekolah dulu.', 'error'); return; }

  var fileInput = document.getElementById('sp-import-file');
  if (fileInput.files && fileInput.files[0]) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });
      SuperAdmin_processImportRows_(sekolahId, rows.map(function (r) { return r.map(function (c) { return String(c === undefined ? '' : c); }); }));
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
    return;
  }

  var raw = document.getElementById('sp-import-textarea').value;
  var lines = raw.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l; });
  if (!lines.length) { SIPENA_toast('Unggah file atau tempel data siswa dulu.', 'error'); return; }
  var rows = lines.map(function (line) { return line.indexOf('\t') !== -1 ? line.split('\t') : line.split(','); });
  SuperAdmin_processImportRows_(sekolahId, rows);
}

/**
 * SuperAdmin_processImportRows_(sekolahId, rows)
 * rows: array-of-array [Kelas, NIS, Nama, JK]. Baris pertama dilewati
 * kalau memang header (dikenali dari kata "kelas"/"nis" di kolom
 * pertama/kedua, case-insensitive) supaya template yang diunduh lalu
 * diunggah lagi tidak perlu dihapus headernya manual.
 */
function SuperAdmin_processImportRows_(sekolahId, rows) {
  if (rows.length && String(rows[0][0] || '').toUpperCase().indexOf('KELAS') !== -1) rows = rows.slice(1);
  // Lewati baris keterangan "— Kelas yang tersedia ... —" dari template
  // (baris itu diawali karakter "—" di kolom pertama).
  rows = rows.filter(function (r) { return String((r && r[0]) || '').trim().indexOf('—') !== 0; });

  var kelasByName = {};
  SuperAdmin.classes.filter(function (k) { return k.sekolah_id === sekolahId; }).forEach(function (k) {
    kelasByName[String(k.nama_kelas).toUpperCase().trim()] = k;
  });

  var valid = [];
  var errors = [];
  rows.forEach(function (cols, i) {
    if (!cols || cols.every(function (c) { return !String(c || '').trim(); })) return; // baris kosong
    if (cols.length < 4) { errors.push('Baris ' + (i + 1) + ': format tidak lengkap (butuh 4 kolom: Kelas, NIS, Nama, JK).'); return; }

    var kelasName = String(cols[0] || '').trim(), nis = String(cols[1] || '').trim(),
      nama = String(cols[2] || '').trim(), jk = String(cols[3] || '').trim().toUpperCase();
    if (!nama) { errors.push('Baris ' + (i + 1) + ': nama kosong.'); return; }
    if (['L', 'P'].indexOf(jk) === -1) { errors.push('Baris ' + (i + 1) + ' (' + nama + '): jenis kelamin harus L atau P.'); return; }
    var kelas = kelasByName[kelasName.toUpperCase()];
    if (!kelas) { errors.push('Baris ' + (i + 1) + ' (' + nama + '): kelas "' + kelasName + '" tidak ditemukan di sekolah ini.'); return; }

    valid.push({ nis: nis, nama_lengkap: nama, jenis_kelamin: jk, kelas_id: kelas.kelas_id, nama_kelas: kelas.nama_kelas, tingkat: kelas.tingkat });
  });

  window.SuperAdmin._importCtx = { sekolahId: sekolahId, rows: valid };
  SuperAdmin_renderImportPreview_(valid, errors);
}

function SuperAdmin_renderImportPreview_(valid, errors) {
  var el = document.getElementById('sp-import-preview');
  var html = '';
  if (errors.length) {
    html += '<div class="msg danger" style="margin-bottom:10px;">' + errors.length + ' baris bermasalah (dilewati):<br>' + errors.join('<br>') + '</div>';
  }
  if (!valid.length) {
    html += '<div class="sp-empty">Tidak ada baris valid untuk diimport.</div>';
    el.innerHTML = html;
    el.classList.remove('hidden');
    return;
  }

  // Sortir & kelompokkan per kelas, plus ringkasan per tingkat, supaya
  // Superadmin bisa langsung mencocokkan jumlah sebelum konfirmasi.
  var byKelas = {};
  var byTingkat = {};
  valid.forEach(function (r) {
    if (!byKelas[r.nama_kelas]) byKelas[r.nama_kelas] = [];
    byKelas[r.nama_kelas].push(r);
    var t = r.tingkat || '?';
    byTingkat[t] = (byTingkat[t] || 0) + 1;
  });
  var kelasNames = Object.keys(byKelas).sort();
  var tingkatKeys = Object.keys(byTingkat).sort();

  html += '<div class="sp-form" style="flex-direction:column;align-items:stretch;">';
  html += '<div style="font-weight:700;margin-bottom:4px;">Total: ' + valid.length + ' siswa, ' + kelasNames.length + ' kelas</div>';
  html += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;">' + tingkatKeys.map(function (t) {
    return '<div><div style="font-size:16px;font-weight:700;">' + byTingkat[t] + '</div><div class="sp-detail-label">Tingkat ' + t + '</div></div>';
  }).join('') + '</div>';

  kelasNames.forEach(function (kelasName) {
    var rowsForKelas = byKelas[kelasName];
    html += '<div style="padding:8px 0;border-top:1px solid var(--border);">';
    html += '<div style="font-weight:600;font-size:13px;margin-bottom:4px;">' + kelasName + ' (' + rowsForKelas.length + ' siswa)</div>';
    html += '<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>NIS</th><th>Nama</th><th>JK</th></tr></thead><tbody>' +
      rowsForKelas.map(function (r) { return '<tr><td>' + (r.nis || '-') + '</td><td>' + r.nama_lengkap + '</td><td>' + r.jenis_kelamin + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  });

  html += '<div style="display:flex;gap:10px;margin-top:12px;">' +
    '<button type="button" class="sp-btn secondary" onclick="document.getElementById(\'sp-import-preview\').classList.add(\'hidden\')">Batal</button>' +
    '<button type="button" class="sp-btn" onclick="SuperAdmin_confirmImport_()">Import ' + valid.length + ' Siswa</button>' +
    '</div></div>';

  el.innerHTML = html;
  el.classList.remove('hidden');
}

function SuperAdmin_confirmImport_() {
  var ctx = window.SuperAdmin._importCtx;
  if (!ctx || !ctx.rows.length) return;
  runServer('adminImportStudents', [ctx.sekolahId, ctx.rows], {
    onSuccess: function (res) {
      SIPENA_toast(res.created + ' siswa berhasil diimport' + (res.enrolled ? ', ' + res.enrolled + ' langsung masuk roster kelas' : '') + (res.warning ? ' — ' + res.warning : '') + '.');
      document.getElementById('sp-import-preview').classList.add('hidden');
      document.getElementById('sp-import-textarea').value = '';
      document.getElementById('sp-import-file').value = '';
      SuperAdmin_refreshSiswaList_();
      if (document.getElementById('sp-stats-sekolah').value === ctx.sekolahId) SuperAdmin_loadStudentStats_();
    }
  });
}

/* ---- Kelola Siswa per Kelas ---- */
function SuperAdmin_loadEnrollment_() {
  var kelasId = document.getElementById('sp-enroll-kelas').value;
  var tahunAjaranId = document.getElementById('sp-enroll-ta').value;
  if (!kelasId || !tahunAjaranId) { SIPENA_toast('Lengkapi kelas dan tahun ajaran dulu.', 'error'); return; }

  window.SuperAdmin._enrollCtx = { kelasId: kelasId, tahunAjaranId: tahunAjaranId };
  runServer('adminGetEnrollment', [kelasId, tahunAjaranId], {
    onSuccess: function (res) {
      document.getElementById('sp-enroll-box').classList.remove('hidden');
      SuperAdmin_renderEnrollCandidates_(res.not_enrolled);
      SuperAdmin_renderEnrollCurrent_(res.enrolled);
    }
  });
}

function SuperAdmin_renderEnrollCandidates_(students) {
  var el = document.getElementById('sp-enroll-candidates');
  if (!students.length) { el.innerHTML = '<span class="msg">Semua siswa aktif di sekolah ini sudah ada di kelas ini.</span>'; return; }
  el.innerHTML = students.map(function (s) {
    return '<label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;padding:3px 0;">' +
      '<input type="checkbox" class="sp-enroll-cb" value="' + s.siswa_id + '"> ' + s.nama_lengkap + (s.nis ? ' (' + s.nis + ')' : '') + '</label>';
  }).join('');
}

function SuperAdmin_toggleAllEnrollCheckbox_(checked) {
  document.querySelectorAll('.sp-enroll-cb').forEach(function (cb) { cb.checked = checked; });
}

function SuperAdmin_confirmEnroll_() {
  var ctx = window.SuperAdmin._enrollCtx;
  if (!ctx) return;
  var ids = Array.prototype.slice.call(document.querySelectorAll('.sp-enroll-cb:checked')).map(function (cb) { return cb.value; });
  if (!ids.length) { SIPENA_toast('Pilih minimal satu siswa.', 'error'); return; }
  runServer('adminEnrollStudents', [ctx.kelasId, ctx.tahunAjaranId, ids], {
    onSuccess: function (res) {
      SIPENA_toast(res.added.length + ' siswa ditambahkan ke kelas' + (res.skipped.length ? ' (' + res.skipped.length + ' sudah ada sebelumnya)' : '') + '.');
      SuperAdmin_loadEnrollment_();
    }
  });
}

function SuperAdmin_renderEnrollCurrent_(students) {
  SIPENA_table_('sp-enroll-current', [
    { key: 'nama_lengkap', label: 'Nama' }, { key: 'nis', label: 'NIS' },
    { label: 'Aksi', render: function (s) { return '<button class="sp-btn secondary" onclick="SuperAdmin_unenroll_(\'' + s.riwayat_id + '\')">Keluarkan</button>'; } }
  ], students, 'Belum ada siswa di kelas ini.');
}

function SuperAdmin_unenroll_(riwayatId) {
  if (!confirm('Keluarkan siswa ini dari kelas? Statusnya jadi NONAKTIF, histori tetap tersimpan.')) return;
  runServer('adminUpdateEnrollmentStatus', [riwayatId, 'NONAKTIF'], {
    onSuccess: function () { SIPENA_toast('Siswa dikeluarkan dari kelas.'); SuperAdmin_loadEnrollment_(); }
  });
}

/* ---------- Audit Log (Phase 9) ---------- */
function SuperAdmin_panelAuditLog_() {
  return '' +
    '<div class="sp-panel" id="sp-panel-auditlog">' +
    '  <div class="sp-section-title">Audit Log</div>' +
    '  <div class="msg" style="margin:-6px 0 10px;">Mencatat aksi administratif (tambah/ubah/hapus, sinkronisasi, kenaikan kelas, dsb.) — 300 entri terakhir. Ini bukan pengganti pengujian isolasi antar-akun (butuh login sungguhan sebagai guru berbeda untuk itu, tidak bisa disimulasikan dari satu sesi).</div>' +
    '  <button type="button" class="sp-btn secondary" style="margin-bottom:10px;" onclick="SuperAdmin_loadAuditLog_()">Muat Ulang</button>' +
    '  <div id="sp-auditlog-table"></div>' +
    '</div>';
}

function SuperAdmin_loadAuditLog_() {
  runServer('getAuditLog', [300], { onSuccess: SuperAdmin_renderAuditLog_ });
}

function SuperAdmin_renderAuditLog_(rows) {
  SIPENA_table_('sp-auditlog-table', [
    { label: 'Waktu', render: function (r) { return new Date(r.timestamp).toLocaleString('id-ID'); } },
    { key: 'email', label: 'Email' }, { key: 'action', label: 'Aksi' }, { key: 'module', label: 'Modul' },
    { key: 'record_id', label: 'Record' }, { key: 'description', label: 'Detail' }
  ], rows, 'Belum ada aktivitas tercatat.');
}

</script>
