<script>
var SuperAdmin = {
  schools: [], teachers: [], subjects: [], classes: [], academicYears: [], assignments: []
};

var SP_TINGKAT_OPTIONS_ = {
  SD: ['1', '2', '3', '4', '5', '6'],
  SMP: ['7', '8', '9'],
  SMA: ['10', '11', '12'],
  SMK: ['10', '11', '12']
};

function SuperAdmin_init() {
  document.body.classList.add('sp-app-mode');
  document.getElementById('sp-admin-app').classList.remove('hidden');
  document.getElementById('sp-admin-email').textContent = (window.SIPENA.auth && window.SIPENA.auth.email) || '-';

  document.querySelectorAll('#sp-admin-tabs .sp-tab').forEach(function (btn) {
    btn.addEventListener('click', function () { SuperAdmin_showTab(btn.getAttribute('data-tab')); });
  });

  SuperAdmin_buildPanels();
  SuperAdmin_loadAll();
  SuperAdmin_showTab('sekolah');

  document.getElementById('sp-btn-open-db').addEventListener('click', function () {
    runServer('adminGetCentralSpreadsheetInfo', [], {
      onSuccess: function (info) {
        console.log('SIPENA_MASTER info:', info);
        SIPENA_toast('Sheet: ' + info.sheets.map(function (s) { return s.name + '(' + s.rows + ')'; }).join(', '));
        window.open(info.url, '_blank');
      }
    });
  });
}

function SuperAdmin_showTab(tabId) {
  document.querySelectorAll('#sp-admin-tabs .sp-tab').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
  });
  document.querySelectorAll('#sp-admin-panels .sp-panel').forEach(function (p) {
    p.classList.toggle('active', p.id === 'sp-panel-' + tabId);
  });
}

function SuperAdmin_loadAll() {
  runServer('adminGetSchools', [], { onSuccess: function (rows) { console.log('adminGetSchools ->', rows); SuperAdmin.schools = rows; SuperAdmin_renderSekolah(); SuperAdmin_refreshSelects(); }, onError: function (msg) { console.error('adminGetSchools FAILED:', msg); SIPENA_toast('Gagal muat sekolah: ' + msg, 'error'); } });
  runServer('adminGetSubjects', [], { onSuccess: function (rows) { SuperAdmin.subjects = rows; SuperAdmin_renderMapel(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetClasses', [], { onSuccess: function (rows) { SuperAdmin.classes = rows; SuperAdmin_renderKelas(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetAcademicYears', [], { onSuccess: function (rows) { SuperAdmin.academicYears = rows; SuperAdmin_renderTahunAjaran(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetTeachers', [], { onSuccess: function (rows) { SuperAdmin.teachers = rows; SuperAdmin_renderGuru(); SuperAdmin_refreshSelects(); } });
  runServer('adminGetAssignments', [], { onSuccess: function (rows) { SuperAdmin.assignments = rows; SuperAdmin_renderPenugasan(); } });
}

/* ================= helper umum ================= */

function SuperAdmin_el_(html) {
  var t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function SuperAdmin_table_(containerId, columns, rows, emptyText) {
  var el = document.getElementById(containerId);
  if (!rows || !rows.length) {
    el.innerHTML = '<div class="sp-empty">' + (emptyText || 'Belum ada data.') + '</div>';
    return;
  }
  var thead = '<tr>' + columns.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') + '</tr>';
  var tbody = rows.map(function (r) {
    return '<tr>' + columns.map(function (c) {
      return '<td>' + (c.render ? c.render(r) : (r[c.key] === undefined || r[c.key] === '' ? '-' : r[c.key])) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  el.innerHTML = '<div class="sp-table-wrap"><table class="sp-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
}

function SuperAdmin_options_(list, valueKey, labelFn, placeholder) {
  var opts = '<option value="">' + (placeholder || 'Pilih...') + '</option>';
  list.forEach(function (item) {
    opts += '<option value="' + item[valueKey] + '">' + labelFn(item) + '</option>';
  });
  return opts;
}

function SuperAdmin_refreshSelects() {
  document.querySelectorAll('select[data-source="sekolah"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.schools, 'sekolah_id', function (s) { return s.nama_sekolah + ' (' + s.jenjang + ')'; }, 'Pilih sekolah');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="mapel"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.subjects, 'mapel_id', function (m) { return m.nama_mapel; }, 'Pilih mapel');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="kelas"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.classes, 'kelas_id', function (k) { return k.nama_kelas; }, 'Pilih kelas');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="guru"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.teachers, 'guru_id', function (g) { return g.nama_lengkap + ' (' + g.email + ')'; }, 'Pilih guru');
    sel.value = cur;
  });
  document.querySelectorAll('select[data-source="tahunajaran"]').forEach(function (sel) {
    var cur = sel.value;
    sel.innerHTML = SuperAdmin_options_(SuperAdmin.academicYears, 'tahun_ajaran_id', function (t) { return t.label + ' - ' + t.semester; }, 'Pilih tahun ajaran');
    sel.value = cur;
  });
}

function SuperAdmin_labelFromId_(list, idKey, id, labelKey) {
  var found = list.filter(function (r) { return r[idKey] === id; })[0];
  return found ? found[labelKey] : id;
}

/**
 * Mode edit dipakai bersama semua form "Tambah X": form yang sama dipakai
 * ulang untuk edit — tombol submit berubah teks jadi "Update", dan
 * form.dataset.editId menandai record mana yang sedang diedit (dibaca di
 * submit handler masing-masing form untuk memilih adminCreateX vs
 * adminUpdateX).
 */
function SuperAdmin_setFormEditMode_(form, id) {
  form.dataset.editId = id;
  form.querySelector('button[type="submit"]').textContent = 'Update';
  var cancelBtn = form.querySelector('.sp-btn-cancel-edit');
  if (cancelBtn) cancelBtn.classList.remove('hidden');
}
function SuperAdmin_clearFormEditMode_(form) {
  delete form.dataset.editId;
  form.querySelector('button[type="submit"]').textContent = 'Simpan';
  var cancelBtn = form.querySelector('.sp-btn-cancel-edit');
  if (cancelBtn) cancelBtn.classList.add('hidden');
  form.reset();
}
function SuperAdmin_cancelEditButton_() {
  return '<button type="button" class="sp-btn secondary sp-btn-cancel-edit hidden" onclick="SuperAdmin_clearFormEditMode_(this.form)">Batal Edit</button>';
}

/* ================= bangun markup semua panel ================= */

function SuperAdmin_buildPanels() {
  var root = document.getElementById('sp-admin-panels');
  root.innerHTML =
    SuperAdmin_panelSekolah_() +
    SuperAdmin_panelGuru_() +
    SuperAdmin_panelMapel_() +
    SuperAdmin_panelKelas_() +
    SuperAdmin_panelTahunAjaran_() +
    SuperAdmin_panelPenugasan_() +
    SuperAdmin_panelRombel_();

  SuperAdmin_wireSekolah_();
  SuperAdmin_wireGuru_();
  SuperAdmin_wireMapel_();
  SuperAdmin_wireKelas_();
  SuperAdmin_wireTahunAjaran_();
  SuperAdmin_wirePenugasan_();
  SuperAdmin_wireRombel_();
}

/* ---------- Sekolah ---------- */
function SuperAdmin_panelSekolah_() {
  return '' +
    '<div class="sp-panel active" id="sp-panel-sekolah">' +
    '  <div class="sp-section-title">Tambah Sekolah</div>' +
    '  <form class="sp-form" id="sp-form-sekolah">' +
    '    <div class="sp-field"><label>NPSN</label><input name="npsn"></div>' +
    '    <div class="sp-field"><label>Nama Sekolah</label><input name="nama_sekolah" required></div>' +
    '    <div class="sp-field"><label>Jenjang</label><select name="jenjang" required>' +
    '      <option value="">Pilih</option><option>SD</option><option>SMP</option><option>SMA</option><option>SMK</option>' +
    '    </select></div>' +
    '    <div class="sp-field"><label>Kabupaten</label><input name="kabupaten"></div>' +
    '    <div class="sp-field"><label>Provinsi</label><input name="provinsi"></div>' +
    '    <button class="sp-btn" type="submit">Simpan</button>' +
    SuperAdmin_cancelEditButton_() +
    '  </form>' +
    '  <div class="sp-section-title">Daftar Sekolah</div>' +
    '  <div id="sp-table-sekolah"></div>' +
    '</div>';
}
function SuperAdmin_wireSekolah_() {
  document.getElementById('sp-form-sekolah').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var data = { npsn: f.npsn.value, nama_sekolah: f.nama_sekolah.value, jenjang: f.jenjang.value, kabupaten: f.kabupaten.value, provinsi: f.provinsi.value };
    var btn = f.querySelector('button[type="submit"]');
    var editId = f.dataset.editId;
    runServer(editId ? 'adminUpdateSchool' : 'adminCreateSchool', editId ? [editId, data] : [data], {
      loadingEl: btn,
      onSuccess: function () {
        SIPENA_toast(editId ? 'Sekolah diperbarui.' : 'Sekolah tersimpan.');
        SuperAdmin_clearFormEditMode_(f);
        runServer('adminGetSchools', [], {
          onSuccess: function (rows) { SuperAdmin.schools = rows; SuperAdmin_renderSekolah(); SuperAdmin_refreshSelects(); },
          onError: function (msg) { SIPENA_toast('Tersimpan, tapi gagal muat ulang daftar: ' + msg, 'error'); }
        });
      }
    });
  });
}
function SuperAdmin_editSchool_(sekolahId) {
  var s = SuperAdmin.schools.filter(function (r) { return r.sekolah_id === sekolahId; })[0];
  if (!s) return;
  var f = document.getElementById('sp-form-sekolah');
  f.npsn.value = s.npsn || '';
  f.nama_sekolah.value = s.nama_sekolah || '';
  f.jenjang.value = s.jenjang || '';
  f.kabupaten.value = s.kabupaten || '';
  f.provinsi.value = s.provinsi || '';
  SuperAdmin_setFormEditMode_(f, sekolahId);
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function SuperAdmin_renderSekolah() {
  SuperAdmin_table_('sp-table-sekolah', [
    { key: 'sekolah_id', label: 'ID' }, { key: 'npsn', label: 'NPSN' },
    { key: 'nama_sekolah', label: 'Nama' }, { key: 'jenjang', label: 'Jenjang' }, { key: 'status', label: 'Status' },
    { label: 'Aksi', render: function (r) {
        return '<button class="sp-btn secondary" onclick="SuperAdmin_editSchool_(\'' + r.sekolah_id + '\')">Edit</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_deleteSchool_(\'' + r.sekolah_id + '\', \'' + String(r.nama_sekolah).replace(/'/g, "\\'") + '\')">Hapus</button>';
      } }
  ], SuperAdmin.schools, 'Belum ada sekolah.');
}

function SuperAdmin_deleteSchool_(sekolahId, namaSekolah) {
  if (!confirm('Hapus sekolah "' + namaSekolah + '"? Aksi ini tidak bisa dibatalkan.')) return;
  runServer('adminDeleteSchool', [sekolahId], {
    onSuccess: function () {
      SIPENA_toast('Sekolah dihapus.');
      runServer('adminGetSchools', [], { onSuccess: function (rows) { SuperAdmin.schools = rows; SuperAdmin_renderSekolah(); SuperAdmin_refreshSelects(); } });
    }
  });
}

/* ---------- Guru ---------- */
function SuperAdmin_panelGuru_() {
  return '' +
    '<div class="sp-panel" id="sp-panel-guru">' +
    '  <div class="sp-section-title">Tambah Guru</div>' +
    '  <form class="sp-form" id="sp-form-guru">' +
    '    <div class="sp-field"><label>Sekolah</label><select name="sekolah_id" data-source="sekolah" required></select></div>' +
    '    <div class="sp-field"><label>Email</label><input name="email" type="email" required></div>' +
    '    <div class="sp-field"><label>Nama Lengkap</label><input name="nama_lengkap" required></div>' +
    '    <div class="sp-field"><label>NIP</label><input name="nip"></div>' +
    '    <div class="sp-field"><label>NUPTK</label><input name="nuptk"></div>' +
    '    <div class="sp-field"><label>Jabatan</label><input name="jabatan" value="Guru"></div>' +
    '    <div class="sp-field"><label>No. HP</label><input name="no_hp"></div>' +
    '    <button class="sp-btn" type="submit">Simpan &amp; Provisi Spreadsheet</button>' +
    '    <button type="button" class="sp-btn secondary sp-btn-cancel-edit hidden" onclick="SuperAdmin_cancelEditGuru_(this.form)">Batal Edit</button>' +
    '    <div class="msg hidden" id="sp-guru-edit-note" style="flex-basis:100%;margin:0;">Mode edit: sekolah &amp; email tidak bisa diubah di sini.</div>' +
    '  </form>' +
    '  <div class="sp-section-title">Daftar Guru</div>' +
    '  <div id="sp-table-guru"></div>' +
    '</div>';
}
function SuperAdmin_wireGuru_() {
  document.getElementById('sp-form-guru').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var editId = f.dataset.editId;
    var btn = f.querySelector('button[type="submit"]');

    if (editId) {
      var patch = { nama_lengkap: f.nama_lengkap.value, nip: f.nip.value, nuptk: f.nuptk.value, jabatan: f.jabatan.value, no_hp: f.no_hp.value };
      runServer('adminUpdateTeacher', [editId, patch], {
        loadingEl: btn,
        onSuccess: function () {
          SIPENA_toast('Data guru diperbarui.');
          SuperAdmin_clearFormEditMode_(f);
          document.getElementById('sp-guru-edit-note').classList.add('hidden');
          f.sekolah_id.disabled = false; f.email.disabled = false;
          runServer('adminGetTeachers', [], { onSuccess: function (rows) { SuperAdmin.teachers = rows; SuperAdmin_renderGuru(); SuperAdmin_refreshSelects(); } });
        }
      });
      return;
    }

    var data = { sekolah_id: f.sekolah_id.value, email: f.email.value, nama_lengkap: f.nama_lengkap.value, nip: f.nip.value, nuptk: f.nuptk.value, jabatan: f.jabatan.value, no_hp: f.no_hp.value };
    runServer('adminCreateTeacher', [data], {
      loadingEl: btn,
      onSuccess: function (res) {
        SIPENA_toast(res.spreadsheet_provisioned ? 'Guru tersimpan & spreadsheet siap.' : 'Guru tersimpan, TAPI provisioning spreadsheet gagal — coba tombol "Provisi ulang" di tabel.');
        f.reset();
        runServer('adminGetTeachers', [], { onSuccess: function (rows) { SuperAdmin.teachers = rows; SuperAdmin_renderGuru(); SuperAdmin_refreshSelects(); } });
      }
    });
  });
}
function SuperAdmin_cancelEditGuru_(form) {
  form.sekolah_id.disabled = false;
  form.email.disabled = false;
  document.getElementById('sp-guru-edit-note').classList.add('hidden');
  SuperAdmin_clearFormEditMode_(form);
}
function SuperAdmin_editTeacher_(guruId) {
  var g = SuperAdmin.teachers.filter(function (r) { return r.guru_id === guruId; })[0];
  if (!g) return;
  var f = document.getElementById('sp-form-guru');
  f.sekolah_id.value = g.sekolah_id || ''; f.sekolah_id.disabled = true;
  f.email.value = g.email || ''; f.email.disabled = true;
  f.nama_lengkap.value = g.nama_lengkap || '';
  f.nip.value = g.nip || '';
  f.nuptk.value = g.nuptk || '';
  f.jabatan.value = g.jabatan || '';
  f.no_hp.value = g.no_hp || '';
  document.getElementById('sp-guru-edit-note').classList.remove('hidden');
  SuperAdmin_setFormEditMode_(f, guruId);
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function SuperAdmin_renderGuru() {
  SuperAdmin_table_('sp-table-guru', [
    { key: 'guru_id', label: 'ID' }, { key: 'email', label: 'Email' }, { key: 'nama_lengkap', label: 'Nama' },
    { label: 'Sekolah', render: function (r) { return SuperAdmin_labelFromId_(SuperAdmin.schools, 'sekolah_id', r.sekolah_id, 'nama_sekolah'); } },
    { key: 'jabatan', label: 'Jabatan' }, { key: 'status', label: 'Status' },
    { label: 'Aksi', render: function (r) {
        return '<button class="sp-btn secondary" onclick="SuperAdmin_editTeacher_(\'' + r.guru_id + '\')">Edit</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_reprovision_(\'' + r.guru_id + '\')">Provisi ulang</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_deleteTeacher_(\'' + r.guru_id + '\', \'' + String(r.nama_lengkap).replace(/'/g, "\\'") + '\')">Hapus</button>';
      } }
  ], SuperAdmin.teachers, 'Belum ada guru.');
}
function SuperAdmin_reprovision_(guruId) {
  runServer('adminReprovisionTeacher', [guruId], { onSuccess: function (res) { SIPENA_toast(res.note || 'Provisioning selesai.'); } });
}
function SuperAdmin_deleteTeacher_(guruId, namaLengkap) {
  if (!confirm('Hapus guru "' + namaLengkap + '"? Aksi ini tidak bisa dibatalkan (spreadsheet pribadinya tetap aman di Drive).')) return;
  runServer('adminDeleteTeacher', [guruId], {
    onSuccess: function () {
      SIPENA_toast('Guru dihapus.');
      runServer('adminGetTeachers', [], { onSuccess: function (rows) { SuperAdmin.teachers = rows; SuperAdmin_renderGuru(); SuperAdmin_refreshSelects(); } });
    }
  });
}

/* ---------- Mapel ---------- */
function SuperAdmin_panelMapel_() {
  return '' +
    '<div class="sp-panel" id="sp-panel-mapel">' +
    '  <div class="sp-section-title">Tambah Mata Pelajaran</div>' +
    '  <form class="sp-form" id="sp-form-mapel">' +
    '    <div class="sp-field"><label>Kode</label><input name="kode_mapel"></div>' +
    '    <div class="sp-field"><label>Nama Mapel</label><input name="nama_mapel" required></div>' +
    '    <div class="sp-field"><label>Jenjang (kosongkan = semua jenjang)</label>' +
    '      <div style="display:flex;gap:12px;padding-top:8px;">' +
    '        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="sp-mapel-jenjang" value="SD"> SD</label>' +
    '        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="sp-mapel-jenjang" value="SMP"> SMP</label>' +
    '        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="sp-mapel-jenjang" value="SMA"> SMA</label>' +
    '        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="sp-mapel-jenjang" value="SMK"> SMK</label>' +
    '      </div>' +
    '    </div>' +
    '    <button class="sp-btn" type="submit">Simpan</button>' +
    SuperAdmin_cancelEditButton_() +
    '  </form>' +
    '  <div class="sp-section-title">Daftar Mata Pelajaran</div>' +
    '  <div id="sp-table-mapel"></div>' +
    '</div>';
}
function SuperAdmin_getMapelJenjangChecked_(form) {
  return Array.prototype.slice.call(form.querySelectorAll('.sp-mapel-jenjang:checked')).map(function (cb) { return cb.value; });
}
function SuperAdmin_setMapelJenjangChecked_(form, jenjangCsv) {
  var selected = String(jenjangCsv || '').split(',').map(function (j) { return j.trim(); });
  form.querySelectorAll('.sp-mapel-jenjang').forEach(function (cb) { cb.checked = selected.indexOf(cb.value) !== -1; });
}
function SuperAdmin_wireMapel_() {
  document.getElementById('sp-form-mapel').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var data = { kode_mapel: f.kode_mapel.value, nama_mapel: f.nama_mapel.value, jenjang: SuperAdmin_getMapelJenjangChecked_(f) };
    var btn = f.querySelector('button[type="submit"]');
    var editId = f.dataset.editId;
    runServer(editId ? 'adminUpdateSubject' : 'adminCreateSubject', editId ? [editId, data] : [data], {
      loadingEl: btn,
      onSuccess: function () {
        SIPENA_toast(editId ? 'Mapel diperbarui.' : 'Mapel tersimpan.');
        SuperAdmin_clearFormEditMode_(f);
        runServer('adminGetSubjects', [], { onSuccess: function (rows) { SuperAdmin.subjects = rows; SuperAdmin_renderMapel(); SuperAdmin_refreshSelects(); } });
      }
    });
  });
}
function SuperAdmin_editSubject_(mapelId) {
  var m = SuperAdmin.subjects.filter(function (r) { return r.mapel_id === mapelId; })[0];
  if (!m) return;
  var f = document.getElementById('sp-form-mapel');
  f.kode_mapel.value = m.kode_mapel || '';
  f.nama_mapel.value = m.nama_mapel || '';
  SuperAdmin_setMapelJenjangChecked_(f, m.jenjang);
  SuperAdmin_setFormEditMode_(f, mapelId);
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function SuperAdmin_renderMapel() {
  SuperAdmin_table_('sp-table-mapel', [
    { key: 'mapel_id', label: 'ID' }, { key: 'kode_mapel', label: 'Kode' },
    { key: 'nama_mapel', label: 'Nama' },
    { label: 'Jenjang', render: function (r) { return r.jenjang ? String(r.jenjang).split(',').join(', ') : 'Semua'; } },
    { key: 'status', label: 'Status' },
    { label: 'Aksi', render: function (r) {
        return '<button class="sp-btn secondary" onclick="SuperAdmin_editSubject_(\'' + r.mapel_id + '\')">Edit</button> ' +
          '<button class="sp-btn secondary" onclick="SuperAdmin_deleteSubject_(\'' + r.mapel_id + '\', \'' + String(r.nama_mapel).replace(/'/g, "\\'") + '\')">Hapus</button>';
      } }
  ], SuperAdmin.subjects, 'Belum ada mata pelajaran.');
}
function SuperAdmin_deleteSubject_(mapelId, namaMapel) {
  if (!confirm('Hapus mata pelajaran "' + namaMapel + '"? Aksi ini tidak bisa dibatalkan.')) return;
  runServer('adminDeleteSubject', [mapelId], {
    onSuccess: function () {
      SIPENA_toast('Mata pelajaran dihapus.');
      runServer('adminGetSubjects', [], { onSuccess: function (rows) { SuperAdmin.subjects = rows; SuperAdmin_renderMapel(); SuperAdmin_refreshSelects(); } });
    }
  });
}

/* ---------- Kelas ---------- */
function SuperAdmin_panelKelas_() {
  return '' +
    '<div class="sp-panel" id="sp-panel-kelas">' +
    '  <div class="sp-section-title">Tambah Kelas</div>' +
    '  <form class="sp-form" id="sp-form-kelas">' +
    '    <div class="sp-field"><label>Sekolah</label><select name="sekolah_id" data-source="sekolah" required></select></div>' +
    '    <div class="sp-field"><label>Nama Kelas</label><input name="nama_kelas" placeholder="7A" required></div>' +
    '    <div class="sp-field"><label>Tingkat</label><input name="tingkat" placeholder="7"></div>' +
    '    <div class="sp-field"><label>Jenjang</label><select name="jenjang"><option value="">Pilih</option><option>SD</option><option>SMP</option><option>SMA</option><option>SMK</option></select></div>' +
    '    <div class="sp-field"><label>Program Keahlian (SMK)</label><input name="program_keahlian"></div>' +
    '    <button class="sp-btn" type="submit">Simpan</button>' +
    '    <button type="button" class="sp-btn secondary sp-btn-cancel-edit hidden" onclick="SuperAdmin_cancelEditKelas_(this.form)">Batal Edit</button>' +
    '  </form>' +
    '  <div class="sp-section-title">Daftar Kelas</div>' +

function SuperAdmin_wireRombel_() {
  document.getElementById('sp-rombel-jenjang').addEventListener('change', function () {
    var jenjang = this.value;
    document.getElementById('sp-rombel-tingkat').innerHTML = SuperAdmin_tingkatOptions_(jenjang);
    document.getElementById('sp-rombel-smk-field').classList.toggle('hidden', jenjang !== 'SMK');
  });

  document.getElementById('sp-form-rombel-single').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var params = {
      sekolah_id: f.sekolah_id.value, jenjang: f.jenjang.value, tingkat: f.tingkat.value,
      jumlah_rombel: parseInt(f.jumlah_rombel.value, 10),
      program_keahlian: f.program_keahlian ? f.program_keahlian.value : ''
    };
    var btn = f.querySelector('button[type="submit"]');
    runServer('adminPreviewRombel', [params], {
      loadingEl: btn,
      onSuccess: function (plan) {
        window.SuperAdmin._singleRombelParams = params;
        SuperAdmin_renderRombelSinglePreview_(plan);
      }
    });
  });

  document.getElementById('sp-rombel-batch-jenjang').addEventListener('change', function () {
    var jenjang = this.value;
    document.querySelectorAll('#sp-rombel-batch-rows .sp-rombel-batch-row').forEach(function (row) {
      row.querySelector('.sp-rb-tingkat').innerHTML = SuperAdmin_tingkatOptions_(jenjang);
      row.querySelector('.sp-rb-smk-field').classList.toggle('hidden', jenjang !== 'SMK');
    });
  });

  SuperAdmin_addRombelBatchRow_();
}

function SuperAdmin_renderRombelSinglePreview_(plan) {
  var el = document.getElementById('sp-rombel-preview');
  var html = '<div class="sp-form" style="flex-direction:column;align-items:stretch;">';
  html += '<div style="font-weight:700;margin-bottom:4px;">Preview: ' + plan.prefix.trim() + ' — ' + plan.jumlah_rombel + ' rombel</div>';
  if (plan.existing.length) html += '<div class="msg">Sudah ada (' + plan.existing.length + '): ' + plan.existing.join(', ') + '</div>';
  if (plan.to_create.length) {
    html += '<div class="msg" style="color:var(--ok);font-weight:600;">Akan dibuat (' + plan.to_create.length + '): ' + plan.to_create.join(' | ') + '</div>';
  } else {
    html += '<div class="msg">Tidak ada rombel baru yang perlu dibuat — semua sudah ada.</div>';
  }
  if (plan.to_deactivate.length) {
    html += '<div class="msg danger">Melebihi jumlah rombel baru, akan DINONAKTIFKAN (bukan dihapus — siswa/nilai/penugasan/jadwal/histori yang sudah ada tetap aman): ' +
      plan.to_deactivate.map(function (d) { return d.nama_kelas; }).join(', ') + '</div>';
  }
  if (plan.conflicts.length) {
    html += '<div class="msg danger">Nama bentrok dengan kelas lain yang sudah ada di sekolah ini, dilewati: ' + plan.conflicts.join(', ') + '</div>';
  }
  html += '<div style="display:flex;gap:10px;margin-top:12px;">';
  html += '<button type="button" class="sp-btn secondary" onclick="document.getElementById(\'sp-rombel-preview\').classList.add(\'hidden\')">Batal</button>';
  if (plan.to_create.length || plan.to_deactivate.length) {
    html += '<button type="button" class="sp-btn" onclick="SuperAdmin_confirmRombelSingle_()">Buat ' + plan.to_create.length + ' Rombel</button>';
  }
  html += '</div></div>';
  el.innerHTML = html;
  el.classList.remove('hidden');
}

function SuperAdmin_confirmRombelSingle_() {
  var params = window.SuperAdmin._singleRombelParams;
  if (!params) return;
  runServer('adminGenerateRombel', [params], {
    onSuccess: function () {
      SIPENA_toast('Rombel berhasil diproses.');
      document.getElementById('sp-rombel-preview').classList.add('hidden');

    }

function SuperAdmin_addRombelBatchRow_() {
  var container = document.getElementById('sp-rombel-batch-rows');
  var jenjang = document.getElementById('sp-rombel-batch-jenjang').value;
  var row = document.createElement('div');
  row.className = 'sp-rombel-batch-row';
  row.style.cssText = 'display:flex;gap:10px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap;';

    '<div class="sp-field"><label>Tingkat</label><select class="sp-rb-tingkat">' + SuperAdmin_tingkatOptions_(jenjang) + '</select></div>' +
    '<div class="sp-field"><label>Jumlah Rombel</label><input class="sp-rb-jumlah" type="number" min="1" max="26" value="1" style="min-width:80px;"></div>' +
    '<div class="sp-field sp-rb-smk-field' + (jenjang === 'SMK' ? '' : ' hidden') + '"><label>Program Keahlian</label><input class="sp-rb-program" placeholder="TKJ"></div>' +
    '<button type="button" class="sp-btn secondary" onclick="this.closest(\'.sp-rombel-batch-row\').remove()">Hapus Baris</button>';
  container.appendChild(row);
}

function SuperAdmin_previewRombelBatch_() {
  var sekolahId = document.getElementById('sp-rombel-batch-sekolah').value;
  var jenjang = document.getElementById('sp-rombel-batch-jenjang').value;
  if (!sekolahId || !jenjang) { SIPENA_toast('Pilih sekolah dan jenjang dulu.', 'error'); return; }

  var entries = [];
  document.querySelectorAll('#sp-rombel-batch-rows .sp-rombel-batch-row').forEach(function (row) {
    var programEl = row.querySelector('.sp-rb-program');
    entries.push({
      tingkat: row.querySelector('.sp-rb-tingkat').value,
      jumlah_rombel: parseInt(row.querySelector('.sp-rb-jumlah').value, 10),
      program_keahlian: programEl ? programEl.value : ''
    });
  });
  if (!entries.length) { SIPENA_toast('Tambah minimal satu baris tingkat.', 'error'); return; }

  runServer('adminPreviewRombelBatch', [sekolahId, jenjang, entries], {
    onSuccess: function (plans) {
      window.SuperAdmin._batchRombel = { sekolah_id: sekolahId, jenjang: jenjang, entries: entries };
      SuperAdmin_renderRombelBatchPreview_(plans);
    }
  });
}

function SuperAdmin_renderRombelBatchPreview_(plans) {
  var el = document.getElementById('sp-rombel-batch-preview');
  var totalCreate = 0, totalDeactivate = 0;
  var html = '<div class="sp-form" style="flex-direction:column;align-items:stretch;">';
  plans.forEach(function (plan) {
    totalCreate += plan.to_create.length;
    totalDeactivate += plan.to_deactivate.length;
    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border);">';
    html += '<div style="font-weight:700;">' + plan.prefix.trim() + ' — ' + plan.jumlah_rombel + ' rombel</div>';
    if (plan.existing.length) html += '<div class="msg">Sudah ada: ' + plan.existing.join(', ') + '</div>';
    html += plan.to_create.length
      ? '<div class="msg" style="color:var(--ok);">Akan dibuat: ' + plan.to_create.join(' | ') + '</div>'
      : '<div class="msg">Tidak ada rombel baru.</div>';
    if (plan.to_deactivate.length) html += '<div class="msg danger">Dinonaktifkan (data aman): ' + plan.to_deactivate.map(function (d) { return d.nama_kelas; }).join(', ') + '</div>';
    if (plan.conflicts.length) html += '<div class="msg danger">Bentrok, dilewati: ' + plan.conflicts.join(', ') + '</div>';
    html += '</div>';
  });
  html += '<div style="display:flex;gap:10px;margin-top:12px;">';
  html += '<button type="button" class="sp-btn secondary" onclick="document.getElementById(\'sp-rombel-batch-preview\').classList.add(\'hidden\')">Batal</button>';
  if (totalCreate || totalDeactivate) {
    html += '<button type="button" class="sp-btn" onclick="SuperAdmin_confirmRombelBatch_()">Generate Semua Rombel (' + totalCreate + ' kelas baru)</button>';
  }
  html += '</div></div>';
  el.innerHTML = html;
  el.classList.remove('hidden');
}

function SuperAdmin_confirmRombelBatch_() {
  var ctx = window.SuperAdmin._batchRombel;
  if (!ctx) return;
  runServer('adminGenerateRombelBatch', [ctx.sekolah_id, ctx.jenjang, ctx.entries], {
    onSuccess: function () {
      SIPENA_toast('Semua rombel berhasil diproses.');
      document.getElementById('sp-rombel-batch-preview').classList.add('hidden');
      runServer('adminGetClasses', [], { onSuccess: function (rows) { SuperAdmin.classes = rows; SuperAdmin_renderKelas(); SuperAdmin_refreshSelects(); } });
    }
  });
}

}
function SuperAdmin_deleteAssignment_(assignmentId) {
  if (!confirm('Hapus penugasan ini? Aksi ini tidak bisa dibatalkan.')) return;
  runServer('adminDeleteAssignment', [assignmentId], {
    onSuccess: function () {
      SIPENA_toast('Penugasan dihapus.');
      runServer('adminGetAssignments', [], { onSuccess: function (rows) { SuperAdmin.assignments = rows; SuperAdmin_renderPenugasan(); } });
    }
  });
}
</script>
