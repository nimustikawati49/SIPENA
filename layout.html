<div class="card" id="sp-auth-card">
  <div class="brand">
    <div class="logo">SP</div>
    <div>
      <div class="title">SIPENA</div>
      <div class="subtitle">Sistem Informasi Penilaian dan Administrasi Guru</div>
    </div>
  </div>

  <div id="sp-loading">
    <div class="spinner"></div>
    <div class="msg" style="text-align:center;">Memeriksa akun Anda&hellip;</div>
  </div>

  <div id="sp-unregistered" class="hidden">
    <span class="badge danger">Akses ditolak</span>
    <div class="msg danger" id="sp-unregistered-msg">Akun belum terdaftar. Hubungi Superadmin.</div>
  </div>

  <div id="sp-error" class="hidden">
    <span class="badge danger">Gagal memuat</span>
    <div class="msg danger" id="sp-error-msg">Terjadi kesalahan saat memuat SIPENA.</div>
  </div>
</div>

<div id="sp-admin-app" class="hidden">
  <div class="sp-topbar">
    <div class="sp-topbar-brand">
      <div class="logo">SP</div>
      <div>
        <div class="title">SIPENA</div>
        <div class="subtitle">Panel Superadmin</div>
      </div>
    </div>
    <div class="sp-topbar-right">
      <button class="sp-btn secondary" id="sp-btn-open-db" type="button">Buka Database Pusat</button>
      <div class="sp-profile-chip">
        <div class="sp-avatar" id="sp-admin-avatar">SA</div>
        <div class="sp-profile-info">
          <div class="sp-profile-name" id="sp-admin-name">Superadmin</div>
          <div class="sp-profile-meta"><span class="sp-role-badge role-superadmin">Superadmin</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="sp-tabs" id="sp-admin-tabs">
    <button class="sp-tab active" data-tab="sekolah">Sekolah</button>
    <button class="sp-tab" data-tab="guru">Guru</button>
    <button class="sp-tab" data-tab="mapel">Mata Pelajaran</button>
    <button class="sp-tab" data-tab="kelas">Kelas</button>
    <button class="sp-tab" data-tab="siswa">Siswa</button>
    <button class="sp-tab" data-tab="tahunajaran">Tahun Ajaran</button>
    <button class="sp-tab" data-tab="penugasan">Penugasan Mengajar</button>
    <button class="sp-tab" data-tab="kenaikankelas">Kenaikan Kelas</button>
  </div>

  <div class="sp-panels" id="sp-admin-panels">
    <!-- diisi scripts-superadmin.html -->
  </div>
</div>

<div id="sp-guru-app" class="hidden">
  <div class="sp-topbar">
    <div class="sp-topbar-brand">
      <div class="logo">SP</div>
      <div>
        <div class="title">SIPENA</div>
        <div class="subtitle">Dashboard Guru</div>
      </div>
    </div>
    <div class="sp-topbar-right">
      <div class="sp-profile-chip">
        <div class="sp-avatar" id="sp-guru-avatar">-</div>
        <div class="sp-profile-info">
          <div class="sp-profile-name" id="sp-guru-name">-</div>
          <div class="sp-profile-meta" id="sp-guru-meta"><span class="sp-role-badge role-guru">Guru</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="sp-tabs" id="sp-guru-tabs">
    <button class="sp-tab active" data-tab="dashboard">Dashboard</button>
    <button class="sp-tab" data-tab="nilai">Nilai</button>
  </div>

  <div class="sp-panels">
    <div class="sp-panel active" id="sp-guru-panel-dashboard">
      <!-- diisi scripts-guru.html -->
    </div>
    <div class="sp-panel" id="sp-guru-panel-nilai">
      <!-- diisi scripts-nilai.html -->
    </div>
  </div>
</div>
