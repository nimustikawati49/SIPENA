      var s = localStorage.getItem('sipenaDarkMode');

      if (s === '1' || (s === null && prefersDark)) {
        document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('dark'); });
      }
    } catch (e) {}
  })();
