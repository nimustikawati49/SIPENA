<script>
window.SIPENA = window.SIPENA || {};

/**
 * runServer(fnName, args, opts)
 * Satu wrapper untuk semua panggilan google.script.run — pusat toast/error
 * handling, supaya tidak diulang inline di tiap tombol (perbaikan atas
 * pola SAG yang menulis withSuccessHandler/withFailureHandler berulang
 * di setiap handler). Juga pusat indikator "sedang memproses" — baik
 * indikator global (dipakai user supaya tidak refresh halaman saat masih
 * menunggu database pusat) maupun spinner per-tombol kalau opts.loadingEl
 * diberikan.
 */
function runServer(fnName, args, opts) {
  opts = opts || {};
  SIPENA_pendingStart_();

  var originalBtnHtml = null;
  if (opts.loadingEl) {
    opts.loadingEl.disabled = true;
    originalBtnHtml = opts.loadingEl.innerHTML;
    opts.loadingEl.innerHTML = '<span class="sp-btn-spinner"></span>Memproses...';
  }

  function finish() {
    SIPENA_pendingEnd_();
    if (opts.loadingEl) {
      opts.loadingEl.disabled = false;
      if (originalBtnHtml !== null) opts.loadingEl.innerHTML = originalBtnHtml;
    }
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      finish();
      if (opts.onSuccess) opts.onSuccess(res);
    })
    .withFailureHandler(function (err) {
      finish();
      var msg = err && err.message ? err.message : String(err);
      if (opts.onError) { opts.onError(msg); } else { SIPENA_toast(msg, 'error'); }
    });
  runner[fnName].apply(runner, args || []);
}

function SIPENA_toast(message, kind) {
  var el = document.createElement('div');
  el.className = 'sp-toast ' + (kind === 'error' ? 'sp-toast-error' : 'sp-toast-ok');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 4000);
}

/**
 * Indikator global "sedang memproses ke/dari database pusat... N detik".
 * Terhitung sebagai counter (bukan boolean) karena beberapa panggilan bisa
 * berjalan bersamaan (mis. SuperAdmin_loadAll menembak 6 sekaligus saat
 * panel dibuka) — indikator baru hilang saat SEMUA panggilan selesai.
 */
var SIPENA_pendingCount_ = 0;
var SIPENA_pendingTimer_ = null;
var SIPENA_pendingStartedAt_ = null;

function SIPENA_pendingEl_() {
  var el = document.getElementById('sp-pending');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sp-pending';
    el.className = 'sp-pending';
    el.innerHTML = '<span class="sp-pending-spinner"></span><span id="sp-pending-text"></span>';
    document.body.appendChild(el);
  }
  return el;
}

function SIPENA_pendingStart_() {
  SIPENA_pendingCount_++;
  var el = SIPENA_pendingEl_();
  el.classList.add('visible');
  if (!SIPENA_pendingTimer_) {
    SIPENA_pendingStartedAt_ = Date.now();
    var tick = function () {
      var secs = Math.max(0, Math.floor((Date.now() - SIPENA_pendingStartedAt_) / 1000));
      var textEl = document.getElementById('sp-pending-text');
      if (textEl) textEl.textContent = 'Menghubungi database pusat… ' + secs + ' detik';
    };
    tick();
    SIPENA_pendingTimer_ = setInterval(tick, 1000);
  }
}

function SIPENA_pendingEnd_() {
  SIPENA_pendingCount_ = Math.max(0, SIPENA_pendingCount_ - 1);
  if (SIPENA_pendingCount_ === 0) {
    var el = document.getElementById('sp-pending');
    if (el) el.classList.remove('visible');
    if (SIPENA_pendingTimer_) { clearInterval(SIPENA_pendingTimer_); SIPENA_pendingTimer_ = null; }
  }
}

(function () {
  function show(id) {
    ['sp-loading', 'sp-authenticated', 'sp-unregistered', 'sp-error'].forEach(function (elId) {
      document.getElementById(elId).classList.toggle('hidden', elId !== id);
    });
  }

  function renderAuth(auth) {
    if (!auth || !auth.role) {
      document.getElementById('sp-unregistered-msg').textContent =
        (auth && auth.message) || 'Akun belum terdaftar. Hubungi Superadmin.';
      show('sp-unregistered');
      return;
    }

    document.getElementById('sp-email').textContent = auth.email || '-';
    document.getElementById('sp-role').textContent = auth.role;

    if (auth.role === 'GURU') {
      document.getElementById('sp-row-guru').classList.remove('hidden');
      document.getElementById('sp-row-sekolah').classList.remove('hidden');
      document.getElementById('sp-guru-id').textContent = auth.guruId || '-';
      document.getElementById('sp-sekolah-id').textContent = auth.sekolahId || '-';
    }

    window.SIPENA.auth = auth; // hanya untuk keperluan UI, tidak pernah dikirim balik sebagai identitas tepercaya
    show('sp-authenticated');

    if (auth.role === 'SUPERADMIN' && window.SuperAdmin_init) {
      window.SuperAdmin_init();
    }
    if (auth.role === 'GURU' && window.GuruApp_init) {
      window.GuruApp_init();
    }
  }

  function bootApp() {
    runServer('getAuth', [], {
      onSuccess: renderAuth,
      onError: function (msg) {
        document.getElementById('sp-error-msg').textContent = msg;
        show('sp-error');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', bootApp);
})();
</script>
