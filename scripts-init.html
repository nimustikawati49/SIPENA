<script>
window.SIPENA = window.SIPENA || {};

/**
 * runServer(fnName, args, opts)
 * Satu wrapper untuk semua panggilan google.script.run — pusat toast/error
 * handling, supaya tidak diulang inline di tiap tombol (perbaikan atas
 * pola SAG yang menulis withSuccessHandler/withFailureHandler berulang
 * di setiap handler). Juga pusat indikator "sedang memproses" — baik
 * indikator global (dipakai user supaya tidak refresh halaman saat masih
 * menunggu database pusat) maupun spinner per-tombol kalau opts.loadingEl
 * diberikan.
 */
function runServer(fnName, args, opts) {
  opts = opts || {};
  SIPENA_pendingStart_(fnName);

  var originalBtnHtml = null;
  if (opts.loadingEl) {
    opts.loadingEl.disabled = true;
    originalBtnHtml = opts.loadingEl.innerHTML;
    opts.loadingEl.innerHTML = '<span class="sp-btn-spinner"></span>Memproses...';
  }

  function finish() {
    SIPENA_pendingEnd_();
    if (opts.loadingEl) {
      opts.loadingEl.disabled = false;
      if (originalBtnHtml !== null) opts.loadingEl.innerHTML = originalBtnHtml;
    }
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      finish();
      if (opts.onSuccess) opts.onSuccess(res);
    })
    .withFailureHandler(function (err) {
      finish();
      var msg = err && err.message ? err.message : String(err);
      if (opts.onError) { opts.onError(msg); } else { SIPENA_toast(msg, 'error'); }
    });
  runner[fnName].apply(runner, args || []);
}

function SIPENA_toast(message, kind) {
  var el = document.createElement('div');
  el.className = 'sp-toast ' + (kind === 'error' ? 'sp-toast-error' : 'sp-toast-ok');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 4000);
}

/**
 * Indikator global "sedang memproses ke/dari database pusat... N detik".
 * Terhitung sebagai counter (bukan boolean) karena beberapa panggilan bisa
 * berjalan bersamaan (mis. SuperAdmin_loadAll menembak 6 sekaligus saat
 * panel dibuka) — indikator baru hilang saat SEMUA panggilan selesai.
 */
var SIPENA_pendingCount_ = 0;
var SIPENA_pendingTimer_ = null;
var SIPENA_pendingStartedAt_ = null;
var SIPENA_pendingLabelText_ = 'Menghubungi database pusat';

/**
 * SIPENA_pendingCallLabel_(fnName)
 * Fungsi bergaya "getMyX/saveMyX/dst." (konvensi yang sudah dipakai
 * konsisten di seluruh backend untuk data milik guru sendiri, tersimpan
 * di spreadsheet pribadinya) ditampilkan sebagai "Menghubungi data Anda"
 * — bukan "database pusat", supaya guru tidak bingung kenapa aksi yang
 * cuma menyentuh datanya sendiri terkesan menghubungi server sekolah.
 * Selain itu (getAuth, semua admin*) tetap "database pusat" karena
 * memang membaca/menulis spreadsheet central.
 */
function SIPENA_pendingCallLabel_(fnName) {
  return /^(get|save|update|upload|create|delete|reset)My[A-Z]/.test(fnName || '')
    ? 'Menghubungi data Anda' : 'Menghubungi database pusat';
}

function SIPENA_pendingEl_() {
  var el = document.getElementById('sp-pending');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sp-pending';
    el.className = 'sp-pending';
    el.innerHTML = '<div class="sp-pending-row"><span class="sp-pending-spinner"></span><span id="sp-pending-text"></span></div>' +
      '<div class="sp-pending-track"><div class="sp-pending-fill"></div></div>';
    document.body.appendChild(el);
  }
  return el;
}

function SIPENA_pendingStart_(fnName) {
  SIPENA_pendingCount_++;
  SIPENA_pendingLabelText_ = SIPENA_pendingCallLabel_(fnName);
  var el = SIPENA_pendingEl_();
  el.classList.add('visible');
  if (!SIPENA_pendingTimer_) {
    SIPENA_pendingStartedAt_ = Date.now();
    var tick = function () {
      var secs = Math.max(0, Math.floor((Date.now() - SIPENA_pendingStartedAt_) / 1000));
      var textEl = document.getElementById('sp-pending-text');
      if (textEl) textEl.textContent = SIPENA_pendingLabelText_ + '… ' + secs + ' detik';
    };
    tick();
    SIPENA_pendingTimer_ = setInterval(tick, 1000);
  }
}

function SIPENA_pendingEnd_() {
  SIPENA_pendingCount_ = Math.max(0, SIPENA_pendingCount_ - 1);
  if (SIPENA_pendingCount_ === 0) {
    var el = document.getElementById('sp-pending');
    if (el) el.classList.remove('visible');
    if (SIPENA_pendingTimer_) { clearInterval(SIPENA_pendingTimer_); SIPENA_pendingTimer_ = null; }
  }
}

/**
 * SIPENA_initials_(name)
 * Ambil huruf depan dari sampai 2 kata pertama, untuk avatar bulat —
 * dipakai di topbar Superadmin & Guru dan kartu profil Guru.
 */
function SIPENA_initials_(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(function (p) { return p; });
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

/**
 * SIPENA_avatarHtml_(fotoUrl, name)
 * Isi untuk div.sp-avatar — foto asli kalau ada, inisial nama kalau
 * belum ada foto. Dipakai di chip/panel pojok kanan atas & kartu profil.
 */
function SIPENA_avatarHtml_(fotoUrl, name) {
  if (fotoUrl) return '<img src="' + fotoUrl + '" alt="">';
  return SIPENA_initials_(name);
}

/**
 * SIPENA_wireTimeInput_(el)
 * Input jam dipakai sebagai <input type="text"> berformat "HH:MM"
 * (bukan <input type="time">) supaya tidak muncul segmen AM/PM bawaan
 * browser yang tampil rusak ("--:-- --") kalau locale OS 12-jam — auto
 * sisip ":" setelah 2 digit supaya tetap nyaman diketik.
 */
function SIPENA_wireTimeInput_(el) {
  if (!el) return;
  el.addEventListener('input', function () {
    var digits = el.value.replace(/\D/g, '').slice(0, 4);
    el.value = digits.length >= 3 ? digits.slice(0, 2) + ':' + digits.slice(2) : digits;
  });
}

/**
 * SIPENA_greetingLabel_() / SIPENA_startSidebarClock_(greetingElId, clockElId, nameGetter)
 * "Selamat pagi/siang/sore/malam, {nama}" + jam berjalan di sidebar —
 * nameGetter dipanggil ULANG tiap detik (bukan sekali di awal) supaya
 * begitu nama guru/Superadmin selesai dimuat dari server, sapaan
 * otomatis ikut ter-update tanpa perlu panggilan terpisah.
 */
function SIPENA_greetingLabel_() {
  var h = new Date().getHours();
  if (h >= 4 && h < 11) return 'Selamat pagi';
  if (h >= 11 && h < 15) return 'Selamat siang';
  if (h >= 15 && h < 18) return 'Selamat sore';
  return 'Selamat malam';
}

function SIPENA_startSidebarClock_(greetingElId, clockElId, nameGetter) {
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var greetingEl = document.getElementById(greetingElId);
    var clockEl = document.getElementById(clockElId);
    if (!greetingEl || !clockEl) return;
    var name = (typeof nameGetter === 'function' ? nameGetter() : '') || '';
    greetingEl.textContent = SIPENA_greetingLabel_() + (name && name !== '-' ? ', ' + name : '') + ' 😊';
    var now = new Date();
    clockEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
}

/**
 * SIPENA_mapelIcon_(namaMapel)
 * Emoji sesuai kata kunci nama mapel — ilustrasi ringan supaya daftar
 * mata pelajaran tidak cuma teks polos, tanpa perlu aset gambar
 * eksternal (aman dari batasan sandbox Apps Script). Fallback buku
 * generik kalau tidak ada kecocokan.
 */
var SIPENA_MAPEL_ICON_RULES_ = [
  { test: /matematika|math|hitung/i, icon: '📐' },
  { test: /bahasa indonesia/i, icon: '📖' },
  { test: /bahasa inggris|english/i, icon: '🔤' },
  { test: /bahasa|linguistik/i, icon: '🗣️' },
  { test: /ipa|sains|fisika|kimia|biologi/i, icon: '🔬' },
  { test: /ips|sejarah|sosiolog|ekonomi|geografi/i, icon: '🌍' },
  { test: /agama|akhlak|budi pekerti/i, icon: '🕌' },
  { test: /pkn|pancasila|kewarganegaraan/i, icon: '🇮🇩' },
  { test: /olahraga|penjas|pjok/i, icon: '⚽' },
  { test: /seni|musik|tari|rupa|budaya/i, icon: '🎨' },
  { test: /informatika|tik|komputer|teknologi/i, icon: '💻' },
  { test: /prakarya|kewirausahaan|tata boga|tata busana/i, icon: '🛠️' },
  { test: /bimbingan konseling|^bk$/i, icon: '💬' }
];
function SIPENA_mapelIcon_(namaMapel) {
  var name = String(namaMapel || '');
  for (var i = 0; i < SIPENA_MAPEL_ICON_RULES_.length; i++) {
    if (SIPENA_MAPEL_ICON_RULES_[i].test.test(name)) return SIPENA_MAPEL_ICON_RULES_[i].icon;
  }
  return '📘';
}

var SIPENA_JADWAL_HARI_URUTAN_ = ['SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];

function SIPENA_hariLabel_(hari) {
  return hari ? (hari.charAt(0) + hari.slice(1).toLowerCase()) : '-';
}

/**
 * SIPENA_collapsibleHtml_(headerHtml, bodyHtml, startOpen)
 * Satu blok "klik header untuk buka daftarnya, klik lagi untuk tutup" —
 * dipakai di mana pun ada daftar yang bisa jadi panjang (per sekolah, per
 * guru, dsb.) supaya tidak semua tabel tampil sekaligus tanpa diminta.
 * Header & body dibungkus DIV yang sama (.sp-collapse) supaya nested
 * collapsible (mis. per-guru DI DALAM per-sekolah) tidak saling
 * mempengaruhi — toggle cuma menyentuh child langsung, bukan turunan.
 */
function SIPENA_collapsibleHtml_(headerHtml, bodyHtml, startOpen) {
  var openCls = startOpen ? '' : ' hidden';
  var caret = startOpen ? '&#9662;' : '&#9656;';
  return '<div class="sp-collapse">' +
    '<button type="button" class="sp-collapse-header" onclick="SIPENA_toggleCollapse_(this)">' +
      '<span class="sp-collapse-caret">' + caret + '</span> ' + headerHtml +
    '</button>' +
    '<div class="sp-collapse-body' + openCls + '">' + bodyHtml + '</div>' +
  '</div>';
}

function SIPENA_toggleCollapse_(headerBtn) {
  var wrap = headerBtn.parentElement;
  var body = wrap.querySelector(':scope > .sp-collapse-body');
  var willOpen = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  headerBtn.querySelector('.sp-collapse-caret').innerHTML = willOpen ? '&#9662;' : '&#9656;';
}

function SIPENA_todayHari_() {
  var names = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
  return names[new Date().getDay()];
}

function SIPENA_todayDateLabel_() {
  var d = new Date();
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  return dd + '/' + mm;
}

/**
 * SIPENA_weekScheduleGridHtml_(rows, onCardClickFnName)
 * Kartu mingguan Senin-Sabtu, hari ini disorot — dipakai bersama oleh
 * dashboard guru (read-only) dan tab Jadwal guru (klik kartu untuk
 * mengajukan perubahan) supaya keduanya konsisten & tidak dobel logika.
 * onCardClickFnName: nama fungsi global dipanggil dengan jadwal_id saat
 * kartu diklik, atau falsy untuk versi non-interaktif (dashboard).
 */
function SIPENA_weekScheduleGridHtml_(rows, onCardClickFnName) {
  var byHari = {};
  rows.forEach(function (r) { (byHari[r.hari] = byHari[r.hari] || []).push(r); });
  var todayHari = SIPENA_todayHari_();
  var todayLabel = SIPENA_todayDateLabel_();

  return '<div class="sp-jadwal-week">' + SIPENA_JADWAL_HARI_URUTAN_.map(function (hari) {
    var isToday = hari === todayHari;
    var entries = (byHari[hari] || []).slice().sort(function (a, b) { return String(a.jam_mulai).localeCompare(String(b.jam_mulai)); });
    var cardsHtml = entries.map(function (r) {
      var clickAttr = onCardClickFnName
        ? ' onclick="' + onCardClickFnName + '(\'' + r.jadwal_id + '\')" style="cursor:pointer;" title="Klik untuk ajukan perubahan"'
        : '';
      return '<div class="sp-jadwal-card"' + clickAttr + '>' +
        '<div class="sp-jadwal-card-kelas">' + r.nama_kelas + '</div>' +
        '<div class="sp-jadwal-card-mapel">' + r.nama_mapel + '</div>' +
        '<div class="sp-jadwal-card-jam">' + r.jam_mulai + '–' + r.jam_selesai + '</div>' +
        '</div>';
    }).join('') || '<div class="msg" style="margin:0;font-size:11.5px;">-</div>';
    return '<div class="sp-jadwal-day' + (isToday ? ' sp-jadwal-day-today' : '') + '">' +
      '<div class="sp-jadwal-day-head">' + SIPENA_hariLabel_(hari) + (isToday ? '<div class="sp-jadwal-day-date">' + todayLabel + '</div>' : '') + '</div>' +
      '<div class="sp-jadwal-day-body">' + cardsHtml + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

/**
 * SIPENA_readFileAsBase64_(file, maxKb, callback)
 * FileReader murni client-side (bukan download, jadi tidak kena batasan
 * iframe sandbox yang sempat menggagalkan fitur export — lihat catatan
 * di Utils_writeExportSheetAndGetUrl_). callback(base64, mimeType, fileName).
 */
function SIPENA_readFileAsBase64_(file, maxKb, callback) {
  if (file.size > maxKb * 1024) {
    SIPENA_toast('Ukuran file terlalu besar (maks ' + maxKb + ' KB).', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function (e) {
    var base64 = String(e.target.result).split(',')[1];
    callback(base64, file.type, file.name);
  };
  reader.onerror = function () { SIPENA_toast('Gagal membaca file.', 'error'); };
  reader.readAsDataURL(file);
}

/**
 * SIPENA_toggleCornerPanel_(triggerId, panelId)
 * Buka/tutup panel pojok kanan atas + tutup otomatis kalau klik di luar.
 */
function SIPENA_toggleCornerPanel_(triggerId, panelId) {
  var trigger = document.getElementById(triggerId);
  var panel = document.getElementById(panelId);
  var willOpen = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !willOpen);
  trigger.classList.toggle('open', willOpen);
  if (willOpen) {
    setTimeout(function () {
      document.addEventListener('click', function closeOnOutside(e) {
        if (!panel.contains(e.target) && !trigger.contains(e.target)) {
          panel.classList.add('hidden');
          trigger.classList.remove('open');
          document.removeEventListener('click', closeOnOutside);
        }
      });
    }, 0);
  }
}

/**
 * SIPENA_toggleSidebar_(btn)
 * Ciutkan/perluas sidebar kiri jadi ikon saja — state disimpan di
 * localStorage supaya tetap konsisten antar reload/tab, berlaku untuk
 * sidebar Superadmin maupun Guru (yang mana pun sedang tampil).
 */
function SIPENA_toggleSidebar_(btn) {
  var sidebar = btn.closest('.sp-sidebar');
  if (!sidebar) return;
  var collapsed = sidebar.classList.toggle('collapsed');
  btn.setAttribute('title', collapsed ? 'Perluas menu' : 'Ciutkan menu');
  try { localStorage.setItem('sipena_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
}

(function () {
  try {
    if (localStorage.getItem('sipena_sidebar_collapsed') === '1') {
      document.querySelectorAll('.sp-sidebar').forEach(function (s) { s.classList.add('collapsed'); });
    }
  } catch (e) {}
})();

(function () {
  function show(id) {
    ['sp-landing', 'sp-loading', 'sp-unregistered', 'sp-error'].forEach(function (elId) {
      document.getElementById(elId).classList.toggle('hidden', elId !== id);
    });
  }

  function renderAuth(auth) {
    if (!auth || !auth.role) {
      document.getElementById('sp-unregistered-msg').textContent =
        (auth && auth.message) || 'Akun belum terdaftar. Hubungi Superadmin.';
      show('sp-unregistered');
      return;
    }

    window.SIPENA.auth = auth; // hanya untuk keperluan UI, tidak pernah dikirim balik sebagai identitas tepercaya

    // Superadmin/Guru punya tampilan aplikasi penuh masing-masing —
    // kartu login kecil (dipakai untuk loading/unregistered/error) tidak
    // lagi relevan begitu salah satunya tampil, jadi disembunyikan total
    // supaya tidak menumpuk di atas panel/dashboard.
    if (auth.role === 'SUPERADMIN' && window.SuperAdmin_init) {
      document.getElementById('sp-auth-card').classList.add('hidden');
      document.getElementById('sp-admin-name').textContent = auth.nama || auth.email;
      document.getElementById('sp-corner-admin-avatar').innerHTML = SIPENA_avatarHtml_(auth.fotoUrl, auth.nama || auth.email);
      document.getElementById('sp-corner-admin-avatar-big').innerHTML = SIPENA_avatarHtml_(auth.fotoUrl, auth.nama || auth.email);
      document.getElementById('sp-form-corner-admin').nama.value = auth.nama || '';
      window.SuperAdmin_init();
      return;
    }
    if (auth.role === 'GURU' && window.GuruApp_init) {
      document.getElementById('sp-auth-card').classList.add('hidden');
      document.getElementById('sp-guru-name').textContent = auth.namaLengkap || auth.email;
      document.getElementById('sp-corner-guru-avatar').textContent = SIPENA_initials_(auth.namaLengkap || auth.email);
      var metaBits = ['<span class="sp-role-badge role-guru">Guru</span>'];
      if (auth.jabatan && auth.jabatan.trim().toLowerCase() !== 'guru') metaBits.push(auth.jabatan);
      if (auth.namaSekolah) metaBits.push(auth.namaSekolah);
      document.getElementById('sp-guru-meta').innerHTML = metaBits.join(' · ');
      window.GuruApp_init();
      return;
    }
  }

  function bootApp() {
    show('sp-loading');
    runServer('getAuth', [], {
      onSuccess: renderAuth,
      onError: function (msg) {
        document.getElementById('sp-error-msg').textContent = msg;
        show('sp-error');
      }
    });
  }

  // Landing page tampil dulu (klik "Masuk ke Sistem" baru memicu
  // pengecekan akun) — sebelumnya getAuth langsung jalan begitu halaman
  // dibuka, tanpa jeda perkenalan sama sekali.
  window.SIPENA_enterApp_ = bootApp;
  document.addEventListener('DOMContentLoaded', function () { show('sp-landing'); });
})();
</script>
