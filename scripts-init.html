<script>
window.SIPENA = window.SIPENA || {};

/**
 * runServer(fnName, args, opts)
 * Satu wrapper untuk semua panggilan google.script.run — pusat toast/error
 * handling, supaya tidak diulang inline di tiap tombol (perbaikan atas
 * pola SAG yang menulis withSuccessHandler/withFailureHandler berulang
 * di setiap handler).
 */
function runServer(fnName, args, opts) {
  opts = opts || {};
  if (opts.loadingEl) opts.loadingEl.disabled = true;
  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (opts.loadingEl) opts.loadingEl.disabled = false;
      if (opts.onSuccess) opts.onSuccess(res);
    })
    .withFailureHandler(function (err) {
      if (opts.loadingEl) opts.loadingEl.disabled = false;
      var msg = err && err.message ? err.message : String(err);
      if (opts.onError) { opts.onError(msg); } else { SIPENA_toast(msg, 'error'); }
    });
  runner[fnName].apply(runner, args || []);
}

function SIPENA_toast(message, kind) {
  var el = document.createElement('div');
  el.className = 'sp-toast ' + (kind === 'error' ? 'sp-toast-error' : 'sp-toast-ok');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 4000);
}

(function () {
  function show(id) {
    ['sp-loading', 'sp-authenticated', 'sp-unregistered', 'sp-error'].forEach(function (elId) {
      document.getElementById(elId).classList.toggle('hidden', elId !== id);
    });
  }

  function renderAuth(auth) {
    if (!auth || !auth.role) {
      document.getElementById('sp-unregistered-msg').textContent =
        (auth && auth.message) || 'Akun belum terdaftar. Hubungi Superadmin.';
      show('sp-unregistered');
      return;
    }

    document.getElementById('sp-email').textContent = auth.email || '-';
    document.getElementById('sp-role').textContent = auth.role;

    if (auth.role === 'GURU') {
      document.getElementById('sp-row-guru').classList.remove('hidden');
      document.getElementById('sp-row-sekolah').classList.remove('hidden');
      document.getElementById('sp-guru-id').textContent = auth.guruId || '-';
      document.getElementById('sp-sekolah-id').textContent = auth.sekolahId || '-';
    }

    window.SIPENA.auth = auth; // hanya untuk keperluan UI, tidak pernah dikirim balik sebagai identitas tepercaya
    show('sp-authenticated');

    if (auth.role === 'SUPERADMIN' && window.SuperAdmin_init) {
      window.SuperAdmin_init();
    }
  }

  function bootApp() {
    google.script.run
      .withSuccessHandler(renderAuth)
      .withFailureHandler(function (err) {
        document.getElementById('sp-error-msg').textContent = err && err.message ? err.message : String(err);
        show('sp-error');
      })
      .getAuth();
  }

  document.addEventListener('DOMContentLoaded', bootApp);
})();
</script>
