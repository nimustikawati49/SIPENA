<script>
window.SIPENA = window.SIPENA || {};

/**
 * runServer(fnName, args, opts)
 * Satu wrapper untuk semua panggilan google.script.run — pusat toast/error
 * handling, supaya tidak diulang inline di tiap tombol (perbaikan atas
 * pola SAG yang menulis withSuccessHandler/withFailureHandler berulang
 * di setiap handler). Juga pusat indikator "sedang memproses" — baik
 * indikator global (dipakai user supaya tidak refresh halaman saat masih
 * menunggu database pusat) maupun spinner per-tombol kalau opts.loadingEl
 * diberikan.
 */
function runServer(fnName, args, opts) {
  opts = opts || {};
  SIPENA_pendingStart_();

  var originalBtnHtml = null;
  if (opts.loadingEl) {
    opts.loadingEl.disabled = true;
    originalBtnHtml = opts.loadingEl.innerHTML;
    opts.loadingEl.innerHTML = '<span class="sp-btn-spinner"></span>Memproses...';
  }

  function finish() {
    SIPENA_pendingEnd_();
    if (opts.loadingEl) {
      opts.loadingEl.disabled = false;
      if (originalBtnHtml !== null) opts.loadingEl.innerHTML = originalBtnHtml;
    }
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      finish();
      if (opts.onSuccess) opts.onSuccess(res);
    })
    .withFailureHandler(function (err) {
      finish();
      var msg = err && err.message ? err.message : String(err);
      if (opts.onError) { opts.onError(msg); } else { SIPENA_toast(msg, 'error'); }
    });
  runner[fnName].apply(runner, args || []);
}

function SIPENA_toast(message, kind) {
  var el = document.createElement('div');
  el.className = 'sp-toast ' + (kind === 'error' ? 'sp-toast-error' : 'sp-toast-ok');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 4000);
}

/**
 * Indikator global "sedang memproses ke/dari database pusat... N detik".
 * Terhitung sebagai counter (bukan boolean) karena beberapa panggilan bisa
 * berjalan bersamaan (mis. SuperAdmin_loadAll menembak 6 sekaligus saat
 * panel dibuka) — indikator baru hilang saat SEMUA panggilan selesai.
 */
var SIPENA_pendingCount_ = 0;
var SIPENA_pendingTimer_ = null;
var SIPENA_pendingStartedAt_ = null;

function SIPENA_pendingEl_() {
  var el = document.getElementById('sp-pending');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sp-pending';
    el.className = 'sp-pending';
    el.innerHTML = '<span class="sp-pending-spinner"></span><span id="sp-pending-text"></span>';
    document.body.appendChild(el);
  }
  return el;
}

function SIPENA_pendingStart_() {
  SIPENA_pendingCount_++;
  var el = SIPENA_pendingEl_();
  el.classList.add('visible');
  if (!SIPENA_pendingTimer_) {
    SIPENA_pendingStartedAt_ = Date.now();
    var tick = function () {
      var secs = Math.max(0, Math.floor((Date.now() - SIPENA_pendingStartedAt_) / 1000));
      var textEl = document.getElementById('sp-pending-text');
      if (textEl) textEl.textContent = 'Menghubungi database pusat… ' + secs + ' detik';
    };
    tick();
    SIPENA_pendingTimer_ = setInterval(tick, 1000);
  }
}

function SIPENA_pendingEnd_() {
  SIPENA_pendingCount_ = Math.max(0, SIPENA_pendingCount_ - 1);
  if (SIPENA_pendingCount_ === 0) {
    var el = document.getElementById('sp-pending');
    if (el) el.classList.remove('visible');
    if (SIPENA_pendingTimer_) { clearInterval(SIPENA_pendingTimer_); SIPENA_pendingTimer_ = null; }
  }
}

/**
 * SIPENA_initials_(name)
 * Ambil huruf depan dari sampai 2 kata pertama, untuk avatar bulat —
 * dipakai di topbar Superadmin & Guru dan kartu profil Guru.
 */
function SIPENA_initials_(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(function (p) { return p; });
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

/**
 * SIPENA_avatarHtml_(fotoUrl, name)
 * Isi untuk div.sp-avatar — foto asli kalau ada, inisial nama kalau
 * belum ada foto. Dipakai di chip/panel pojok kanan atas & kartu profil.
 */
function SIPENA_avatarHtml_(fotoUrl, name) {
  if (fotoUrl) return '<img src="' + fotoUrl + '" alt="">';
  return SIPENA_initials_(name);
}

/**
 * SIPENA_readFileAsBase64_(file, maxKb, callback)
 * FileReader murni client-side (bukan download, jadi tidak kena batasan
 * iframe sandbox yang sempat menggagalkan fitur export — lihat catatan
 * di Utils_writeExportSheetAndGetUrl_). callback(base64, mimeType, fileName).
 */
function SIPENA_readFileAsBase64_(file, maxKb, callback) {
  if (file.size > maxKb * 1024) {
    SIPENA_toast('Ukuran file terlalu besar (maks ' + maxKb + ' KB).', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function (e) {
    var base64 = String(e.target.result).split(',')[1];
    callback(base64, file.type, file.name);
  };
  reader.onerror = function () { SIPENA_toast('Gagal membaca file.', 'error'); };
  reader.readAsDataURL(file);
}

/**
 * SIPENA_toggleCornerPanel_(triggerId, panelId)
 * Buka/tutup panel pojok kanan atas + tutup otomatis kalau klik di luar.
 */
function SIPENA_toggleCornerPanel_(triggerId, panelId) {
  var trigger = document.getElementById(triggerId);
  var panel = document.getElementById(panelId);
  var willOpen = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !willOpen);
  trigger.classList.toggle('open', willOpen);
  if (willOpen) {
    setTimeout(function () {
      document.addEventListener('click', function closeOnOutside(e) {
        if (!panel.contains(e.target) && !trigger.contains(e.target)) {
          panel.classList.add('hidden');
          trigger.classList.remove('open');
          document.removeEventListener('click', closeOnOutside);
        }
      });
    }, 0);
  }
}

/**
 * SIPENA_toggleSidebar_(btn)
 * Ciutkan/perluas sidebar kiri jadi ikon saja — state disimpan di
 * localStorage supaya tetap konsisten antar reload/tab, berlaku untuk
 * sidebar Superadmin maupun Guru (yang mana pun sedang tampil).
 */
function SIPENA_toggleSidebar_(btn) {
  var sidebar = btn.closest('.sp-sidebar');
  if (!sidebar) return;
  var collapsed = sidebar.classList.toggle('collapsed');
  btn.setAttribute('title', collapsed ? 'Perluas menu' : 'Ciutkan menu');
  try { localStorage.setItem('sipena_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
}

(function () {
  try {
    if (localStorage.getItem('sipena_sidebar_collapsed') === '1') {
      document.querySelectorAll('.sp-sidebar').forEach(function (s) { s.classList.add('collapsed'); });
    }
  } catch (e) {}
})();

(function () {
  function show(id) {
    ['sp-loading', 'sp-unregistered', 'sp-error'].forEach(function (elId) {
      document.getElementById(elId).classList.toggle('hidden', elId !== id);
    });
  }

  function renderAuth(auth) {
    if (!auth || !auth.role) {
      document.getElementById('sp-unregistered-msg').textContent =
        (auth && auth.message) || 'Akun belum terdaftar. Hubungi Superadmin.';
      show('sp-unregistered');
      return;
    }

    window.SIPENA.auth = auth; // hanya untuk keperluan UI, tidak pernah dikirim balik sebagai identitas tepercaya

    // Superadmin/Guru punya tampilan aplikasi penuh masing-masing —
    // kartu login kecil (dipakai untuk loading/unregistered/error) tidak
    // lagi relevan begitu salah satunya tampil, jadi disembunyikan total
    // supaya tidak menumpuk di atas panel/dashboard.
    if (auth.role === 'SUPERADMIN' && window.SuperAdmin_init) {
      document.getElementById('sp-auth-card').classList.add('hidden');
      document.getElementById('sp-admin-name').textContent = auth.nama || auth.email;
      document.getElementById('sp-corner-admin-avatar').innerHTML = SIPENA_avatarHtml_(auth.fotoUrl, auth.nama || auth.email);
      document.getElementById('sp-corner-admin-avatar-big').innerHTML = SIPENA_avatarHtml_(auth.fotoUrl, auth.nama || auth.email);
      document.getElementById('sp-form-corner-admin').nama.value = auth.nama || '';
      window.SuperAdmin_init();
      return;
    }
    if (auth.role === 'GURU' && window.GuruApp_init) {
      document.getElementById('sp-auth-card').classList.add('hidden');
      document.getElementById('sp-guru-name').textContent = auth.namaLengkap || auth.email;
      document.getElementById('sp-corner-guru-avatar').textContent = SIPENA_initials_(auth.namaLengkap || auth.email);
      var metaBits = ['<span class="sp-role-badge role-guru">Guru</span>'];
      if (auth.jabatan && auth.jabatan.trim().toLowerCase() !== 'guru') metaBits.push(auth.jabatan);
      if (auth.namaSekolah) metaBits.push(auth.namaSekolah);
      document.getElementById('sp-guru-meta').innerHTML = metaBits.join(' · ');
      window.GuruApp_init();
      return;
    }
  }

  function bootApp() {
    runServer('getAuth', [], {
      onSuccess: renderAuth,
      onError: function (msg) {
        document.getElementById('sp-error-msg').textContent = msg;
        show('sp-error');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', bootApp);
})();
</script>
